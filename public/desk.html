/* ============ THE MARGIN CURVE, REGRESSED FROM THE BOOK (v234) ============
   The one number nobody can look up is what margin a price should carry. Typing it makes it
   an opinion; taking it from the ledger makes it evidence.
   Every priced sale is a data point: what it actually sold for, against what it actually
   cost to serve at that size. Margin falls as lots grow, and it falls smoothly in the log of
   size rather than linearly, so the fit is ordinary least squares of margin on ln(quantity).
   THE BOOK SAYS SO PLAINLY: a half unit has been earning about 49%, a unit 41%, three units
   47%, and anything over seven units 24%. The curve is that relationship, not those numbers.
   REBATE AND ZERO-VALUE ROWS ARE EXCLUDED. A free unit is not a price anyone accepted, and
   including it would drag the whole curve toward zero at exactly the sizes it is thinnest.
   IT REFITS AS THE DESK TRADES. Twenty more orders and the curve is twenty orders better
   informed, with no decision taken by anyone. Below minPoints it refuses to fit and says so
   rather than regressing three sales into a pricing policy. */
function marginCurve(){
  const c=pxCost();
  const rows=pricedSales.filter(s=>s.qty>0.009&&s.total>0.009&&!s.rebate&&!s.cancelled)
    .map(s=>{const base=c.effEx*s.qty+(c.delPerOrder||0);
      return {x:Math.log(s.qty),y:(s.total-base)/s.total};})
    .filter(p=>isFinite(p.x)&&isFinite(p.y)&&p.y>-2&&p.y<0.95);
  const n=rows.length;
  if(n<PRICE_ENGINE.minPoints)
    return {fitted:false,n,a:PRICE_ENGINE.fallbackMargin,b:0,r2:null,
            at:q=>PRICE_ENGINE.fallbackMargin};
  const sx=rows.reduce((a,p)=>a+p.x,0),sy=rows.reduce((a,p)=>a+p.y,0);
  const mx=sx/n,my=sy/n;
  let sxy=0,sxx=0;rows.forEach(p=>{sxy+=(p.x-mx)*(p.y-my);sxx+=(p.x-mx)*(p.x-mx);});
  let b=sxx>1e-9?sxy/sxx:0;
  /* margin may not RISE with size. On a thin book one big well-priced order can tilt the
     line upward, which would quote bulk dearer per unit than retail and invert the ladder. */
  if(b>0)b=0;
  const a=my-b*mx;
  let ssr=0,sst=0;rows.forEach(p=>{const f=a+b*p.x;ssr+=(p.y-f)*(p.y-f);sst+=(p.y-my)*(p.y-my);});
  const r2=sst>1e-9?+(1-ssr/sst).toFixed(3):null;
  const at=q=>{const raw=a+b*Math.log(Math.max(0.01,q))+PRICE_ENGINE.marginShift;
    return Math.max(PRICE_ENGINE.clamp.lo,Math.min(PRICE_ENGINE.clamp.hi,raw));};
  return {fitted:true,n,a:+a.toFixed(4),b:+b.toFixed(4),r2,at,
          spread:{lo:+at(12.5).toFixed(3),hi:+at(0.5).toFixed(3)}};
}

/* ============ DELIVERY, RECORDED AT LAST (v173) ============

     lot cost           = effective x size + delivery + buffer

   cushion for the things no line item catches; it defaults to zero and is his to set,
   because inventing a number here would quietly move every price.

   the anchors reproduce his own cards exactly and the model is calibrated rather than
   imposed. DEMAND then moves every tier together through the same live signal the board
   already computes, capped, so a dear fortnight lifts the ask and a dead one does not.

     marginal price per unit non-increasing    tiers strictly ordered at every shared size

   IT DOES NOT REPRICE ANYTHING BY ITSELF. PRICE_TIERS stays the quote board and the
   printed cards stay valid; this runs beside them and shows the gap. Cards already in

/* ============ THE COST OF DOING BUSINESS (v209) ============

   happen before a unit reaches a customer -- the trip, the bag, the packing, the ones
   who never pay -- has sat outside the model, so every tier has been judged against a
   cost that was only part of the story.

   Costs are classified by HOW THEY SCALE, because that, not the total, is what decides
   which order is worth taking:

     PER UNIT   scales with size. Salt and leak. Twice the order, twice the cost.
     PER ORDER  does not scale AT ALL. One trip, one bag, one conversation, whether it
                is half a unit or six. This is the line that decides small against bulk,
                and the desk has never carried it.
     PER MONTH  carries whether anything sells or not.
     RISK       a share that never arrives. DERIVED from what has actually been written
                off and provisioned, never typed.

   EVERY UNMEASURED COST IS null AND STAYS null. A figure invented here would move every
   price on the board and be indistinguishable from one that was counted. The panel says
   what each unknown is worth instead, so the cost of NOT measuring it is visible. */
const COST_BOOK={
  perOrder:{
    delivery:  {rm:null, what:'the trip, per order', how:'log deliveries and deliveryCost() derives it; until then PRICE_TIERS.basis.delivery stands in'},
    packaging: {rm:null, what:'bag, label, seal',    how:'one month of packaging spend divided by orders packed'},
    handling:  {rm:null, what:'packing, messaging, meeting', how:'minutes per order at what an hour of yours is worth'},
  },
  perMonth:{
    phone:   {rm:null, what:'phone and data'},
    storage: {rm:null, what:'where the stock sits'},
    other:   {rm:null, what:'anything else that recurs'},
  },
  /* what an hour of his time is worth. Null on purpose: it is the single figure that
     most changes whether small orders are worth taking, and it is his to state. */
  /* RM150,000 a year over 2,080 contracted hours (8 x 5 x 52). Stated 11 Aug 2026.
     It is a CONVENTION, not a measurement: the salt hours are evenings and weekends, so
     the true opportunity cost of one of them may sit either side of the salary rate.
     It is the standard basis and it is defensible; it is not a fact about a Tuesday night. */
  hourRM:72.12,
  minutesPerOrder:null

/* Risk read off the book rather than assumed. Two different risks, deliberately apart:
   a supplier who takes money and sends nothing is a SOURCING loss and lands on cost;
   a customer who never pays is a REVENUE loss and lands on price. */
function riskRates(){
  const supLost=purchases.filter(p=>p.defaulted||p.writtenOff).reduce((a,p)=>a+poCash(p),0);
  const supSpent=purchases.reduce((a,p)=>a+poCash(p),0);
  const provision=Math.max(0,+(arGross-ar).toFixed(2));      // what the ladder already discounts
  return {
    supplierLostRM:+supLost.toFixed(2), supplierSpentRM:+supSpent.toFixed(2),
    supplierPct:supSpent>0?+(supLost/supSpent*100).toFixed(2):null,
    badDebtRM:provision, revenueRM:+revTotal.toFixed(2),
    badDebtPct:revTotal>0?+(provision/revTotal*100).toFixed(2):null

/* The full stack for one order of q units, and the two figures that answer different

function costToServe(q,opts){
  opts=opts||{};

  const carried=opts.fullLeak?full:c.eff;                     // what the price is asked to carry
  const dl=deliveryCost();
  const O=COST_BOOK.perOrder;
  const time=(COST_BOOK.hourRM!=null&&COST_BOOK.minutesPerOrder!=null)

    {k:'Delivery',  rm:O.delivery.rm!=null?O.delivery.rm:(opts.collects?0:dl.rm), assumed:O.delivery.rm==null&&!dl.observed&&!opts.collects},
    {k:'Packaging', rm:O.packaging.rm, assumed:false},
    {k:'Handling',  rm:O.handling.rm!=null?O.handling.rm:time, assumed:false},
  ];
  const perOrder=perOrderParts.reduce((a,p)=>a+(p.rm||0),0);
  const known=perOrderParts.filter(p=>p.rm!=null).length;
  const goods=carried*q;
  return {q,goods:+goods.toFixed(2),carried:+carried.toFixed(4),full:+full.toFixed(4),
    absorbedRM:+((full-carried)*q).toFixed(2),
    perOrderParts,perOrder:+perOrder.toFixed(2),knownParts:known,totalParts:perOrderParts.length,

const PRICE_MODEL={
  buffer:0,                       // RM per lot, his to set
  anchorAt:1,                     // the size every tier's margin is calibrated on
  /* OFF by default so the ladder reproduces his own anchors exactly and the drift
     column shows only where arithmetic disagrees with the hand-solved taper. Switch it
     on and every tier moves together with the live signal. */
  useDemand:false,
  demandCap:10                    // and never by more than this, either way
};
/* the margin each tier implies at its anchor, on TODAY's fully-loaded cost. Derived, not
   typed: change the cost and these stay put, which is what makes them a policy. */
function tierTargets(){
  const c=pxCost(), dl=deliveryCost();
  const out={};
  PRICE_TIERS.tiers.forEach(t=>{
    const q=PRICE_MODEL.anchorAt;
    const i=PRICE_TIERS.sizes.findIndex(x=>Math.abs(x-q)<0.009);
    const anchor=i>=0?t.prices[i]:null;
    if(anchor==null){out[t.code]=null;return;}
    const cost=(c.effEx!=null?c.effEx:c.eff)*q+dl.rm+PRICE_MODEL.buffer;   // v234: SS retired, every tier is delivered
    out[t.code]=+((anchor-cost)/anchor).toFixed(4);
  });

}
function solveLadder(){
  const c=pxCost(), dl=deliveryCost(), tg=tierTargets();
  const sg=(PRICE_MODEL.useDemand&&typeof pxSignals==='function')?pxSignals():{net:0};
  const lift=1+Math.max(-PRICE_MODEL.demandCap,Math.min(PRICE_MODEL.demandCap,sg.net||0))/100;
  const lotCost=(q,code)=>(c.effEx!=null?c.effEx:c.eff)*q+dl.rm+PRICE_MODEL.buffer;   // v234: goods per unit, delivery once per lot
  const out={};
  PRICE_TIERS.tiers.forEach(t=>{
    const m=tg[t.code]; if(m==null){out[t.code]=null;return;}
    const rows=[];
    PRICE_TIERS.sizes.forEach((q,i)=>{
      if(t.prices[i]==null){rows.push(null);return;}       // a tier only runs as far as it runs
      const cost=lotCost(q,t.code);
      let p=Math.round(cost/(1-m)*lift/5)*5;               // R6: multiples of five (v245)
      const fl=floorTotal(q);   // v240: NOT c.eff. eff already carries the per-unit delivery, and floorTotal adds one per lot, so passing it charged delivery twice and lifted every floor
      /* R4 REPORTS, IT DOES NOT CLAMP. Lifting a price to the floor would silence the
         very thing cards.py insists stays visible: SS is deliberately under it above a
         half unit because it carries no delivery, and suppressing that to make the
         ladder look clean is the one move forbidden here. */
      rows.push({q:q,p:p,cost:+cost.toFixed(2),floor:+fl.toFixed(2),underFloor:p<fl-0.009});
    });
    /* R3: the rate must strictly fall as the lot grows. Walking upward and pulling a
       price DOWN to satisfy it is the only direction that never raises an ask the
       customer was already quoted lower. */
    for(let i=1;i<rows.length;i++){
      const r=rows[i],prev=rows.slice(0,i).filter(Boolean).pop();
      if(!r||!prev)continue;

         epsilon before the floor cost a whole RM10 step wherever the modelled rate came
         out flat, which knocked SS down at every size and broke its own anchor.
         A flat rate is reported below, not engineered away: SS carries no per-lot
         delivery, so nothing in the COST gives its ladder a reason to taper. The taper
         on the printed SS card is a commercial choice, and this is where that shows. */
      const cap=Math.floor(prev.p/prev.q*r.q/5+1e-6)*5;
      if(r.p>cap&&cap>0){r.p=cap;r.underFloor=r.p<r.floor-0.009;}

      const r=out[t.code]&&out[t.code][i]; if(!r)return;
      if(last!=null&&r.p<=last){r.p=last+10;r.bumped=true;r.underFloor=r.p<r.floor-0.009;}
      last=r.p;
    });

  return {rows:out,eff:c.eff,repl:c.repl,shrink:c.shrink,deliv:dl,
          buffer:PRICE_MODEL.buffer,lift:+((lift-1)*100).toFixed(1),targets:tg};
}
const tierOf=code=>PRICE_TIERS.tiers.find(t=>t.code===code)||null;
/* price for one tier at one size, or null where that tier does not run that far */
function tierPrice(code,q){
  const t=tierOf(code); if(!t)return null;
  const i=PRICE_TIERS.sizes.findIndex(s=>Math.abs(s-q)<0.009);

/* every tier at every carded size, measured against the desk's own live floor */
/* ============ THE REFERENCE LADDER (v280) ============
   The printed board is gone. It was three frozen prices per size, and frozen prices against a
   cost that moves need a headroom walk to tell you when they have gone stale. This does not:
   every figure below is derived from today's cost, so it cannot go stale, and there is nothing
   to reprint when cost moves.

   FOUR MARKUPS ON THE LOT COST, and they are markups on cost rather than margins on the price,
   because a 100% margin on price is arithmetically impossible while 100% markup simply means
   double. The lot cost is the effective cost of the salt, after the leak, plus one delivery per
   order rather than one per unit.

   IT IS REFERENCE, NOT POLICY. Nothing here refuses a sale or moves a figure. The floor is the
   only line that binds, and it binds by being reported, not by clamping. */
const REF={
  floor:0.15,       // refuse below this
  good:1/3,         // a sale worth taking
  great:2/3,        // a sale worth repeating
  ceiling:1.00      // double cost; above this, expect to be argued with

const REF_POINTS=[
  {k:'floor',  label:'Floor',   m:REF.floor,   why:'refuse below this'},
  {k:'good',   label:'Good',    m:REF.good,    why:'worth taking'},
  {k:'great',  label:'Great',   m:REF.great,   why:'worth repeating'},
  {k:'ceiling',label:'Ceiling', m:REF.ceiling, why:'double cost'}
];
/* The lot cost a price has to beat: the salt, after the leak, plus ONE delivery for the order. */
function lotCost(q,opts){
  opts=opts||{};
  const C=pxCost();
  const per=(C.effEx!=null?C.effEx:C.eff);
  const del=opts.collects?0:(C.delPerOrder!=null?C.delPerOrder:0);
  return +(per*q+del).toFixed(4);
}
/* The four reference prices at any size. The floor is exact, because rounding a floor down
   would put it under itself; the three asks round UP to the ten, which is the house rule. */
function priceLadder(q,opts){
  const lot=lotCost(q,opts);
  const out={q:q,lot:+lot.toFixed(2),perUnit:+(lot/q).toFixed(2)};
  REF_POINTS.forEach(pt=>{
    const raw=lot*(1+pt.m);
    const p=pt.k==='floor'?+raw.toFixed(2):Math.ceil(raw/10)*10;
    out[pt.k]={total:p,rate:+(p/q).toFixed(2),markup:+(pt.m*100).toFixed(2),
               margin:+(((p-lot)/p)*100).toFixed(1)};
  });
  return out;
}
function tierBoard(){
  const c=pxCost();
  return PRICE_TIERS.sizes.map(q=>{
    const L=priceLadder(q);
    return {q:q, floor:L.floor.total, lot:L.lot, perUnit:L.perUnit,
      cells:REF_POINTS.map(pt=>{
        const cell=L[pt.k];
        return {code:pt.label, p:cell.total, rate:cell.rate, margin:cell.margin,
                markup:cell.markup, floor:L.floor.total, why:pt.why,
                underFloor:cell.total<L.floor.total-0.009, underWalk:false,
                shortBy:+(cell.total-L.floor.total).toFixed(2)};

function tierBoardOLD(){
  const c=pxCost();
  return PRICE_TIERS.sizes.map((q,i)=>{
    /* v249: THE FLOOR IS PER CELL NOW, because it is per tier. The row still carries one
       figure so the Floor column has something to print, and that figure is the BAND floor
       with no tier applied: the absolute refusal line under everything. Each cell is tested
       against its own tier's floor, which is the one that actually binds. */
    const fl=floorTotal(q), wk=Math.ceil(floorTotal(q)/5)*5;
    const cells=PRICE_TIERS.tiers.map(t=>{
      const p=t.prices[i];
      const tf=floorTotal(q,null,{tier:t.code});
      if(p==null)return {code:t.code,p:null,floor:+tf.toFixed(2)};
      const rate=p/q, margin=(rate-c.eff)/rate*100;
      return {code:t.code,p:p,rate:+rate.toFixed(2),margin:+margin.toFixed(1),

/* ============ BOARD HEADROOM (v207) ============

   about the ladder at four costs: that every total is a multiple of five, that the rate
   never rises with the lot, and that nothing sits under its floor. Swept across 366

   rate stops rising. Asserting a property the code enforces two lines earlier proves

   it moves with cost and can never fall through its own floor. Unbounded, and useless.

   The question that still matters is the same one asked of the prices you are ACTUALLY
   charging. Those are frozen the moment a customer agrees them, so they are what goes stale
   when cost rises. This walks the replacement rate up one ringgit at a time and returns the
   first rate at which a live price on the book falls under its floor, and whose.

                   overReplace:+(x.p-replLot).toFixed(2),

/* the money floor for a lot: the band margin floor, or a named lot floor, whichever bites */
function floorTotal(q,eff,opts){

     carries an averaged delivery charge, and multiplied it by the quantity, so delivery was
     floored once per unit instead of once per order. A 6 unit floor carried six deliveries. */
  opts=opts||{};

     FALL as the quantity ROSE: at 6.25 unit it stood at RM433.66 and at 6.5 unit at RM425.73,
     so a buyer taking more salt faced a lower refusal line. One markup on the lot cost cannot
     invert, because the lot cost only ever rises with quantity. */

const capForParty=id=>{try{return associateIds().indexOf(id)>=0?RULES.creditKg.associate:RULES.creditKg.retail;}catch(e){return RULES.creditKg.retail;}};
function boundaryScan(){

    const p=txPrice(s);if(!(p>0))return;

    if(owed>0.009)credit[s.customer]=+((credit[s.customer]||0)+owed).toFixed(2);});
  Object.keys(credit).forEach(c=>{
    const cap=capForParty(c),tier=cap===RULES.creditKg.associate?'associate':'retail';
    if(credit[c]>cap+0.009)
      add('breach','Credit cap',c,kg(credit[c])+' out and unpaid','over the '+kg(cap)+' '+tier+' cap, so hand over nothing further until it clears');
    else if(credit[c]>=cap-0.009)
      add('watch','Credit cap',c,kg(credit[c])+' out and unpaid','exactly at the '+kg(cap)+' '+tier+' cap, so the next unit breaches it');});

    b.soldAfter?b.soldAfter:(b.pursue>0?fmt0(b.pursue)+' still outstanding':'no balance outstanding'),
    'permanent ban since '+b.since+(b.soldAfter?'; the ban was BREACHED, not lifted: an amendment is not an exception, and the next request is a refusal'
      :b.pursue>0?'; sell nothing further, and keep pursuing the balance'
      :'; the balance is settled, but the ban is not time-limited and does not lift with it')));
  /* 1b. age of credit. Size is not the thing that hurts; time is. Money delivered
     against and still unpaid past creditDays is a breach on its own terms. */

    add('breach','Credit age',s.customer,fmt0(outstandingOf(s))+' out for '+dd+' days','past the '+RULES.creditDays+'-day limit, so it is collection rather than trade');});

       lesson about price belongs. An open one still breaches, because that CAN be acted on. */

     bought, so the reconstructed shelf is NEGATIVE: the desk is being asked to believe salt
     it never received left a shelf it was never on. The margin is only right because the

  else if(!stockCounted)
    add('watch','Never counted',PRODUCTS[PROD].name,kg(currentStock)+' derived, not counted',
      'the shelf is what the ledger implies rather than what anyone has seen; a count would beat it, as it does for salt');
  /* 2d. THE BOARD HAS REPRICED ITSELF (v233). The basis is frozen to a lot, so a purchase is
     the one thing that moves it, and that should be a deliberate moment rather than a silent
     shift. A newer lot than the locked one means the desk is quoting a basis nobody signed. */
  (function(){const LK=priceLockState(PROD);if(LK.state!=='stale'||!LK.cur)return;
    add('breach','Board unpriced',PRODUCTS[PROD].name,

      'the basis is locked to the '+kg(LK.lock.lot.qty)+' lot of '+LK.lock.lot.date+'; every floor has moved with the new lot, so re-lock it on the Pricing tab');})();

  const free=+(currentStock-defKg).toFixed(2);
  /* v228: only where a shelf is meaningful. A product with no purchases on the book has
     already been reported above for exactly that, and repeating the same fault in a
     second row with different words teaches you to skim the list. Wording is the
     product's own, so this no longer says 'salt' while oil is selected. */

  else if(defKg>0.009&&free<1)add('watch','Free to sell','stock',kg(free)+' free','almost everything left is already spoken for');

  arList.forEach(s=>{const dd=dbet(s.date),v=txAdvance(s);
    if(dd>=RULES.fullProvDays)add('breach','Aged receivable',s.customer,fmt0(v)+' at '+dd+' days','fully provisioned, so treat it as lost unless it is actively recovered');
    else if(dd>=14)add('watch','Aged receivable',s.customer,fmt0(v)+' at '+dd+' days','75% provisioned, fully provisioned at '+RULES.fullProvDays+' days');});

    const dd=dbet(supplierReceivable.since);
    if(dd>=RULES.fullProvDays)add('breach','Aged recoverable',supplierReceivable.party,fmt0(supRecovGross)+' at '+dd+' days','fully provisioned');
    else if(dd>=8)add('watch','Aged recoverable',supplierReceivable.party,fmt0(supRecovGross)+' at '+dd+' days',Math.round(provRate(dd)*100)+'% provisioned, fully provisioned at '+RULES.fullProvDays+' days');}

/* the commit boundary: which provisional entries will probably read differently

function commitRisks(){

    const code=p.orderCode||'new entry',who=p.party||'new party';
    if(p.mode==='amend'&&p.direction==='SELL'&&(+p.cash||0)>0.009){
      const older=sales.filter(s=>s.customer===p.party&&ovKey(s)!==p.orderKey&&txAdvance(s)>0.009&&s.date<(p.date||'9999'));
      if(older.length)out.push({sev:'risk',rule:'Late cash',who:who,what:fmt0(+p.cash)+' booked on '+code,
        why:'this party still owes on an older order ('+older.map(o=>fmt0(txAdvance(o))+' from '+o.date).join(', ')+'), so at commit some of this may clear that instead'});}
    if(p.mode==='amend'&&p.sameDay)
      out.push({sev:'risk',rule:'Same-day settlement',who:who,what:code+' amended on its own order date',
        why:'at commit this folds into the opening line, so the separate movement you can see now will disappear'});
    if(p.mode==='new'&&p.direction==='SELL'&&(+p.kg||0)>0.009)
      out.push({sev:'risk',rule:'Cost basis',who:who,what:kg(+p.kg)+' costed at the weighted average '+fmt(wavgBuy)+'/unit',
        why:'at commit the traceable lot cost is assigned instead, so the margin on this sale will move'});});

function recompute(){

     product-scoped tab is unchanged, because they all read the globals this function sets
     and this function now reads one product's rows. `sales` and `purchases` stay WHOLE, so
     the consolidated tabs that read them directly, Ledger, Customers, Network and Map, keep
     seeing the entire business. That is the whole architecture: scope here, not in fifteen

  defaultPO=_B.filter(p=>p.defaulted);

     no cost of goods, because no sale happened. The row stays in `sales` so the salt it moved

     cost of goods are built from. Removing the row instead would put the salt back. */

  buyRM=receivedPO.reduce((s,p)=>s+poRecvKg(p)*poRate(p),0);

  arList=_S.filter(s=>txAdvance(s)>0.009);
  arGross=arList.reduce((a,s)=>a+txAdvance(s),0);
  ar=Math.max(0,+arList.reduce((a,s)=>a+txAdvance(s)*(1-provRate(dbet(s.date))),0).toFixed(2)); // net of provisioning

function cashFlow(){

  const outRM=+purchases.reduce((a,p)=>a+poCash(p),0).toFixed(2);   // a defaulted lot was still paid for, so it still left the bank; a pending one has paid nothing
  const inj=+cashAdjust.filter(x=>x.kind==='injection').reduce((a,x)=>a+ +x.amount,0).toFixed(2);
  const spend=+cashAdjust.filter(x=>x.kind!=='injection').reduce((a,x)=>a+ +x.amount,0).toFixed(2);

     so it is carried on the refund entry itself and dated by paidOn (v170) */
  const refPaid=+customerRefunds.filter(r=>r.paidOn).reduce((a,r)=>a+ +r.amount,0).toFixed(2);
  const net=+(inRM+inj-outRM-spend-refPaid).toFixed(2);

     the count date: everything up to it is already inside the counted figure, and only
     what has been recorded since is added on top. The opening balance is then worked
     backwards rather than asked for, because nobody remembers it and a guess would be
     inherited by every figure downstream. */
  const cnt=null;                    // v180: no count, no balance, flow only
  /* A COUNT IS AS AT THE START OF ITS DATE (v156), so anything recorded ON that date
     accrues on top of it rather than being swallowed by it. With <= instead, cash paid
     later the same day as the count vanished: it was treated as already inside a figure
     taken before it happened.
     And cash is dated by paidOn where the row carries one, not by the order date. An
     order agreed on the 26th and paid on the 28th moves money on the 28th; dating it to
     the 26th put it on the wrong side of the count. Same fault as the delivery dates,
     same fix. */
  const upto=d=>!cnt||(d<cnt.on);
  const netTo=cnt?+(
      sales.reduce((a,s)=>a+(s.paidSplit
        ?s.paidSplit.filter(t=>upto(t.date)).reduce((x,t)=>x+ +t.amount,0)
        :(upto(s.paidOn||s.date)?(+s.cash||0):0)),0)
    - purchases.filter(p=>upto(p.paidOn||p.date)).reduce((a,p)=>a+poCash(p),0)
    + cashAdjust.filter(x=>x.kind==='injection'&&upto(x.date)).reduce((a,x)=>a+ +x.amount,0)
    - cashAdjust.filter(x=>x.kind!=='injection'&&upto(x.date)).reduce((a,x)=>a+ +x.amount,0)
    - customerRefunds.filter(r=>r.paidOn&&upto(r.paidOn)).reduce((a,r)=>a+ +r.amount,0)
    ).toFixed(2):null;

  const impliedOpen=cnt?+(cnt.amount-netTo).toFixed(2):null;

     recorded. It is reported, never reconciled away. */
  const drift=(cnt&&OPENING_CASH!=null)?+(impliedOpen-OPENING_CASH).toFixed(2):null;
  /* v275: WHOLE BOOK, to match the rest of this function. Cash out has always been both
     books because there is one bank account; dueIn read the ACTIVE product's receivable, so
     the object was not internally commensurable and Today printed the pair side by side.
     COMPUTED FROM THE PRIMITIVES, NOT BY RE-RUNNING recompute() PER PRODUCT. The obvious
     version of this walked PROD and called recompute() inside cashFlow(), which forecast()
     calls mid-flight: it would have clobbered the very globals the caller was using. The
     receivable is the same arithmetic as recompute's own ar, applied to the whole book. The
     supplier recoverable is added once, from its own record, because it belongs to the book
     it happened on and there is exactly one of it. */
  const dueIn=+(sales.filter(s=>txAdvance(s)>0.009)
      .reduce((a,s)=>a+txAdvance(s)*(1-provRate(dbet(s.date))),0)
    +((typeof supplierReceivable!=='undefined'&&supplierReceivable&&supplierReceivable.status!=='writtenOff'&&supplierReceivable.status!=='closed')
        ?supplierReceivable.amount*(1-provRate(dbet(supplierReceivable.since))):0)
  ).toFixed(2);                                               // net of provisioning, so it is what you can reasonably expect
  const billsOut=+purchases.reduce((a,p)=>a+(p.pending?0:Math.max(0,(+p.total)-poCash(p))),0).toFixed(2);   // a pending lot is not a bill: nothing has been bought yet
  const refundsOut=+customerRefunds.filter(r=>!r.paidOn).reduce((a,r)=>a+ +r.amount,0).toFixed(2);   // a paid refund is no longer promised away

}

  const MS=86400000;
  const win=n=>{const from=new Date(TODAY.getTime()-n*MS);
    return +pricedSales.filter(s=>new Date(s.date)>=from).reduce((a,s)=>a+txPhys(s),0).toFixed(2);};
  const kg14=win(14),kg28=win(28);
  const rate14=+(kg14/14).toFixed(3),rate28=+(kg28/28).toFixed(3);
  const rate=rate14>0?rate14:rate28;
  const free=+(currentStock-defKg).toFixed(2),usable=Math.max(0,free);
  const days=rate>0?+(usable/rate).toFixed(1):null;
  const zero=days!=null?new Date(TODAY.getTime()+days*MS):null;
  return {kg14,kg28,rate14,rate28,rate,free,days,zero,
    reorderAt:RULES.reorderKg,below:free<RULES.reorderKg,shortBy:+(RULES.reorderKg-usable).toFixed(2)};
}

     and then get out of the way; an emoji does the opposite and dates badly besides. */
  const KIND={stock:'Shelf',buy:'Buy',collect:'Collect',pay:'Pay',rule:'Rule',

  /* v273: TAB_LABEL was local to this function and the Whiteboard needed the same map for

     label maps drift apart and the one that drifts is always the one nobody is looking at. */

     the widths mean something across severities rather than only inside one */
  const peak=a.reduce((m,x)=>Math.max(m,x.rm),0);
  const row=x=>`<div class="act" style="--sev:${ACTSEV[x.sev].c}">

  const block=(list,title,note)=>list.length?`

    ${note?`<div class="dsc" style="margin-top:9px">${note}</div>`:''}`:'';

/* ============ LOT OUTLOOK: what each lot could earn, and what it will (v180) ============
   He asked for a per-lot forecast carrying a MAXIMUM and an EXPECTED, on the reasoning
   that the maximum is what motivates pricing high and losing less salt, while the
   expected is what the book will actually do. Both are computed from observed trade
   only: there is no fitted demand curve here and no assumed growth.

   THE TWO NUMBERS, AND WHY THEY DIFFER
     MAXIMUM   every remaining unit sold at the best rate the desk HAS ACTUALLY BEEN
               PAID, with nothing lost. It is a ceiling made of evidence rather than
               hope, which is the only kind worth chasing.
     EXPECTED  every remaining unit less the observed shrinkage, sold at the rate the
               desk has actually been averaging lately.
   The gap between them splits cleanly into two costs, and that split is the point of
   the whole panel:
     lost to LEAKAGE  units that never reach a customer, valued at the expected rate
     lost to PRICE    the units that do, sold below the best rate already proven

   FIFO, because a lot is a physical thing. Delivered units are consumed from the oldest
   received lot first, so "what is left of this lot" means something. The desk's sale
   costs are traceable, but not every row carries one, and inventing an attribution per
   sale would be worse than a stated convention.

   CONFIDENCE GROWS WITH THE BOOK, which is what he meant by the estimate sharpening
   over time. Each expected rate carries the number of orders behind it and the spread
   of those orders, so a figure resting on three sales says so. Nothing here pretends to
   a precision the trade has not yet earned. */
function lotOutlook(){
  const c=pxCost(), shrink=pxShrinkRate();
  const priced=pricedSales.filter(s=>s.qty>0&&s.total>0&&!s.cancelled);
  const rates=priced.map(s=>({r:s.total/s.qty,d:s.date,who:s.customer,q:s.qty}));
  /* THE CEILING HAS TO RESPECT THE LADDER, or it is a fantasy (v180).
     A first cut priced every remaining unit at the best rate ever paid, RM210/unit. That
     rate was achieved on a HALF UNIT. Applying it to eighty-odd units implied RM18,589
     of revenue and would have had him chasing a number nobody will pay, which is worse
     than no ceiling at all: an unreachable target is just a way of feeling behind.
     So both figures are built on the SIZE MIX HE ACTUALLY SELLS. The remaining salt is
     split the way his orders have historically split, and each slice is priced at the
     best, and the average, that HIS OWN BOOK has achieved at that size. The ceiling then
     means something specific and reachable: if every order you write from here matched
     your own best price for that size, this is what the shelf is worth. */
  const bands=[];
  priced.forEach(s=>{
    const q=s.qty, key=PRICE_TIERS.sizes.reduce((best,x)=>Math.abs(x-q)<Math.abs(best-q)?x:best,PRICE_TIERS.sizes[0]);
    const k=q>6.25?'bulk':key;
    let b=bands.find(x=>x.k===k);
    if(!b){b={k:k,q:(k==='bulk'?q:key),units:0,rates:[]};bands.push(b);}
    b.units+=q; b.rates.push(s.total/s.qty);
  });
  const totUnits=bands.reduce((a,b)=>a+b.units,0)||1;
  bands.forEach(b=>{
    b.share=b.units/totUnits;
    b.best=Math.max.apply(null,b.rates);
    b.mean=b.rates.reduce((a,x)=>a+x,0)/b.rates.length;
    b.n=b.rates.length;
  });
  bands.sort((a,b)=>b.share-a.share);
  /* a blended rate: the mix weighting each size's own achieved rate */
  const mixBest=bands.reduce((a,b)=>a+b.share*b.best,0);
  const mixMean=bands.reduce((a,b)=>a+b.share*b.mean,0);
  const best=rates.length?rates.reduce((m,x)=>x.r>m.r?x:m,rates[0]):null;   // still reported, as a fact
  const MS=86400000, since=new Date(TODAY.getTime()-60*MS);
  const recent=rates.filter(x=>new Date(x.d)>=since);
  const pool=recent.length>=3?recent:rates;
  const mean=mixMean;
  const sd=pool.length>1?Math.sqrt(pool.reduce((a,x)=>a+Math.pow(x.r-(pool.reduce((y,z)=>y+z.r,0)/pool.length),2),0)/(pool.length-1)):0;
  /* FIFO: consume physically delivered units from the oldest received lot first */
  const lots=purchases.filter(poLive).filter(p=>poRecvKg(p)>0.0001)
    .map(p=>({p:p,recv:poRecvKg(p),date:p.receivedOn||p.date,
              rate:+(p.total/p.qty).toFixed(2),sup:p.supplier}))
    .sort((a,b)=>a.date<b.date?-1:1);
  /* THE COUNT ALWAYS WINS, here as everywhere (v180). A first cut rebuilt what was left
     by subtracting delivered units and a share of the shrinkage plug from each lot, and
     arrived at 88.52 unit against a counted 78.4. Any reconstruction that disagrees with
     the count is wrong by definition on this desk, so the counted stock is ALLOCATED
     instead: newest lot first, because the shelf is what arrived most recently and the
     older salt has been sold. The lot totals then tie to the count by construction. */
  let shelf=currentStock;
  const rows=lots.slice().reverse().map(l=>{
    const left=+Math.min(l.recv,Math.max(0,shelf)).toFixed(2); shelf-=left;
    const consumed=+(l.recv-left).toFixed(2);
    const leak=0;
    const cost=+(l.recv*l.rate).toFixed(2);
    const maxRev=+(left*mixBest).toFixed(2);
    const expUnits=+(left*(1-shrink)).toFixed(2);
    const expRev=+(expUnits*mean).toFixed(2);
    const costLeft=+(left*l.rate).toFixed(2);
    return {date:l.date,sup:l.sup,recv:l.recv,rate:l.rate,cost:cost,
      consumed:+consumed.toFixed(2),leak:+leak.toFixed(2),left:left,
      maxRev:maxRev,maxMar:+(maxRev-costLeft).toFixed(2),
      expRev:expRev,expMar:+(expRev-costLeft).toFixed(2),
      costLeft:costLeft,
      /* THE GAP HAS THREE PARTS, NOT TWO, and the third is real rather than a rounding
         nuisance. Closing the leak is worth the lost units at TODAY's price. Pricing up is
         worth the extra rate on the salt that survives. The remainder is what you only get
         by doing BOTH: the better price on the units the leak would have eaten. Reporting
         two parts that quietly failed to sum to the whole would be the sort of arithmetic
         this desk exists to refuse. */
      lostLeak:+(left*shrink*mixMean).toFixed(2),
      lostPrice:+(left*(1-shrink)*(mixBest-mixMean)).toFixed(2),
      lostBoth:+(left*shrink*(mixBest-mixMean)).toFixed(2)};
  });
  rows.reverse();                                   // back into receipt order for display
  const sum=k=>+rows.reduce((a,r)=>a+r[k],0).toFixed(2);

/* one row per supplier, built from the lots themselves rather than from a list kept by hand */
function supplierStats(){
  /* v236: THIS PRODUCT'S SUPPLIERS ONLY. It read the whole purchase book, so with two
     products the table put an oil supplier at RM7/unit next to a salt supplier at RM50 and
     called one of them 81% of supply: 50 unit of oil counted against 206 unit of salt as
     though a unit were a unit. Share, weighted rate, best rate and fill were all computed
     across two commodities that share nothing but a column heading. Sourcing sits under the
     product band, so it shows the selected product and nothing else. */
  const m={};
  const _B=pPurch(PROD);
  _B.forEach(p=>{const id=p.supplier;
    if(!m[id])m[id]={id,lots:0,kg:0,rm:0,recvKg:0,defaults:0,defaultRM:0,pending:0,pendingKg:0,first:p.date,last:p.date,rates:[]};
    const o=m[id];
    if(p.pending){o.pending++;o.pendingKg+=p.qty;return;}          // agreed only: not a lot, not a rate
    o.lots++;o.kg+=p.qty;o.rm+=p.total;o.recvKg+=poRecvKg(p);
    o.rates.push({r:+(p.total/p.qty).toFixed(2),d:p.date,kg:p.qty});
    if(p.defaulted){o.defaults++;o.defaultRM+=p.total;}
    if(p.date<o.first)o.first=p.date;if(p.date>o.last)o.last=p.date;});
  const tot=Object.values(m).reduce((a,o)=>a+o.kg,0)||1;
  /* Share of ALL TIME flatters a book that has changed hands. A supplier who defaulted
     three weeks ago still carries a quarter of the all-time figure while supplying
     nothing, so the recent window is the one that describes who actually feeds the desk
     now. Both are reported; the warning reads the recent one. */
  const RECENT=30, from=new Date(TODAY.getTime()-RECENT*86400000);   // the same window the pricing engine uses for the buy rate
  const recentKg=p=>(!poLive(p)||new Date(p.receivedOn||p.date)<from)?0:p.qty;
  const rtot=_B.reduce((a,p)=>a+recentKg(p),0)||1;
  Object.values(m).forEach(o=>{o.recentKg=+_B.filter(p=>p.supplier===o.id).reduce((a,p)=>a+recentKg(p),0).toFixed(2);});
  return Object.values(m).map(o=>{
    return Object.assign(o,{
      share:+(o.kg/tot*100).toFixed(1),
      recentShare:+(o.recentKg/rtot*100).toFixed(1),
      recentDays:RECENT,
      quiet:dbet(o.last),
      wavg:o.kg>0?+(o.rm/o.kg).toFixed(2):null,
      best:o.rates.length?Math.min.apply(null,o.rates.map(r=>r.r)):null,
      worst:o.rates.length?Math.max.apply(null,o.rates.map(r=>r.r)):null,
      fill:o.kg>0?+(o.recvKg/o.kg*100).toFixed(0):null,
      lastRate:o.rates.length?o.rates.slice().sort((a,b)=>a.d<b.d?1:-1)[0].r:null});
  }).sort((a,b)=>b.kg-a.kg);
}

/* ============ TAB: ANALYSIS (v149) ============
   Charts that carry a decision, not decoration. Each one answers a question the desk
   has already been asked in prose somewhere: where the margin actually goes, whether
   the board matches what people pay, when the shelf ran dry, who the book leans on,
   and whether buying in size has really got cheaper. Observed trade only throughout,
   with no curve fitted to anything. */
/* daily stock reconstructed from the lots in and the units physically out. Self-use is
   a plug on the whole period rather than a dated event, so it is spread evenly and said
   to be spread: dating it would be inventing a day it happened on. */
function stockHistory(){
  const MS=86400000;
  const ds=[].concat(purchases.filter(poLive).map(p=>p.receivedOn||p.date),
                     sales.map(s=>s.date)).filter(Boolean).sort();
  if(!ds.length)return [];
  const d0=new Date(ds[0]), days=Math.max(1,Math.round((TODAY-d0)/MS));
  const inOn={},outOn={};
  purchases.filter(poLive).forEach(p=>{const k=p.receivedOn||p.date;inOn[k]=(inOn[k]||0)+poRecvKg(p);});
  /* ALL sales, not just priced ones: recompute draws the shelf down with sales.reduce
     over txPhys, so filtering to priced trade here would leave the walk ending somewhere
     the rest of the desk does not agree with.
     Salt moves on the day it was HANDED OVER, which for an amended order is a Fulfilment
     step in the trail and not the order date. Dating it on the order date puts units out
     of the door before they arrived and drove the walk negative for nine days. Only
     Fulfilment moves salt; Linked, Rewarded and Modification settle on paper. Whatever
     the trail does not account for falls back to the order date, so the total still
     reconciles to txPhys exactly. */
  sales.forEach(s=>{
    const tot=txPhys(s);if(tot<=0.0001)return;
    let acc=0;
    (s.amend||[]).forEach(a=>{if(a.kind==='Fulfilment'&&+a.kg>0.0001){
      const k=a.date||s.date;outOn[k]=(outOn[k]||0)+ +a.kg;acc+=+a.kg;}});
    /* whatever the trail does not account for falls on the row's own delivery date,
       which txDates resolves from the stated field or, failing that, the order date.
       The total still reconciles to txPhys exactly either way. */
    const rest=+(tot-acc).toFixed(4);
    if(Math.abs(rest)>0.0001){const k=s.deliveredOn||s.date;outOn[k]=(outOn[k]||0)+rest;}
  });
  /* only loans made AFTER the opening count draw the shelf down here; a pre-opening loan
     is already inside opening.qty, exactly as recompute now treats it */
  const loanKg=loanDrawKg();
  /* shrinkage is a plug for the whole period with no date on it, so it is spread across
     the days that have actually passed. Nothing is taken on day 0, which is the opening
     position rather than a day of trading. */
  const shrinkPerDay=days>0?selfUse/days:0;
  const rows=[];let lvl=opening.qty-loanKg;
  for(let i=0;i<=days;i++){
    const d=new Date(d0.getTime()+i*MS), k=d.toISOString().slice(0,10);
    lvl=lvl+(inOn[k]||0)-(outOn[k]||0)-(i?shrinkPerDay:0);
    rows.push({iso:k,lvl:+lvl.toFixed(2),raw:lvl});
  }
  return rows;
}
function tabAnalysis(){
  const c=pxCost(),sg=pxSignals(),mk=pxMarket(),cv=coverStats();
  const bc=byCustomer().slice().sort((a,b)=>b.rev-a.rev);
  const tot=bc.reduce((a,x)=>a+x.rev,0)||1;
  const shrinkRM=+(selfUse*wavgBuy).toFixed(2);
  const sh=stockHistory();
  const dry=sh.filter(r=>r.lvl<=0.05).length;

  </div>

  <h2 style="margin-top:20px">Where the money goes <span class="rule"></span></h2>

  ${(()=>{const neg=sh.filter(r=>r.raw<-0.01);

function drawAnalysis(){

          scales:{x:{type:'logarithmic',grid:{color:GRID},ticks:{color:TICK,callback:v=>v+' unit'},title:{display:true,text:'lot size, log scale',color:TICK}},
                  y:{grid:{color:GRID},ticks:{color:TICK,callback:v=>'RM '+v}}}}});

      // 3. reconstructed shelf

          scales:{x:{grid:{color:GRID},ticks:{color:TICK,maxTicksLimit:14}},
                  y:{grid:{color:GRID},ticks:{color:TICK,callback:v=>v+' unit'}}}}});

      // 4. pareto
      const bc=byCustomer().slice().sort((a,b)=>b.rev-a.rev),tot=bc.reduce((a,x)=>a+x.rev,0)||1;
      let run=0;const cum=bc.map(x=>{run+=x.rev;return +(run/tot*100).toFixed(1);});
      freshChart(blkEl('anPareto'),{
        data:{labels:bc.map(x=>codeOf(x.id)),datasets:[
          {type:'bar',label:'Revenue',data:bc.map(x=>+x.rev.toFixed(2)),backgroundColor:'#b3a6f5',borderRadius:5,yAxisID:'y'},

          {label:'Defaulted',data:buys.filter(b=>b.def),backgroundColor:'rgba(255,93,115,.35)',borderColor:'#ff7a8a',borderWidth:1.5}]},
        options:{responsive:true,maintainAspectRatio:false,
          plugins:{legend:{display:true,labels:{color:TICK,boxWidth:12,font:{size:11}}},
            title:{display:true,text:'Buying rate against lot size',color:INK,font:{size:12}},

      // 6. cadence: one row per buyer, one dot per order
      const ids=bc.map(x=>x.id);
      const maxT=Math.max.apply(null,pricedSales.map(s=>s.total||0))||1;
      const cad=pricedSales.filter(s=>!s.cancelled&&s.date&&ids.indexOf(s.customer)>=0)

      freshChart(blkEl('anCadence'),{type:'bubble',
        data:{datasets:[{label:'Orders',data:cad,backgroundColor:'rgba(99,230,224,.35)',borderColor:'#7fd7e8',borderWidth:1.4}]},
        options:{responsive:true,maintainAspectRatio:false,
          plugins:{legend:{display:false},title:{display:true,text:'Order dates by buyer, sized by value',color:INK,font:{size:12}},
            tooltip:{callbacks:{label:i=>`${i.raw.y} on ${i.raw.x}: ${i.raw.q} unit, RM ${i.raw.t}`}}},
          scales:{x:{type:'category',labels:[...new Set(pricedSales.map(s=>s.date).filter(Boolean))].sort(),
                     grid:{color:GRID},ticks:{color:TICK,maxRotation:70,minRotation:45,font:{size:9}}},
                  y:{type:'category',labels:ids.map(codeOf).reverse(),grid:{color:GRID},ticks:{color:TICK,font:{size:10}}}}}});
    }catch(e){}
  });
}

/* ============ TAB: MAP (v149) ============
   A schematic, deliberately, and not a street map. There is no basemap here because
   there is no basemap to be had offline and a drawn coastline would imply a precision
   the data has not got: these are neighbourhood centroids inferred from order notes,
   not addresses. So the map shows RELATIVE position honestly, with a scale bar and a
   north arrow, and says plainly which parties it cannot place at all.
   Everything is driven by PLACES. Put a real lat and lng against a suffix and the pin
   moves; nothing here needs touching. */
function mapPoints(){
  const bc=byCustomer(),rev={};bc.forEach(x=>rev[x.id]=x.rev);
  const sup={};purchases.forEach(p=>{if(!p.pending)sup[p.supplier]=(sup[p.supplier]||0)+p.total;});
  const a0=associateIds();
  const out=[],miss=[],far=[];
  roster.forEach(id=>{
    const pl=placeOf(id),t=locOf(id);
    const isSup=id.startsWith('S');
    const role=isSup?'supplier':(a0.indexOf(id)>=0?'associate':'customer');
    const value=isSup?(sup[id]||0):(rev[id]||0);
    if(!pl){miss.push({id,t,why:NON_PLACE[(id.split('-').pop())]||(t?`suffix "${t}" is not in the gazetteer`:'no location suffix')});return;}
    /* placed, but not DRAWN: a party outside the frame is known precisely and is
       reported with distance and bearing rather than squeezed onto a metro canvas */
    if(!inMetro(pl)){far.push({id,role,value,place:pl,t,geo:farFrom(pl)});return;}
    out.push({id,role,value,place:pl,t});});
  return {pts:out,miss,far};
}
function tabMap(){
  const {pts,miss,far}=mapPoints();
  if(!pts.length)return `<h1>Map</h1><div class="card"><div class="dsc">No party can be placed yet. Add a suffix to <b>PLACES</b> with a latitude and longitude.</div></div>`;
  const lats=pts.map(p=>p.place.lat),lngs=pts.map(p=>p.place.lng);
  const pad=0.018;
  const la0=Math.min.apply(null,lats)-pad, la1=Math.max.apply(null,lats)+pad;
  const ln0=Math.min.apply(null,lngs)-pad, ln1=Math.max.apply(null,lngs)+pad;
  const W=820,H=520;
  /* equirectangular is fine three degrees off the equator: a degree of longitude is
     within 0.2% of a degree of latitude here, so the aspect is not visibly wrong */
  const X=l=>((l-ln0)/(ln1-ln0))*W, Y=l=>H-((l-la0)/(la1-la0))*H;
  const maxV=Math.max.apply(null,pts.map(p=>p.value))||1;
  const R=v=>6+Math.sqrt(Math.max(0,v)/maxV)*20;
  const COL={customer:'#7fd7e8',associate:'#e8c66b',supplier:'#b3a6f5'};
  /* several parties share a suffix, so a single centroid would stack them. They are

    g.forEach((p,i)=>{let dx=0,dy=0;
      if(n>1){const ang=(2*Math.PI*i)/n-Math.PI/2, rad=16+n*2.2;dx=Math.cos(ang)*rad;dy=Math.sin(ang)*rad;}
      nodes.push(Object.assign({},p,{x:X(p.place.lng)+dx,y:Y(p.place.lat)+dy,cx:X(p.place.lng),cy:Y(p.place.lat),fan:n>1}));});});
  const kmPerDeg=111.32, spanKm=(ln1-ln0)*kmPerDeg*Math.cos(3.1*Math.PI/180);
  const barKm=spanKm>30?10:spanKm>15?5:2, barPx=(barKm/spanKm)*W;
  const gridV=[0.25,0.5,0.75].map(f=>`<line x1="${W*f}" y1="0" x2="${W*f}" y2="${H}" stroke="#271b45" stroke-width="1"/>`).join('')
    +[0.25,0.5,0.75].map(f=>`<line x1="0" y1="${H*f}" x2="${W}" y2="${H*f}" stroke="#271b45" stroke-width="1"/>`).join('');
  const halos=Object.keys(byT).map(t=>{const g=byT[t];const x=X(g[0].place.lng),y=Y(g[0].place.lat);
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${g.length>1?(16+g.length*2.2+9).toFixed(0):16}" fill="rgba(99,230,224,.05)" stroke="#382a58" stroke-width="1" stroke-dasharray="3 3"/>`
      +`<text x="${x.toFixed(1)}" y="${(y+ (g.length>1?(16+g.length*2.2+22):30)).toFixed(1)}" text-anchor="middle" font-size="10.5" fill="#7c6aa0" letter-spacing=".4">${esc(g[0].place.name)}</text>`;}).join('');
  const marks=nodes.map(n=>`<g>
    ${n.fan?`<line x1="${n.cx.toFixed(1)}" y1="${n.cy.toFixed(1)}" x2="${n.x.toFixed(1)}" y2="${n.y.toFixed(1)}" stroke="#382a58" stroke-width="1"/>`:''}
    <circle cx="${n.x.toFixed(1)}" cy="${n.y.toFixed(1)}" r="${R(n.value).toFixed(1)}" fill="${COL[n.role]}" fill-opacity=".18" stroke="${COL[n.role]}" stroke-width="1.6"/>
    <text x="${n.x.toFixed(1)}" y="${(n.y+3.5).toFixed(1)}" text-anchor="middle" font-size="9.5" font-weight="700" fill="${COL[n.role]}" font-family="ui-monospace,Consolas,monospace">${esc(codeOf(n.id))}</text>
    <title>${esc(codeOf(n.id))} &middot; ${n.role} &middot; ${fmt0(n.value)} &middot; ${esc(n.place.name)} (approximate)</title></g>`).join('');
  const legend=Object.keys(COL).map(k=>`<span style="display:inline-flex;align-items:center;gap:6px;margin-right:15px;font-size:12px;color:var(--mut)"><span style="width:11px;height:11px;border-radius:50%;background:${COL[k]}33;border:1.5px solid ${COL[k]}"></span>${k}</span>`).join('');
  const placedRows=Object.keys(PLACES).map(t=>{const n=pts.concat(far).filter(p=>p.t===t);

/* ============ TAB: LEDGER ============ */
/* status engine (R1): two legs (Payment x Delivery) + derived order state + Advance/Deferred/pending detail */
/* WHO DOES THIS BUYER SIT UNDER, read off the code rather than off a tickbox.
   Two ways of knowing, cheapest first:
     1. the ledger has already booked him as somebody's downstream, which is fact
     2. his code is a reseller's code plus a suffix, which is how the codes are minted:
        CS6-BS-R is the general bucket under CS6-BS, CM4-MK is a located buyer
        under the same reseller. Only a parent that actually resells (rev R2) counts, so
        an ordinary customer whose code happens to prefix another is never treated as one.
   Returns null when neither holds, and the caller then does nothing at all. */
/* ============ THE RESELL ACCOUNT (v215) ============
   An associate does two different things and the ledger was booking both to one code, so
   his own buying and his reselling arrived as a single column of purchases. Resell now
   books to <ASSOCIATE>-R. It is an ACCOUNT, not a person and not a place: it never takes
   a vault name, never takes a PLACES pin, and never counts as a customer of its own.
   ownerOf() is the single resolver. Anything that asks "whose stream is this" must go
   through it, or the associate silently loses credit for his own resells. */
const RESELL_SFX='-R';
const isResellAcct=id=>typeof id==='string'&&id.slice(-2)===RESELL_SFX;
/* ============ A BUCKET IS NOT A PERSON (v237) ============
   His instruction, and it was already half true: the general bucket was excluded from the
   map but still counted as a customer everywhere else, so it drew badges, sat in the
   approach calendar, took a place in the concentration ranking and had a cadence computed
   for it. It is an accounting destination for onward sales to people you never met, and it
   has no name, no place, no habits and nothing to approach. isPerson() is now the single
   test, and every per-person view asks it. */
/* v265: THE GENERAL BUCKET IS RETIRED. Every onward sale a reseller makes to someone the
   desk never meets now books to his own -R account, which is where the money and the R2
   turnover already sat; the bucket added a second code that was never a person, never issued
   a statement, never placed on the map and never owed anything. `downstream` survives for the
   case it was always right for: an onward buyer the desk DOES know, like CM4-MK under CS6-BS-R.
   isBucket is kept and always false rather than deleted, because a dozen call sites ask it
   and the honest answer now is "there are none" rather than a missing function. */
const isBucket=id=>false;
const isPerson=id=>!!id&&!isBucket(id);
const ownerOf=id=>isResellAcct(id)?id.slice(0,-2):(isBucket(id)?id.slice(0,-4):id);
function assocOf(code){
  if(!code)return null;
  if(isResellAcct(code))return ownerOf(code);
  const booked=sales.find(s=>s.downstream===code&&s.customer&&s.customer!==code);
  if(booked)return ownerOf(booked.customer);
  const resellers=new Set(sales.filter(s=>s.rev==='R2').map(s=>ownerOf(s.customer)));
  for(const r of resellers){
    if(r!==code&&code.indexOf(r+'-')===0)return r;
  }
  return null;
}
function txStat(t){
  if(t.cancelled)return {order:'Cancelled',cls:'def',pay:(t.cash||0)>0.009?'Refund due':'Unpaid',deliv:'Undelivered'};
  const paid=(t.cash||0)+(t.settledRM||0), del=(t.deliveredQty||0)+(t.settledKg||0);
  /* A ZERO-VALUE ROW IS PAID IN FULL BY DEFINITION. payFull required total>0, so the
     first free unit ever handed over read as Open - Advance: salt out, nothing in,
     therefore money owed. Nothing was owed. There is no price to meet, so the test is
     met. Without this a rebate redemption sits on the books for ever as a debt. */
  const payFull=t.total<=0.009?true:(paid>=t.total-0.009), payNone=paid<=0.009, delFull=t.qty>0&&del>=t.qty-0.009, delNone=del<=0.009;
  const pay=payFull?'Paid':payNone?'Unpaid':'Partial';
  const deliv=delFull?'Delivered':delNone?'Undelivered':'Partial';
  let order=(payFull&&delFull)?'Completed':(payNone&&delNone)?'Pending':'Open';
  if(order==='Open'){                                                  // split Open the same way the replay does
    const paidFrac=t.total>0?paid/t.total:0,delivFrac=t.qty>0?del/t.qty:0;
    if(delivFrac>paidFrac+1e-9)order='Open · Advance';                 // delivered ahead, they owe cash
    else if(paidFrac>delivFrac+1e-9)order='Open · Deferred';           // paid ahead, you owe salt
  }
  let cls=order==='Completed'?'paid':order==='Pending'?'pendingt':'open';
  if((t.settle==='barter'||t.waived||t.rebate)&&payFull&&delFull){order='In-Kind';cls='inkind';}
  return {order,cls,pay,deliv};
}
function ledgerBuy(p){
  if(p.defaulted)return {order:'Default',cls:'def',pay:'Paid',deliv:'Undelivered'};
  /* poCash, not a bare fallback. This line read an absent cash field as PAID IN FULL,
     so the agreed 100 unit came back Paid and Undelivered and fell through to
     "Open - Deferred", which reads as salt owed to you on money already handed over.
     It is the same v146 leak that took RM4,700 out of the cash flow. */
  const paid=poCash(p);
  const pay=paid>=p.total-0.009?'Paid':(paid<=0.009?'Unpaid':'Partial');
  const r=poRecvKg(p);
  const deliv=r<=0.0001?'Undelivered':(r>=p.qty-0.0001?'Delivered':'Partial');
  const order=(pay==='Paid'&&deliv==='Delivered')?'Completed':(pay==='Unpaid'&&deliv==='Undelivered')?'Pending':(deliv==='Delivered'?'Open · Advance':'Open · Deferred');
  return {order,cls:order==='Completed'?'paid':/^Open/.test(order)?'open':'pendingt',pay,deliv};}
/* Replay a sale's structured amendments in date order, deriving the cumulative
   Payment / Delivery / State AFTER each step. cash and unit on each amendment are
   the amounts MOVED that step (physical delivery and set-off units both count as
   delivered, since unit already folds set-off fulfilment). */
/* ============ WHEN A SAME-DAY STEP FOLDS, AND WHEN IT MUST NOT (v191) ============
   The standing rule is that a settlement on the order date folds into the OPENING LINE
   rather than becoming a movement. The test for it is NOT "the step is dated on the
   order date": 14 of the 15 trails on this book open with a step on the order date,
   because that first step IS the opening, and this replay starts from cumCash=0 and
   cumKg=0 and accumulates. Strip the first step out of a multi-step trail and every
   later state is understated by exactly what the opening moved -- an order that closed
   would read Open, and a completed one Partial.

   THE TEST IS THE WHOLE TRAIL, NOT THE STEP. Fold only when the ENTIRE trail is a
   single step dated on the order date: there the trail restates the canonical row and
   nothing else, so the ledger card renders Opened, then a movement identical to the
   opening, then Closed, for one transaction that never moved twice. Such a row carries
   its dates in deliveredOn / paidOn, so txDates() still dates it from a stated field
   rather than assuming, and the canonical figures were always what recompute() read.
   One row met the test on 02 Aug 2026 and was folded; the other 14 were left alone. */
function replayAmend(t){
  const A=(t.amend||[]).slice().sort((a,b)=>new Date(a.date)-new Date(b.date));
  let cumCash=0,cumKg=0;const out=[];
  const tag=lab=>(lab==='Paid'||lab==='Delivered')?'paid':(lab==='Unpaid'||lab==='Undelivered')?'unpaid':'open';
  for(const a of A){
    cumCash+=(a.cash||0);cumKg+=(a.kg||0);
    const pay=(t.total>0&&cumCash>=t.total-0.009)?'Paid':(cumCash<=0.009?'Unpaid':'Partial');
    const deliv=(t.qty>0&&cumKg>=t.qty-0.009)?'Delivered':(cumKg<=0.009?'Undelivered':'Partial');
    let state;
    if(pay==='Paid'&&deliv==='Delivered')state='Completed';
    else if(pay==='Unpaid'&&deliv==='Undelivered')state='Pending';
    else{
      const paidFraction=t.total>0?cumCash/t.total:0,delivFraction=t.qty>0?cumKg/t.qty:0;
      if(delivFraction>paidFraction+1e-9)state='Open · Advance';       // delivered ahead, they owe cash
      else if(paidFraction>delivFraction+1e-9)state='Open · Deferred'; // paid ahead, you owe salt
      else state='Open';
    }
    const cls=state==='Completed'?'paid':state==='Pending'?'pendingt':'open';
    out.push({date:a.date,kind:a.kind,cash:a.cash||0,kg:a.kg||0,note:a.note||'',ref:a.ref||'',
      pay,deliv,state,cls,payCls:tag(pay),delivCls:tag(deliv)});
  }
  return out;
}
/* jump to an entry card by its E-code and flash it briefly */
/* ============ MARK A PENDING ORDER FROM ITS OWN CARD (v253) ============
   IT QUEUES, IT DOES NOT WRITE. Every other entry on this desk rides salt_queue.json and is
   committed on the next run, and a button that edited the ledger directly would be the one
   path that bypassed that. So this pushes exactly the payload the Transaction tab would have
   pushed, and the overlay shows it as Provisional until it is committed.
   THE FIGURES COME FROM THE ORDER, NOT FROM A FORM. A pending order has paid nothing and
   moved nothing by definition, so Paid is its whole total, Delivered is its whole quantity,
   and Completed is both. There is nothing to type and therefore nothing to mistype.
   IT IS OFFERED ONLY ON A PENDING ORDER. Part-paid and part-delivered orders have a real
   arithmetic question behind them, how much, and that belongs on the Transaction tab where
   the figures can be entered and checked. */
/* ============ CLOSE THE DESK (v255) ============
   THE QUEUE IS FLUSHED FIRST AND THE CLOSE WAITS ON IT. Everything typed into this desk lives
   in memory until it is written to salt_queue.json, so closing the window before the write
   lands would lose it silently. qFlush returns the write, so the close hangs off its promise
   rather than off a timer and a hope.
   THEN /bye, WHICH THE SERVER ALREADY UNDERSTANDS. It is the same route pagehide beacons, so
   the server stops on the next tick rather than idling for its watchdog timeout. sendBeacon
   first because it survives the window going away; fetch with keepalive behind it for the
   case where sendBeacon is unavailable.
   AND A HONEST FALLBACK. window.close() is refused by every browser for a window the user
   opened themselves, so it works from the launcher's app window and not from an ordinary tab.
   Rather than appear to do nothing, the page says plainly that the server has stopped and the
   window can be closed. */
function deskExit(){
  const n=queue.length;
  if(n&&!confirm(n+' uncommitted entr'+(n===1?'y':'ies')+' will be written to the queue file and picked up on the next run.\n\nClose the desk?'))return;
  const bye=()=>{
    try{if(navigator.sendBeacon)navigator.sendBeacon('/bye');}catch(e){}
    try{fetch('/bye',{keepalive:true}).catch(()=>{});}catch(e){}
    setTimeout(()=>{
      try{window.open('','_self');}catch(e){}
      try{window.close();}catch(e){}
      setTimeout(()=>{
        document.body.innerHTML='<div class="byewrap"><div class="byecard">'
          +'<h1>The desk is closed.</h1>'
          +'<p>The server has been told to stop'+(n?' and <span class="q">'+n+' entr'+(n===1?'y is':'ies are')+'</span> written to the queue file':'')+'.</p>'
          +'<p>This window was opened by you rather than by the launcher, so the browser will not let a page close it. Close the tab and the black window behind it.</p>'
          +'</div></div>';
      },500);
    },150);
  };
  try{Promise.resolve(qFlush()).then(bye,bye);}catch(e){bye();}
}
function ledQuick(what,type,who,date,total,qty){
  const arr=(type==='BUY')?purchases:sales;
  const key=who+'|'+date+'|'+total;
  if(!ovFind(arr,key)){alert('That order could not be matched. It may already have been committed under a different key.');return;}
  const cash=(what==='paid'||what==='done')?+total:0;
  const moved=(what==='deliv'||what==='done')?+qty:0;
  const today=TODAY.toISOString().slice(0,10);
  const lab=what==='paid'?'paid in full':what==='deliv'?'delivered in full':'paid and delivered in full';
  const raw='Fulfilment on '+codeOf(who)+' — '+(type==='BUY'?'lot ':'order ')+kg(qty)+' of '+fmt0(total)
    /* an undated row is PLANNED rather than agreed, and its key really does contain the
       string "undefined" on both sides, so it matches and the button works. Only the
       human-readable line needs to stop saying "agreed undefined". */
    +(date&&date!=='undefined'?' agreed '+date:' planned, undated')+' marked '+lab+' on '+today;
  queue.push({at:new Date().toISOString(),type:'AMEND',party:codeOf(who),qty:moved,total:cash,
    status:what==='deliv'?'unpaid':(what==='paid'?'paid':'paid'),raw:raw,
    payload:{mode:'amend',direction:type,party:who,orderKey:key,date:today,
      assoc:null,downstream:null,kind:'Fulfilment',orderCode:null,linkTo:null,sameDay:false,
      note:null,
      qty:moved,total:cash,cash:cash,kg:moved}});

     NOT rebuild the rows from BASE and re-apply the queue, so a queued entry that skipped this
     line showed in the Transaction count and changed nothing on the books. Caught by asserting
     on revTotal after a click rather than on the card repainting, which it did either way. */
  applyOverlay();saveQueue();render();
}

    if(ledF.state==='Open'){if(!/^Open/.test(fin))return false;}

/* ============ STATEMENT OF ACCOUNT (v183) ============
   A customer asked for his own record, so the desk can now hand one over. This is the
   only artefact that leaves the desk describing a NAMED party's dealings, and the whole
   design is about what it must NOT contain.

   THE RULE: STRUCTURED FACTS ONLY, NEVER THE SELLER'S PROSE.
   Every note in this ledger is written for him, not for the buyer, and several are about
   his own bookkeeping: "recorded as 9.47 delivered in error", "the RM200 booked as
   received was NEVER PAID", "delivery audit", "account audit". None of that is the
   customer's business, and no filter over free text is safe enough to be trusted with
   it. So the statement is BUILT rather than copied: date, quantity, unit price, total,
   what was paid and when, what was collected and when, what remains. Nothing else.

   NEVER LEAVES THE DESK, at any setting:
     cost, margin, margin %       what the salt cost and what it earned
     shrinkage, replacement cost  the desk's own economics
     tier names, floors, cards    the pricing structure behind the number he paid
     any other party              codes, names, or the fact that they exist
     internal notes and audits    every free-text field on the order
   A test greps a generated statement for each of these before it can be trusted.

   WHAT HE ALREADY KNOWS, and therefore may have: what he ordered, what he agreed to
   pay, what he handed over and when, what he collected and when, and what is still
   between them. A settlement in kind is included because he agreed to it, but stated as
   an amount and a date rather than with the reasoning that sits behind it here. */
function stmtRows(party,o){
  o=o||{};
  const from=o.from?new Date(o.from):null, to=o.to?new Date(o.to):null;
  return sales.filter(s=>s.customer===party).filter(s=>{
    const d=new Date(s.date);
    const st=txStat(s).order;
    /* A PENDING ORDER IGNORES THE DATE WINDOW (v194). It is an open commitment, not an
       event in a period, and it is still open on the day the statement is issued whatever
       date sits on it. Leaving it to the window made inclusion arbitrary: CA5-KER's
       pending order is dated 28 Jul so it appeared, CI4-OKR's is dated 03 Aug so the
       02 Aug cut-off silently dropped it, and two customers in the same position got
       different statements for no reason either of them could see. An order the customer
       agreed to and has not yet acted on belongs on his statement, full stop. */
    if(st!=='Pending'){
      if(from&&d<from)return false;
      if(to&&d>to)return false;
    }
    if(st==='Pending'&&!o.pending)return false;
    if(st==='Completed'&&!o.completed)return false;
    if(st!=='Pending'&&st!=='Completed'&&!o.open)return false;
    return true;
  }).sort((a,b)=>new Date(a.date)-new Date(b.date)).map(s=>{
    const st=txStat(s), d=txDates(s);
    const paidCash=+(s.cash||0), inKind=+(s.settledRM||0);
    const got=+(s.deliveredQty||0), inKindKg=+(s.settledKg||0);
    const owed=+(s.total-paidCash-inKind).toFixed(2);
    /* a cross-reference is included ONLY when it points at another of HIS OWN orders;
       anything pointing elsewhere is another party's business and is dropped */
    const links=[];
    (s.amend||[]).forEach(a=>{
      (a.refKeys||[]).forEach(k=>{
        const m=/^([^|]+)\|([^|]+)\|/.exec(k||'');
        if(m&&m[1]===party)links.push(m[2]);
      });
    });
    /* A GIFT MUST NOT READ AS A CHARGE (v187). Goodwill salt is booked in-kind at a
       value so it does not fall out of the ledger as shrinkage, but the customer never
       owed that money and showing him an amount he did not pay invites the exact
       question the statement exists to prevent. So it carries nil and says why. */
    const gift=!!s.rebate;
    return {gift:gift,date:s.date,qty:s.qty,total:gift?0:s.total,
      unit:s.qty>0?+(s.total/s.qty).toFixed(2):0,
      paidCash:paidCash,inKind:inKind,got:got,inKindKg:inKindKg,
      /* PENDING COUNTS NOWHERE, on a statement as everywhere else (v189). An order
         agreed with nothing paid and nothing collected is an intention, not a debt, and
         showing its value as OUTSTANDING would tell a customer he owes money for salt he
         has never received. The desk has run on that rule since v111; the statement was
         quietly breaking it, and these go out to people. */
      owed:(st.order==='Pending'||st.order==='Cancelled')?0:(owed>0.009?owed:0),
      pendingOrder:st.order==='Pending',
      /* A CANCELLED ORDER IS NOT A BILL (v193). txStat has returned 'Cancelled' since
         long before statements existed, and stmtRows simply never asked. So CC5-OKR's
         20 Jul order -- agreed at RM90, cancelled the next day with nothing moved either
         way, and carrying the note "counts nowhere" -- came out of the statement builder
         as RM90 outstanding and 1 unit owed. It stays on the page, because he agreed to
         it and remembers it, and a statement that silently drops it invites the question
         it exists to answer. But it counts in nothing. */
      cancelled:st.order==='Cancelled',
      cancelledOn:(st.order==='Cancelled'
        ? ((s.amend||[]).filter(a=>a.kind==='Cancellation')[0]||{}).date||null : null),
      credit:owed<-0.009?-owed:0,
      /* WHAT HE IS OWED IN SALT, which is the figure a dispute actually turns on.
         deliverable = ordered LESS anything withheld by agreement to settle an earlier
         balance; toGet = deliverable LESS what he has already carried away. */
      deliverable:+(s.qty-inKindKg).toFixed(4),
      toGet:+(s.qty-got-inKindKg).toFixed(4),
      paidOn:d.pOn||null,gotOn:d.dOn||null,
      state:gift?'No charge'
            :st.order==='Pending'?'Agreed, nothing moved yet'
            :(owed>0.009?'Balance outstanding'
              :(+(s.qty-got-inKindKg).toFixed(4)>0.009?'Paid in full'
                :'Settled')),
      links:[...new Set(links)]};
  });
}
/* ============ THE RECONCILIATION (v186) ============
   A statement that states a figure is no use in a dispute; one that SHOWS how the figure
   was reached settles it. When salt has been withheld to clear an earlier money balance,
   the customer cannot check the result without seeing the whole chain: which orders were
   short, by how much, what those shortfalls came to, and the rate at which that money was
   turned into salt.
   So this reconstructs it from the ledger rather than from anyone's memory. The Linked
   step carries refKeys pointing at the orders it settled; each of those is read for what
   was billed and what was actually paid, and the difference is the shortfall. The rate is
   then derived by division rather than quoted, so it cannot disagree with the figures
   above it.
   IT REVEALS THE UNIT RATE, and that is a deliberate reversal of v184. You cannot prove a
   conversion from money into goods without naming the rate used. It appears ONLY inside a
   reconciliation, only for the order that carries the offset, and it is his own rate. */
function stmtRecon(party,rows){
  const out=[];
  sales.filter(s=>s.customer===party&&(s.settledKg||0)>0.0001).forEach(s=>{
    const kgOff=+s.settledKg;
    const keys=[];
    (s.amend||[]).forEach(a=>{(a.refKeys||[]).forEach(k=>{if(k&&k.indexOf(party+'|')===0)keys.push(k);});});
    const legs=[...new Set(keys)].map(k=>{
      const t=sales.find(x=>x.customer+'|'+x.date+'|'+x.total===k);
      if(!t)return null;
      const billed=+t.total, paidCash=+(t.cash||0);
      return {date:t.date,qty:t.qty,billed:billed,paid:paidCash,short:+(billed-paidCash).toFixed(2)};
    }).filter(Boolean).sort((a,b)=>new Date(a.date)-new Date(b.date));
    const shortTot=+legs.reduce((a,x)=>a+x.short,0).toFixed(2);
    const rate=kgOff>0?+(shortTot/kgOff).toFixed(2):0;
    const collected=+(s.deliveredQty||0);
    /* NOT EVERY OFFSET IS AGAINST AN EARLIER ORDER (v192). This walk was written for
       the case where salt was withheld to clear unpaid balances on previous SALES, and
       it assumes those sales exist. CS6-PER's 6.5 unit went against a cash advance,
       which is not in the sales ledger at all, so the walk found no legs and printed a
       table of zeros: "carried forward 0.00", "0.00 at 0.00 a unit is 6.5 unit". That
       is not merely ugly, it is unintelligible, and it was in a file about to be sent.
       So the no-leg case is flagged here and told plainly rather than tabulated. */
    out.push({order:{date:s.date,qty:s.qty,total:s.total,paid:+(s.cash||0)},
      noLegs:legs.length===0,
      legs:legs,shortTot:shortTot,kgOff:kgOff,rate:rate,
      deliverable:+(s.qty-kgOff).toFixed(4),
      collected:collected,
      owed:+(s.qty-kgOff-collected).toFixed(4),
      payments:(s.amend||[]).filter(a=>+a.cash>0.009).map(a=>({date:a.date,rm:+a.cash}))});
  });
  return out;
}
/* A REFUND IS SOMETHING HE KNOWS ABOUT (v188), and the statement had no line for it.
   If he overpaid and money came back, that is his record as much as any order, and a
   statement that omits it is incomplete in the one direction that favours the seller. */
function stmtRefunds(party,o){
  o=o||{};
  const from=o.from?new Date(o.from):null, to=o.to?new Date(o.to):null;
  return (typeof customerRefunds!=='undefined'?customerRefunds:[])
    .filter(r=>r.party===party)
    .filter(r=>{const d=new Date(r.since);
      if(from&&d<from)return false; if(to&&d>to)return false; return true;})
    .map(r=>({date:r.since,amount:+r.amount,paidOn:r.paidOn||null}));
}
function stmtDoc(party,rows,o){
  /* LESS, AND BETTER LOOKING (v184). The first cut carried a price-per-unit column and a
     running prose commentary on every line: paid this, collected that, settled together
     with the order of such a date. All of it was true and none of it was wanted. A
     customer opening this wants three things -- WHAT he took, WHEN, and HOW MUCH -- and
     every extra column asks him to work out which ones matter.
     The unit price is gone with the rest. It told him nothing he did not know and it
     made his own rate legible in a single portable document, which is the sort of thing
     that ends up beside another buyer's. Totals say what he paid; the arithmetic behind
     them is his to do if he wants it. */
  const e=esc, n2=v=>Number(v).toLocaleString('en-MY',{maximumFractionDigits:2});
  const money=v=>Number(v).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});
  const dLong=d=>{try{return new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});}catch(x){return d;}};
  const who=(o.useName&&revealed&&vaultNames&&vaultNames[party])?nameOnly(vaultNames[party]):codeOf(party);
  const T={qty:0,total:0,paid:0,owed:0};
  T.toGet=0;T.kindKg=0;T.got=0;T.ordered=0;
  /* a GIFT is not a payment. Its in-kind value exists so the salt does not fall out of
     the ledger as shrinkage; counting it here made Paid exceed the total ordered, which
     is the one arithmetic a reader would certainly catch. */
  T.pendQty=0;T.pendVal=0;T.pendN=0;
  T.cxN=0;
  rows.forEach(r=>{
    /* a cancelled order contributes NOTHING: not quantity, not value, not the count of
       orders. Anything else makes the footer disagree with the word "cancelled". */
    if(r.cancelled){T.cxN++;return;}
    if(r.pendingOrder){T.pendQty+=r.qty;T.pendVal+=r.total;T.pendN++;}
    T.qty+=r.qty;T.total+=r.total;T.paid+=r.gift?0:(r.paidCash+r.inKind);T.owed+=r.owed;
    T.toGet+=(r.toGet>0&&!r.pendingOrder)?r.toGet:0;T.kindKg+=r.gift?0:r.inKindKg;T.got+=r.got;T.ordered+=r.qty;});
  /* the row label has to agree with the walk printed below it. Where the offset went
     against a separate arrangement rather than an unpaid earlier order, calling it an
     "earlier balance" contradicts the explanation three inches further down the page. */
  const noLegDates=new Set((o.recon||[]).filter(R=>R.noLegs).map(R=>R.order.date));
  const body=rows.map(r=>{
    const due=r.owed>0.009;
    const when=(o.dates&&r.paidOn&&r.paidOn!==r.date)?'<div class="sub2">paid '+e(dLong(r.paidOn))+'</div>':'';
    /* nor is it goods owed: nothing has been paid for, so nothing is being withheld */
    const owedKg=r.toGet>0.009&&!r.pendingOrder;
    let stat;
    /* "no charge" and not "goodwill": the same flag covers a gift AND a reseller's
       EARNED reward, and calling an earned reward a gift misdescribes it to the one
       person who knows better. The customer knows which of the two his was. */
    if(r.cancelled)stat='<span class="cx">cancelled</span>'
      +(r.cancelledOn?'<div class="owedkg">'+e(dLong(r.cancelledOn))+'</div>':'');
    else if(r.gift)stat='<span class="gift">no charge</span>';
    /* AN AGREED ORDER IS NOT A SETTLED ONE (v189). Nothing has been paid and nothing
       collected, so it is neither a debt nor a closed line. It still belongs on the
       statement, because he agreed to it and will be asked for the money in due course,
       but it must read as what it is: outstanding on BOTH sides, owing nothing yet. */
    else if(r.pendingOrder)stat='<span class="pend">ordered</span>'
      +'<div class="owedkg">to be collected and paid</div>';
    else if(due)stat='<span class="due">'+money(r.owed)+' due</span>';
    else if(owedKg)stat='<span class="ok">paid in full</span><div class="owedkg">'+n2(r.toGet)+' unit still to collect</div>';
    else stat='<span class="ok">settled</span>';
    return '<tr>'
      +'<td class="l dt">'+e(dLong(r.date))+when+'</td>'
      +'<td class="q'+(r.cancelled?' cxr':'')+'">'+n2(r.qty)+'<span class="u">unit</span>'
        +(r.inKindKg>0.009?'<div class="sub2">'+n2(r.inKindKg)+' unit applied '
          +(noLegDates.has(r.date)?'by agreement':'to an earlier balance')+'</div>':'')
        +'</td>'
      +'<td class="amt'+(r.cancelled?' cxr':'')+'">'+(r.gift?'<span class="nilamt">nil</span>':money(r.total))+'</td>'
      +'<td class="r">'+stat+'</td></tr>';
  }).join('');
  return ['<!DOCTYPE html>','<html lang="en"><head><meta charset="utf-8">',
   '<meta name="viewport" content="width=device-width,initial-scale=1">',
