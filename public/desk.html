const builders={today:tabToday,forward:tabForward,sourcing:()=>perProduct(tabSourcing,{skipEmpty:true}),analysis:()=>perProduct(tabAnalysis),map:tabMap,overview:tabOverview,inventory:()=>perProduct(tabInventory),financials:()=>consoBlock()+perProduct(tabFinancials),ledger:tabLedger,concentration:tabConcentration,network:tabNetwork,receivables:()=>consoBlock()+perProduct(tabReceivables),add:tabWorkbench,pricing:()=>perProduct(tabPricing),plans:tabPlans};
let curTab='today';   // v147: the desk opens on what to do, not on what happened
function navCounts(){
  // live counts on the rail: open+pending positions, queued entries
  const openN=sales.filter(t=>{const o=txStat(t).order;return o==='Pending'||/^Open/.test(o);}).length
    +((typeof supplierReceivable!=='undefined'&&supplierReceivable&&supplierReceivable.status==='recoverable')?1:0);
  const put=(sel,n)=>{const b=document.querySelector('.tab[data-s="'+sel+'"]');if(!b)return;
    let c=b.querySelector('.navct');
    if(!n){if(c)c.remove();return;}
    if(!c){c=document.createElement('span');c.className='navct';b.appendChild(c);}
    c.textContent=n;};
  // plans ride the same queue but are not transactions, so they must not inflate the Workbench count
  const planN=queue.filter(q=>q.payload&&q.payload.mode==='plan').length;
  put('receivables',openN);put('add',queue.length-planN);put('plans',planN);
  put('overview',boundaryScan().filter(x=>x.sev==='breach').length);   // breaches only: a badge that always shows means nothing
  put('today',actions().filter(x=>x.sev==='now').length);              // same discipline: only what is actually due now
}
function render(){recompute();
  for(const k in builders){const el=document.getElementById('sec-'+k);if(!el||!el.classList.contains('on'))continue;
    if(k==='add'){
      // snapshot half-typed fields: a header toggle (Show names / Lock) re-renders
      // this tab and used to wipe an entry mid-composition
      const snap={};el.querySelectorAll('input,select').forEach(e=>{if(e.id)snap[e.id]={v:e.value,c:e.checked};});
      el.innerHTML=builders[k]();
      window.__wbSnap=snap;
    }else el.innerHTML=builders[k]();}
  if(curTab==='inventory')drawPerProduct([trackCharts]);
  if(curTab==='add'){wireWorkbench();
    const snap=window.__wbSnap||{};window.__wbSnap=null;
    Object.keys(snap).forEach(id=>{const e=document.getElementById(id);if(!e)return;
      if(e.type==='checkbox')e.checked=snap[id].c;else if(snap[id].v!==''&&snap[id].v!=null)e.value=snap[id].v;});
    const ab=document.getElementById('wbAssocBox'),ac=document.getElementById('wbAssoc');
    if(ab&&ac)ab.style.display=ac.checked?'':'none';
    const nb=document.getElementById('wbNewBox'),ps=document.getElementById('wbParty');
    if(nb&&ps)nb.style.display=ps.value==='__new__'?'':'none';
    wbApply();wbPreview();}
  if(curTab==='pricing')drawPerProduct([wirePricing,drawPriceCharts,drawEarnChart,drawBoardCharts]);
  if(curTab==='today')drawTodayCharts();
  if(curTab==='concentration')drawConcCharts();
  if(curTab==='receivables')drawPerProduct([drawRecvCharts]);
  if(curTab==='financials')drawPerProduct([drawFinCharts]);
  if(curTab==='network')drawNetworkCharts();
  if(curTab==='ledger')drawLedgerCharts();
  if(curTab==='sourcing')drawPerProduct([drawSourcingCharts,drawOutlookChart]);
  if(curTab==='forward')drawFwdCharts();
  if(curTab==='analysis')drawPerProduct([drawAnalysis]);
  if(curTab==='ledger')wireLedger();
  renderQueue();renderProvBar();navCounts();applyNotes();
  /* v276: AFTER applyNotes, because that rewrites innerHTML on the lead and the notes and
     would orphan a wrapper made before it. Every render, not only a tab change: the desk
     re-renders on a queue post, a product jump and a name toggle too, and each of those
     rebuilds the tables. */
  try{wrapTables();}catch(e){}}
/* ============ KEY MESSAGE vs DATABASE (v210) ============
   The desk had grown to 52% prose. Not one word of it was wasted when it was written,
   and almost all of it was in the way on the ninety-ninth reading. This demotes rather
   than deletes: every tab keeps its lead sentence and its numbers, and the method goes
   behind one control that states how much it is holding.

   WHY A LENGTH THRESHOLD RATHER THAN A TAG ON EVERY BLOCK. There are 120-odd .dsc
   blocks and tagging each by hand would be 120 chances to mis-tag one, then a fresh
   chance every time a tab is edited. Length separates them cleanly because the two
   kinds are not close: method paragraphs run 200 to 900 characters, while the short
   ones are load-bearing scraps -- "None.", a chart fallback, a figure restated -- and
   sit under 140. Measured before it was adopted: the rule hides 92% of prose by
   character and leaves 72 short blocks on screen, every one of which was checked.

   THE LEAD IS TRUNCATED, NOT HIDDEN. Notes off shows its first sentence only, so a
   cold open on any tab still says what the tab is for. Notes on restores the full
   paragraph from the copy taken before the first truncation. render() rebuilds
   innerHTML from source every time, so the copy is retaken each render and can never
   accumulate a truncation of a truncation. */
let notesOn=false;
function toggleNotes(){notesOn=!notesOn;applyNotes();}
function applyNotes(){
  const sec=document.getElementById('sec-'+curTab); if(!sec)return;
  document.body.classList.toggle('noteshide',!notesOn);
  let n=0;
  sec.querySelectorAll('.dsc').forEach(e=>{
    if(e.classList.contains('dsclead'))return;
    const t=(e.textContent||'').replace(/\s+/g,' ').trim();
    if(t.length>=NOTE_MIN){e.classList.add('note');n++;} else e.classList.remove('note');
  });
  /* AN INSIGHT IS A CONCLUSION, NOT AN ESSAY (v231). .dsc notes have folded since v210 but
     .insight never did, so the longest prose on the desk was the prose that always showed:
     Network alone carried 1,976 characters of permanently visible explanation. They are now
     treated exactly as the lead is. The first sentence stays, because that is the finding;
     everything after it is method and folds with the rest. Nothing is deleted and nothing
     is summarised: expanding restores the original HTML verbatim. */
  sec.querySelectorAll('.insight').forEach(e=>{
    if(e.dataset.full==null){e.dataset.full=e.innerHTML;e.dataset.plain=(e.textContent||'').replace(/\s+/g,' ').trim();}
    const t=e.dataset.plain||'';
    if(t.length<NOTE_MIN){e.innerHTML=e.dataset.full;return;}
    n++;
    if(notesOn)e.innerHTML=e.dataset.full;
    else{const m=t.match(/^[\s\S]*?[.!?](?=\s|$)/);e.textContent=m?m[0]:t;}
  });
  const lead=sec.querySelector('.dsclead');
  if(lead){
    if(lead.dataset.full==null){lead.dataset.full=lead.innerHTML;lead.dataset.plain=(lead.textContent||'').replace(/\s+/g,' ').trim();}
    if(notesOn)lead.innerHTML=lead.dataset.full;
    else{const t=lead.dataset.plain||'';const m=t.match(/^[\s\S]*?[.!?](?=\s|$)/);lead.textContent=m?m[0]:t;}
  }
  let bar=sec.querySelector('.notesbar');
  if(n&&!bar){
    bar=document.createElement('div');bar.className='notesbar';bar.onclick=toggleNotes;
    const anchor=lead||sec.querySelector('h1');
    if(anchor&&anchor.parentNode)anchor.parentNode.insertBefore(bar,anchor.nextSibling);
    else sec.insertBefore(bar,sec.firstChild);
  }
  if(bar)bar.innerHTML=(notesOn?'&#9662;':'&#9656;')+' Method and caveats ('+n+')';
  if(bar&&!n)bar.remove();
}
function switchTab(s){curTab=s;document.body.setAttribute('data-sec',s);[...document.querySelectorAll('.tab')].forEach(t=>t.classList.toggle('on',t.dataset.s===s));[...document.querySelectorAll('.sec')].forEach(x=>x.classList.toggle('on',x.id==='sec-'+s));render();
  /* v281: the cards of the incoming tab settle in with a short stagger. The class is
     transient so a re-render mid-tab (a queue post, a name toggle) never replays it. */
  try{const el=document.getElementById('sec-'+s);
    if(el){el.classList.add('switching');clearTimeout(window.__swT);
      window.__swT=setTimeout(()=>el.classList.remove('switching'),700);}}catch(e){}
  /* v281: the address carries the tab, so a reload (including the cloud ten-second
     refresh) reopens where you were. replaceState, never push: the phone's back
     gesture should leave the desk, not unwind every tab visited. */
  try{if(location.hash!=='#'+s)history.replaceState(null,'','#'+s);}catch(e){}
  try{if(window.__railMark)window.__railMark();}catch(e){}
  /* a tab is a new page, so it opens at the top. Without this you land halfway down
     the next tab because the window keeps the scroll offset of the one you left. */
  try{window.scrollTo({top:0,left:0,behavior:'auto'});}catch(e){window.scrollTo(0,0);}
  /* v273: if the page was ALREADY at the top no scroll event fires, so the back-to-top
     button would stay lit from the tab you just left. Ask it to re-read directly. */
  try{if(window._totopSync)window._totopSync();}catch(e){}
  try{wrapTables();railIntoView();}catch(e){}}
/* v276: EVERY TABLE GETS A SCROLL CONTAINER, AT RUNTIME. Done here rather than in the 58
   render sites because a rule applied by hand in 58 places is a rule that will be missed in
   the 59th, which is the same reasoning that put deskctl and parityScan on this desk. It is
   idempotent: a table already wrapped is left alone. */
function wrapTables(){
  document.querySelectorAll('.sec.on table').forEach(t=>{
    const p=t.parentNode;
    if(p&&p.classList&&p.classList.contains('tscroll'))return;
    const w=document.createElement('div');
    w.className='tscroll';
    p.insertBefore(w,t); w.appendChild(t);
  });
  /* the fade only earns its place where there is actually something hidden; v281 adds
     the LEFT edge, because once scrolled there is hidden content on both sides and a
     touch screen says nothing about either */
  document.querySelectorAll('.sec.on .tscroll').forEach(w=>{
    const upd=()=>{
      w.classList.toggle('more',w.scrollLeft+w.clientWidth<w.scrollWidth-2);
      w.classList.toggle('morel',w.scrollLeft>2);
    };
    w.classList.toggle('more',w.scrollWidth>w.clientWidth+2);
    w.classList.toggle('morel',w.scrollLeft>2);
    if(w.scrollWidth>w.clientWidth+2&&!w.dataset.wired){w.dataset.wired='1';
      w.addEventListener('scroll',upd,{passive:true});}
  });
}
/* on a phone the rail is one scrolling row, so the tab you just chose can sit off-screen */
function railIntoView(){
  const on=document.querySelector('.rail .tab.on'); if(!on)return;
  const rail=document.getElementById('tabs'); if(!rail||rail.scrollWidth<=rail.clientWidth+2)return;
  try{on.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});}catch(e){}
}
document.getElementById('tabs').onclick=e=>{const s=e.target.dataset.s;if(s)switchTab(s);};
/* v281: THE RAIL ANSWERS THE KEYBOARD. Arrows move and activate, Home and End jump,
   and the active tab is the one tab stop (roving tabindex), so keyboard users are one
   Tab press from the content instead of fifteen. aria-current names the page; a full
   tablist role is deliberately not claimed, because the rail also carries the brand,
   the product switcher and the group bands, which a tablist must not. */
(function(){
  const rail=document.getElementById('tabs'); if(!rail)return;
  const tabs=()=>[...rail.querySelectorAll('.tab')];
  function mark(){tabs().forEach(t=>{const on=t.classList.contains('on');
    if(on)t.setAttribute('aria-current','page');else t.removeAttribute('aria-current');
    t.tabIndex=on?0:-1;});}
  rail.addEventListener('keydown',e=>{
    const ts=tabs(),i=ts.indexOf(document.activeElement); if(i<0)return;
    let j=null;
    if(e.key==='ArrowDown'||e.key==='ArrowRight')j=(i+1)%ts.length;
    else if(e.key==='ArrowUp'||e.key==='ArrowLeft')j=(i-1+ts.length)%ts.length;
    else if(e.key==='Home')j=0;
    else if(e.key==='End')j=ts.length-1;
    if(j==null)return;
    e.preventDefault(); ts[j].focus();
    const s=ts[j].dataset.s; if(s)switchTab(s);
  });
  window.__railMark=mark; mark();
})();
/* built once and never re-rendered: every other header control lives inside #meta, which is
   rewritten whenever the stamp or the role changes, and a button that vanishes mid-click is
   worse than no button */
(function(){const b=document.createElement('button');
  b.className='exitbtn exitfix';b.type='button';
  b.title='Write the queue, stop the server and close the desk';
  b.innerHTML='&#10005; Close';
  b.onclick=deskExit;
  document.body.appendChild(b);})();
document.getElementById('meta').innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><span class="chip">As at <b>'+TODAY.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})+'</b></span><span class="chip stamp">'+(evolution[0]?evolution[0].v:'')+' &middot; updated '+LAST_UPDATED+'</span><span id="deskRole"></span><span id="revealCtrl"></span></div><div id="provBar"></div>';renderReveal();renderRole();
/* the provisional banner rides above every tab, so an uncommitted figure is never
   mistaken for a banked one whichever tab you happen to be looking at */
/* ============ WHICH COPY AM I LOOKING AT (v154) ============
   Two surfaces can show this desk and only one of them can write. The project-folder
   file served on localhost is the MASTER: its own server answers /queue/ping, so marks
   and entries reach the disk. Anything else -- the Cowork sidebar artefact, a
   double-clicked file, a copy in an outputs folder -- is a MIRROR, and a change made
   there is lost the moment it is republished from the master.
   The badge reads the queue ping rather than the URL, because the ping is the thing that
   actually proves write access, and a URL can lie about it. */
function renderRole(){
  const el=document.getElementById('deskRole');if(!el)return;
  const live=(function(){try{return qSyncState==='server';}catch(e){return false;}})();
  const loc=(function(){try{return location.protocol==='http:'||location.protocol==='https:';}catch(e){return false;}})();
  if(live){
    el.innerHTML='<span class="chip" style="border-color:var(--grn);color:var(--grn)" '
      +(window.SALT_CLOUD?'title="Cloud desk. New transactions push to the queue and reach the source at the next daily run. Names arrive sealed and need the passphrase.">':'title="Served by serve_desk.py, so this copy writes salt_queue.json and salt_vault.json to disk.">')
      +(window.SALT_CLOUD?'&#9679; cloud &middot; pushes to source</span>':'&#9679; master &middot; writes to disk</span>');
  }else{
    el.innerHTML='<span class="chip" style="border-color:var(--gold);color:var(--gold)" '
      +'title="No queue server answered, so nothing typed here can be saved. Open the project file with '
      +'Open Salt Command.bat to get the writable copy.">'
      +'&#9679; mirror &middot; read only'+(loc?'':', not served')+'</span>';
  }
}
function renderProvBar(){
  const b=document.getElementById('provBar');if(!b)return;
  if(!provCount){b.innerHTML='';return;}
  b.innerHTML='<div class="provbar"><span>&#9679; <b>'+provCount+'</b> entr'+(provCount===1?'y':'ies')+' recorded but <b>not yet committed</b>'
    +(provRM>0.009?', <b>'+fmt0(provRM)+'</b> of cash':'')
    +' &mdash; every figure below includes '+(provCount===1?'it':'them')+'.</span>'
    +'<button class="ubtn" onclick="undoLast()">Undo last</button>'
    +'<button class="ubtn" onclick="switchTab(\'add\')">Review in Transaction</button>'
    +(provNotes.length?'<span style="color:var(--crim)">'+esc(provNotes.join('; '))+'</span>':'')
    +'</div>';
}
/* Undo drops the entry and rebuilds from the baked source, so it can never leave a
   half-applied state. It only reaches uncommitted entries: once an entry is baked
   into the ledger it is past this point and has to be reversed by a fresh entry. */
function undoEntry(at){
  const i=queue.findIndex(q=>q.at===at);if(i<0)return;
  const gone=queue[i];queue.splice(i,1);
  applyOverlay();saveQueue();render();
  qStatus('Undone: '+esc(gone.raw||'entry')+'.');
}
function undoLast(){
  if(!queue.length)return;
  const last=queue.slice().sort((a,b)=>(a.at||'')<(b.at||'')?-1:1).pop();
  undoEntry(last.at);
}
document.getElementById('foot0').innerHTML='The Obsidian Salt Desk';
/* v273: back to top. Shown once the page has moved a screen's worth, so it never sits over
   a tab that fits without scrolling. The threshold is read from the viewport rather than
   typed, because the tabs differ enormously in length. The listener is passive: it only
   reads scroll position, so it must never be allowed to block the scroll it is watching. */
(function(){
  const b=document.getElementById('totop'); if(!b)return;
  const at=()=>window.pageYOffset||document.documentElement.scrollTop||0;
  const sync=()=>b.classList.toggle('on',at()>Math.max(320,window.innerHeight*.6));
  window.addEventListener('scroll',sync,{passive:true});
  window.addEventListener('resize',sync,{passive:true});
  b.addEventListener('click',()=>{
    /* honour the reduced-motion setting: a smooth scroll IS motion, and the CSS override
       cannot reach a behaviour passed in script */
    const still=window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;
    try{window.scrollTo({top:0,behavior:still?'auto':'smooth'});}catch(e){window.scrollTo(0,0);}
  });
  sync();
  /* a tab change replaces the whole content column, so the old scroll position may no longer
     exist; re-read rather than leaving the button lit over a short tab */
  window._totopSync=sync;
})();
try{const _lsv=localStorage.getItem('saltNameVault');if(_lsv){NAME_VAULT=JSON.parse(_lsv);vaultFromBrowser=true;}}catch(e){}
try{const _lni=localStorage.getItem('saltNewIds');if(_lni)newIds=JSON.parse(_lni);}catch(e){}
try{const _lnl=localStorage.getItem('saltNewLocs');if(_lnl)newLocs=JSON.parse(_lnl);}catch(e){}
try{const _lq=localStorage.getItem('saltQueue');if(_lq)queue=JSON.parse(_lq);}catch(e){}
/* self-clearing queue: an entry with no stamp predates this mechanism, so a watermark
   means it too has been committed */
let queueCleared=0;
if(QUEUE_COMMITTED&&queue.length){
  const before=queue.length;
  queue=queue.filter(q=>q.at&&q.at>QUEUE_COMMITTED);
  queueCleared=before-queue.length;
  if(queueCleared){try{localStorage.setItem('saltQueue',JSON.stringify(queue));}catch(e){}}
}
try{qInit().then(()=>{if(queueCleared&&qSyncState==='server')qPost();});}catch(e){}   // ask the server for the queue route, then sync any self-clearing
applyOverlay();                            // uncommitted entries fold in before anything is drawn
/* v281: a fresh open still lands on Today (v147: the desk opens on what to do), but an
   address that names a tab is honoured, which is what lets a reload resume in place. */
recompute();drawProdSw();
(function(){const h=(location.hash||'').slice(1);switchTab(builders[h]?h:'today');})();
window.addEventListener('hashchange',()=>{
  const h=(location.hash||'').slice(1);
  if(builders[h]&&h!==curTab)switchTab(h);
});
/* ===== v132: ONE palette. The v108 time-of-day bands (dawn/day/dusk/night) and their
   rail switcher are retired at your call; the desk is pinned to Register (classic), the
   palette of the original Salt Trading Register. Nothing selects a theme any more, so
   the stored preference is cleared rather than left to puzzle a future reader. ===== */
(function(){
  document.documentElement.setAttribute('data-tod','register');
  try{localStorage.removeItem('saltTod');}catch(e){}
})();
