   '.note{margin-top:34px;font-size:12px;color:#6b7688;line-height:1.65}',
   '@media print{body{background:#fff;color:#111;padding:24px}',
   '.eyebrow{color:#0b5f70}.q{color:#444}.ok{color:#186b45}.due{color:#8a5b00}',
   '.tr span:last-child{color:#111}.tr.big span:last-child{color:#8a5b00}',
   '.tr.big.clear span:last-child{color:#186b45}td{border-color:#ddd}.rule{background:#ccc}',
   '.owed{background:#f2f8fa;border-color:#9dc4cf}.owedl,.owedv{color:#0b5f70}',
   '.owedv span,.owedn{color:#3d6d78}.owedkg{color:#0b5f70}.gift{color:#5a3d8a}}',
   '</style></head><body><div class="w">',
   '<p class="eyebrow">'+e(o.brand||'Obsidian Salt')+'</p>',
   '<h1>Statement of account</h1>',
   /* the period line has to survive the reader checking it against the rows. Once a
      pending order can sit outside the window, a statement headed "to 02 Aug" can carry
      a line dated 03 Aug, and saying nothing about that is the sort of small
      contradiction that costs more trust than the figure it hides. */
   '<p class="meta">Issued '+e(o.issued)+
     (o.from||o.to?' &middot; '+e(o.from?dLong(o.from):'from the beginning')+' to '+e(o.to?dLong(o.to):'today')
       +(T.pendN&&rows.some(r=>r.pendingOrder&&o.to&&new Date(r.date)>new Date(o.to))
          ?', plus any order agreed and not yet actioned':''):'')+'</p>',
   '<p class="whol" style="margin:26px 0 0">Account</p>',
   '<div class="who">'+e(who)+'</div>',
   '<div class="rule"></div>',
   rows.length?('<table><thead><tr><th class="l">Date</th><th>Quantity</th><th>Amount</th><th class="r">Status</th></tr></thead>'
     +'<tbody>'+body+'</tbody></table>')
     :'<p class="meta">No orders in this period.</p>',
   ((o.refunds||[]).length?'<p class="whol" style="margin:30px 0 0">Refunds</p>'
     +'<table style="margin-top:10px"><thead><tr><th class="l">Date</th><th class="l">Reason</th><th>Amount</th><th class="r">Status</th></tr></thead><tbody>'
     +o.refunds.map(r=>'<tr><td class="l dt">'+e(dLong(r.date))+'</td>'
       +'<td class="l" style="font-size:13px;color:#b9c2d0">Overpayment returned to you</td>'
       +'<td class="amt">'+money(r.amount)+'</td>'
       +'<td class="r">'+(r.paidOn?'<span class="ok">paid '+e(dLong(r.paidOn))+'</span>'
                                  :'<span class="due">owed to you</span>')+'</td></tr>').join('')
     +'</tbody></table>':''),
   '<div class="tot">',
   /* the count must match what was actually totalled, or the footer says three orders
      over a figure covering two, which is the first thing a careful reader checks */
   '<div class="tr"><span>'+(rows.length-T.cxN)+' order'+((rows.length-T.cxN)===1?'':'s')
     +', '+n2(T.qty)+' unit'
     +(T.cxN?'<span class="cxn"> &middot; '+T.cxN+' cancelled, not counted</span>':'')
     +'</span><span>'+money(T.total)+'</span></div>',
   '<div class="tr"><span>Paid</span><span>'+money(T.paid)+'</span></div>',
   /* say plainly which part of the total has not happened yet, so the ordered figure
      and the paid figure can be reconciled without him having to ask why they differ */
   (T.pendN?'<div class="tr sub"><span>of which not yet collected or paid</span><span>'
      +money(T.pendVal)+'</span></div>':''),
   '<div class="tr big'+(T.owed>0.009?'':' clear')+'"><span>'+(T.owed>0.009?'Outstanding':'Balance')+'</span><span>'
     +(T.owed>0.009?money(T.owed):'nil')+'</span></div>',
   '</div>',
   /* GOODS OWED GET THEIR OWN BLOCK. A statement whose only large figure is money can
      read as though nothing else is outstanding, which is exactly the misreading a
      dispute about undelivered salt would turn on. */
   (T.toGet>0.009?'<div class="owed"><p class="owedl">Still to collect</p>'
     +'<p class="owedv">'+n2(T.toGet)+' <span>unit</span></p></div>':''),
   /* THE WORKINGS, step by step, so nothing has to be taken on trust */
   (o.recon||[]).map(R=>{
     let st=0;
     const step=(t,b)=>'<div class="stp"><div class="stpn">'+(++st)+'</div><div class="stpb">'
       +'<p class="stpt">'+t+'</p>'+(b?'<p class="stpd">'+b+'</p>':'')+'</div></div>';
     const legRows=R.legs.map(l=>'<tr><td class="l">'+e(dLong(l.date))+'</td><td>'+n2(l.qty)+' unit</td>'
       +'<td>'+money(l.billed)+'</td><td>'+money(l.paid)+'</td>'
       +'<td class="r"><b class="short">'+money(l.short)+'</b></td></tr>').join('');
     const pays=R.payments.length?R.payments.map(x=>money(x.rm)+' on '+e(dLong(x.date))).join(', ')
                              :money(R.order.paid);
     /* once the salt has gone out the reconciliation is no longer a claim but a record,
        and titling it "how the 0 unit is arrived at" would be nonsense. It is kept
        either way, because the proof is worth more after a dispute than during one. */
     /* the plain-language version, used when there are no earlier orders to show.
        It states only what he already knows: what he ordered, what he paid, what he
        took and what was held back by agreement. It does not name the arrangement the
        salt went against, because a statement is not the place to restate a private
        settlement, and it invites the question instead. */
     if(R.noLegs){
       const gone=R.kgOff, took=R.collected;
       return '<div class="rec"><p class="recl">How your '+e(dLong(R.order.date))+' order was settled</p>'
         +step('The order was paid in full.',
               n2(R.order.qty)+' unit at '+money(R.order.total/R.order.qty)+' a unit is '
               +money(R.order.total)+', received as '+pays+'.')
         +step('Part of it was not handed over, by agreement.',
               '<b>'+n2(gone)+' unit</b> of that order was held back and applied to a separate '
               +'arrangement between us, rather than being collected or refunded. No money '
               +'changed hands on it.')
         +step(R.owed>0.009?'So the salt still due to you is what is left.'
                           :'So the balance of the order was collected in full.',
               '<table class="mini calc"><tbody>'
               +'<tr><td class="l">Bought</td><td class="r">'+n2(R.order.qty)+' unit</td></tr>'
               +'<tr><td class="l">Less applied by agreement</td><td class="r">&minus; '+n2(gone)+' unit</td></tr>'
               +'<tr class="sub"><td class="l">Deliverable</td><td class="r">'+n2(R.deliverable)+' unit</td></tr>'
               +'<tr><td class="l">Less already collected</td><td class="r">&minus; '+n2(took)+' unit</td></tr>'
               +'<tr class="tot"><td class="l">'+(R.owed>0.009?'Still to collect':'Collected in full, nothing outstanding')
               +'</td><td class="r">'+n2(R.owed)+' unit</td></tr>'
               +'</tbody></table>')
         +'<p class="recn">If your own record of that arrangement differs from this, say so '
         +'and it will be gone through line by line.</p></div>';
     }
     return '<div class="rec"><p class="recl">'+(R.owed>0.009
        ?'How the '+n2(R.owed)+' unit is arrived at'
        :'How your '+e(dLong(R.order.date))+' order was settled')+'</p>'
       +step('Earlier orders were not paid in full.',
             '<table class="mini"><thead><tr><th class="l">Order</th><th>Quantity</th><th>Billed</th><th>Paid in cash</th><th class="r">Short</th></tr></thead><tbody>'
             +legRows+'<tr class="tot"><td class="l" colspan="4">Carried forward</td><td class="r"><b class="short">'
             +money(R.shortTot)+'</b></td></tr></tbody></table>')
       +step('That '+money(R.shortTot)+' was settled out of your order of '+e(dLong(R.order.date))+', in salt rather than cash.',
             money(R.shortTot)+' at '+money(R.rate)+' a unit is <b>'+n2(R.kgOff)+' unit</b>, withheld from that order by agreement. No money changed hands and that salt stayed on the shelf.')
       +step('The '+e(dLong(R.order.date))+' order itself is paid in full.',
             n2(R.order.qty)+' unit at '+money(R.order.total/R.order.qty)+' a unit is '+money(R.order.total)+', received as '+pays+'.')
       +step(R.owed>0.009
             ?'So the salt due to you is what you bought, less what settled the balance, less what you have taken.'
             :'So the salt due to you was what you bought, less what settled the balance, less what you had already taken. All of it has since been handed over.',
             '<table class="mini calc"><tbody>'
             +'<tr><td class="l">Bought</td><td class="r">'+n2(R.order.qty)+' unit</td></tr>'
             +'<tr><td class="l">Less applied to the '+money(R.shortTot)+' balance</td><td class="r">&minus; '+n2(R.kgOff)+' unit</td></tr>'
             +'<tr class="sub"><td class="l">Deliverable</td><td class="r">'+n2(R.deliverable)+' unit</td></tr>'
             +'<tr><td class="l">Less already collected</td><td class="r">&minus; '+n2(R.collected)+' unit</td></tr>'
             +'<tr class="tot"><td class="l">'+(R.owed>0.009?'Still to collect':'Collected in full, nothing outstanding')+'</td><td class="r">'+n2(R.owed)+' unit</td></tr>'
             +'</tbody></table>')
       /* the one contradiction a careful reader would otherwise find, answered before he
          finds it: those orders read as settled above yet show short here */
       +'<p class="recn">'+R.legs.map(l=>e(dLong(l.date))).join(' and ')
       +' show as settled at the top of this statement because that balance was cleared '
       +'here, in salt, rather than in cash. Nothing about them is still owed in money.</p>'
       +'</div>';}).join(''),
   '<p class="note">Amounts in ringgit. This statement covers your own orders only, taken from the seller&rsquo;s records as at the issue date. If anything differs from your own, say so and it will be checked.</p>',
   '</div></body></html>'].join('\n');
}
function stmtExport(){
  const g=id=>{const el=document.getElementById(id);return el?el.value:'';};
  const ck=id=>{const el=document.getElementById(id);return !!(el&&el.checked);};
  const party=g('stParty');
  const msg=(t,c)=>{const m=document.getElementById('stMsg');if(m){m.innerHTML=t;m.style.color=c||'var(--mut)';}};
  if(!party)return msg('Choose whose statement this is.','var(--crim)');
  const o={from:g('stFrom')||null,to:g('stTo')||null,
    completed:ck('stDone'),open:ck('stOpen'),pending:ck('stPend'),
    dates:ck('stDates'),links:ck('stLinks'),useName:ck('stName'),
    brand:'Obsidian Salt',
    issued:new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})};
  if(!o.completed&&!o.open&&!o.pending)return msg('Tick at least one kind of order to include.','var(--crim)');
  const rows=stmtRows(party,o);
  o.refunds=stmtRefunds(party,o);
  if(!rows.length&&!o.refunds.length)return msg('Nothing matches those filters for '+esc(codeOf(party))+'.','var(--crim)');
  /* only reconcile orders that are actually IN this statement, so a date filter cannot
     leave a working referring to a line the reader cannot see */
  o.recon=ck('stRecon')?stmtRecon(party,rows).filter(R=>rows.some(x=>x.date===R.order.date)):[];
  const html=stmtDoc(party,rows,o);
  const now=new Date(),pad=n=>(n<10?'0':'')+n;
  const fname='statement_'+String(codeOf(party)).replace(/[^A-Za-z0-9._-]+/g,'-')+'_'
    +now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate())+'.html';
  try{
    const blob=new Blob([html],{type:'text/html;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=fname;a.style.display='none';
    document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},1500);
  }catch(err){return msg('Could not build the file: '+esc(err.message),'var(--crim)');}
  const owed=rows.reduce((a,r)=>a+r.owed,0);
  msg('<b>Saved '+esc(fname)+'</b> &mdash; '+rows.length+' order'+(rows.length===1?'':'s')+', '
    +(owed>0.009?fmt(owed)+' outstanding':'nothing outstanding')
    +'. It carries <b>no cost, no margin and no other party</b>, and none of the internal notes: every line is built from the order itself rather than copied from your book.','var(--grn)');
}
/* the product stamp for a ledger row, in that product's own accent */
function prodTag(t){
  const pr=prodOf(t.type==='BUY'?(t._buy||t):t), P=PRODUCTS[pr];
  if(!P)return '';
  return `<span class="prodtag" style="color:${P.accent}" title="${esc(P.name)}">`
    +`<span class="gl"></span>${esc(P.name)}</span>`;
}
function tabLedger(){
  // a fully pending order (agreed, nothing moved) carries no meaningful date and sits at the very bottom
  const isPend=t=>t.type==='BUY'?(ledgerBuy(t._buy).order==='Pending'):(txStat(t).order==='Pending');
  const all=[...purchases.map(p=>({date:p.date,type:'BUY',who:p.supplier,qty:p.qty,total:p.total,_buy:p})),
    ...sales.map(s=>Object.assign({type:'SELL',who:s.customer},s))]
    .sort((a,b)=>{const pa=isPend(a),pb=isPend(b);if(pa!==pb)return pa?1:-1;return new Date(a.date)-new Date(b.date);});
  const nil='<span class="pnil">&mdash;</span>';
  const pill=(lab,cls)=>lab?`<span class="tag ${cls}">${lab}</span>`:nil;
  const stateCls=st=>st==='Completed'?'paid':st==='Pending'?'pendingt':st==='In-Kind'?'inkind':(st==='Default'||st==='Cancelled')?'def':/^Open/.test(st)?'open':'open';
  // type badge for an amendment kind
  const kindCls={Fulfilment:'efulfil',Modification:'emod',Cancellation:'ecancel',Rewarded:'erewarded',Linked:'elinked'};
  const kindLab=k=>k==='Linked'?'Linked orders':k;
  // ENTRY CODES: every entry takes a sequential E-number in ledger (date) order, and a stable
  // party|date|total key so one entry can point at another.
  const codes=all.map((t,i)=>'E'+(i+1));
  const codeByKey={};all.forEach((t,i)=>{const k=t.who+'|'+t.date+'|'+t.total;if(!(k in codeByKey))codeByKey[k]=codes[i];});
  const refHtml=a=>{const bits=[];
    (a.refKeys||[]).forEach(k=>{const c=codeByKey[k];
      bits.push(c?`<a class="eref elink" href="#ent-${c}" onclick="return goEnt('${c}')">${c}</a>`:`<span class="eref">${k}</span>`);});
    if(a.ref)bits.push(`<span class="eref">${a.ref}</span>`);
    return bits.length?`see ${bits.join(' ')}`:'';};
  // one card per order: opening (strong) -> movements (recessed rail) -> closing (strong, only when completed)
  const rows=all.map((t,idx)=>{
    const code=codes[idx];
    const si=t.type==='BUY'?ledgerBuy(t._buy):txStat(t);
    const am=(t.type==='SELL'&&t.amend&&t.amend.length)?replayAmend(t):[];
    // carry each step's cross-reference keys through the replay (same order, same sort)
    if(am.length){const rawA=t.amend.slice().sort((a,b)=>new Date(a.date)-new Date(b.date));
      am.forEach((s,i)=>{if(rawA[i]&&rawA[i].refKeys)s.refKeys=rawA[i].refKeys;});}
    // opening / closing state resolution
    const openState=am.length?am[0].state:si.order;
    /* In-Kind (barter/rebate) and Default are terminal even when the replay's last
       arithmetic step reads Completed/Open: the special headline wins at close. */
    const finalState=(si.order==='In-Kind'||si.order==='Default'||si.order==='Cancelled')?si.order:(am.length?am[am.length-1].state:si.order);
    const completed=am.length?(am[am.length-1].state==='Completed'||si.order==='In-Kind'||si.order==='Default'||si.order==='Cancelled'):(si.order==='Completed'||si.order==='In-Kind'||si.order==='Default'||si.order==='Cancelled');
    const closeState=finalState;
    const moves=am.length?am.slice(1,completed?am.length-1:am.length):[];
    const single=!am.length;                                             // no movements -> one line only
    // a single-line order carries the CLOSING role when it is done, else it is an open opening
    const headRole=single?(completed?'close':'openlive'):'open';
    const headLabel={open:'Opened',openlive:'Open',close:'Closed'}[headRole];
    const headLabelCls={open:'roleopen',openlive:'roleopen',close:'roleclose'}[headRole];
    // ---- the four numeric columns. Qty and Total show what MOVED at this step in full
    // strength; when nothing moved they carry the order figure over, greyed. Price and
    // Margin are order-level facts, always full strength.
    const price=t.qty>0?t.total/t.qty:0;
    /* v266: PENDING HAS NO MARGIN. Nothing has been paid and nothing delivered, so there is
       no cost of goods against it; printing one states a profit on a trade that has not
       happened. It reappears the moment the order moves. */
    let margin=(t.type==='SELL'&&si.order!=='Pending')?t.total-t.qty*costOf(t):null;
    if(margin!=null&&Math.abs(margin)<0.005)margin=0;   // a rebate settled at cost printed "RM -0.00 · -0%"
    const marPct=(margin!=null&&t.total>0)?margin/t.total*100:null;
    const qCell=(mv,v)=>`<span class="lcol cqty${mv?'':' carried'}">${kg(v)}</span>`;
    const pCell=on=>`<span class="lcol cprc">${on?fmt(price):''}</span>`;
    // total with the deal margin as subtext beneath it (under 20% reads thin)
    /* marPct is null on a zero-value row, and the guard used to test margin alone, so the
       first RM0 line ever written to this book (a rebate redeemed as salt, v218) took the
       whole Ledger tab out. A free unit still has a margin in ringgit; what it has no
       meaning for is a percentage of nothing. */
    const tCell=(mv,v,showMar)=>`<span class="lcol ctot"><b class="tval${mv?'':' carried'}">${fmt0(v)}</b>`
      +((showMar&&margin!=null)?`<em class="submar${(marPct!=null&&marPct<20)?' thin':''}">${fmt(margin)}${marPct!=null?' &middot; '+marPct.toFixed(0)+'%':''}</em>`:'')
      +`</span>`;
    const h=single?null:am[0];                                   // the step the opening line records
    const hKg=single||h.kg>0.0001,hCash=single||h.cash>0.0001;
    const openLine=`<div class="lrow l${headRole==='close'?'close':'open'}">`
      +`<span class="lgroup">`
        +`<span class="ecode">${code}</span>`
        +`<span class="lclabel ${headLabelCls}">${headLabel}</span>`
        +`<span class="ldate">${isPend(t)?'':t.date}</span>`
        +`<span class="tag ${t.type==='BUY'?'buy':'sell'}">${t.type}</span>`
        +prodTag(t)
        +(provOf(t)?`<span class="tag prov" title="recorded but not yet committed">Provisional</span>`:'')
        +`<span class="lparty">${ID(t.who)}</span>`
      +`</span>`
      +qCell(hKg,!single&&hKg?h.kg:t.qty)
      +pCell(true)
      +tCell(hCash,!single&&hCash?h.cash:t.total,true)
      +`<span class="lstate">${pill(single?closeState:openState,stateCls(single?closeState:openState))}</span>`
      +`</div>`;
    // recessed movement panel (only when there are middle steps)
    const stepLine=(a,cls,lead)=>{
      const mk=a.kg>0.0001,mc=a.cash>0.0001,isMod=a.kind==='Modification';
      const noteBits=[];if(a.note)noteBits.push(a.note);const rh=refHtml(a);if(rh)noteBits.push(rh);
      return `<div class="${cls}">`
        +`<span class="lgroup">`
          +lead
          +`<span class="etype ${kindCls[a.kind]||'efulfil'}">${kindLab(a.kind)}</span>`
          +(noteBits.length?`<span class="lmnote">${noteBits.join(' ')}</span>`:'')
        +`</span>`
        +qCell(mk,mk?a.kg:t.qty)
        +pCell(isMod)
        +tCell(mc,mc?a.cash:t.total,isMod)
        +`<span class="lstate">${pill(a.state,a.cls)}</span>`
        +`</div>`;};
    const moveLines=moves.map(a=>stepLine(a,'lmove',`<span class="lmdate">${a.date}</span>`)).join('');
    const movePanel=moveLines?(moves.length>=3?`<details class="lmc"><summary><span class="chev">&#9656;</span>${moves.length} interim steps</summary><div class="lmoves">${moveLines}</div></details>`:`<div class="lmoves">${moveLines}</div>`):'';
    // closing line (full strength) when a multi-step order has completed. Opening->Closing with no
    // middle is fine (moves may be empty). A single-line order carries its close on the head row instead.
    const closeA=am.length?Object.assign({},am[am.length-1],{state:finalState,cls:stateCls(finalState)}):null;
    const closeLine=(completed&&am.length)?stepLine(closeA,'lrow lclose',
       `<span class="ecode"></span><span class="lclabel roleclose">Closed</span><span class="ldate">${closeA.date}</span>`):'';
    /* ============ A PENDING ORDER IS A NOTE TO SELF, NOT AN EVENT (v254) ============
       An order agreed on Monday and settled on Wednesday was rendering as three lines:
       Opened, a Fulfilment, Closed. The middle two say the same thing twice and the first
       records a state that never had any consequence, because PENDING COUNTS NOWHERE on
       this desk. It is a reference, not a movement, so it does not deserve a step.
       THE EXCEPTION IS CREDIT, AND ONLY REAL CREDIT. Where the order sat in Advance or
       Deferred, someone was carrying the other for a while, and above TWO DAYS that is a
       fact about the relationship rather than a rounding of the calendar. Those keep their
       steps. Dwell is measured to the NEXT step, or to today where the state is still open,
       so a position still outstanding cannot hide by never being closed.
       THE CAPTION SURVIVES THE COLLAPSE. Most notes on these rows are restatements of the
       figures beside them, but not all: "paid a day earlier than promised" is the kind of
       thing the trail exists for. Structure is dropped, substance is carried up. */
    const dwell=i=>{const nx=am[i+1];
      return Math.round(((nx?new Date(nx.date):TODAY)-new Date(am[i].date))/86400000);};
    let creditDays=0;
    am.forEach((a,i)=>{if(/Advance|Deferred/.test(a.state))creditDays=Math.max(creditDays,dwell(i));});
    /* THE TEST IS THE CREDIT PERIOD, NOT THE OPENING STATE. The first version also required
       the order to have opened Pending, which kept the steps on every row that opened straight
       into Advance or Deferred and closed the same day or the next: eight orders drawn in three
       lines to say that money and salt crossed within a day of each other. His rule is about
       how long someone carried the other, so that is the only thing tested. */
    const collapse=am.length>0&&completed&&creditDays<=LEDGER_CREDIT_DAYS;
    /* BOILERPLATE IS NOT A CAPTION. The opening step of an auto-built trail carries "as
       booked", which restates the line it sits on; carrying that up would replace three
       lines of noise with one line of noise. Anything a person actually wrote survives. */
    /* DERIVED, NOT TYPED. The written notes stay on the row and stay in the file; what they
       no longer do is print on a card that collapsed precisely because nothing happened worth
       three lines. What prints instead is the one thing the desk can say and he cannot see:
       how this order compares with how that party usually behaves. */
    const caption=collapse?ledFact(t,am):'';
    const collapsedLine=collapse?`<div class="lrow lclose">`
      +`<span class="lgroup">`
        +`<span class="ecode">${code}</span>`
        +`<span class="lclabel roleclose">Closed</span>`
        +`<span class="ldate">${closeA.date}</span>`
        +`<span class="tag ${t.type==='BUY'?'buy':'sell'}">${t.type}</span>`
        +prodTag(t)
        +(provOf(t)?`<span class="tag prov" title="recorded but not yet committed">Provisional</span>`:'')
        +`<span class="lparty">${ID(t.who)}</span>`
        +`<span class="lagreed">agreed ${t.date}</span>`
        +(caption?`<span class="lmnote">${caption}</span>`:'')
      +`</span>`
      +qCell(true,t.qty)+pCell(true)+tCell(true,t.total,true)
      +`<span class="lstate">${pill(finalState,stateCls(finalState))}</span>`
      +`</div>`:'';
    if(!ledMatches(t,si,am,code))return '';
    const cardCls=finalState==='Completed'?'s-completed':finalState==='Pending'?'s-pending':finalState==='In-Kind'?'s-inkind':finalState==='Default'?'s-default':finalState==='Cancelled'?'s-cancelled':'s-open';
    /* v253: a pending order carries its own next action */
    const q=(w,c,l)=>`<button class="lqb ${c}" onclick="ledQuick('${w}','${t.type}','${String(t.who).replace(/'/g,"\\'")}','${t.date}',${+t.total},${+t.qty})">${l}</button>`;
    const quickBar=(finalState==='Pending'&&!provOf(t))
      ? `<div class="lquick"><span class="lqlab">Mark</span>${q('paid','qpaid','Paid')}${q('deliv','qdeliv','Delivered')}${q('done','qdone','Completed')}<span class="lqnote">${fmt0(t.total)} &middot; ${kg(t.qty)} &middot; queues, does not post</span></div>`
      : '';
    return `<div class="lcard ${cardCls}" id="ent-${code}">${collapse?collapsedLine:(openLine+movePanel+closeLine)}${quickBar}</div>`;}).filter(Boolean);
  const shown=rows.length,total=all.length,rowsHtml=rows.join('');
  const parties=[...new Set(all.map(t=>t.who))];
  /* v280: a PENDING order carries no date, because it is not firm until something moves.
     So the month index is built from the rows that have one, and undated rows fall through
     to the bottom of the ledger where they already sort. */
  const months=[...new Set(all.filter(t=>t.date).map(t=>t.date.slice(0,7)))].sort();
  const mLab=m=>new Date(m+'-01').toLocaleDateString('en-GB',{month:'short',year:'numeric'});
  const selOpt=(v,cur,lab)=>`<option value="${v}"${v===cur?' selected':''}>${lab}</option>`;
  const toolbar=`<div class="ledbar">
    <input id="ledQ" placeholder="Search party, note, amount, E-code&hellip;" value="${esc(ledF.q)}">
    <select id="ledState">${selOpt('',ledF.state,'All states')}${['Open','Pending','Completed','In-Kind','Cancelled','Default'].map(x=>selOpt(x,ledF.state,x)).join('')}</select>
    <select id="ledParty">${selOpt('',ledF.party,'All parties')}${parties.map(x=>selOpt(x,ledF.party,ID(x))).join('')}</select>
    <select id="ledMonth">${selOpt('',ledF.month,'All months')}${months.map(x=>selOpt(x,ledF.month,mLab(x))).join('')}</select>
    ${(ledF.q||ledF.state||ledF.party||ledF.month)?'<button class="vbtn" id="ledClear" style="font-size:11px">Clear</button>':''}
    <span class="ledct">${shown} of ${total}</span>
  </div>`;
  return `<h1>Ledger</h1>
  <div class="dsc dsclead">Every transaction the desk holds, newest first, with the trail of what moved when.</div>
  <div class="card" style="margin-bottom:14px"><div class="cardh">The book, day by day <span class="sub">RM written and units moved</span></div><div class="chartbox" style="height:180px"><canvas id="lgTimeChart"></canvas></div></div>
  <h2 style="margin-top:20px">Statement of account <span class="sub" style="font-weight:400">what a customer may be given</span> <span class="rule"></span></h2>
  <div class="dsc" style="margin-bottom:9px">A record of one party&rsquo;s own dealings, for handing to them. Deliberately spare: <b>what they took, when, and how much</b>, and nothing else. It is <b>built rather than copied</b>, so <b>no cost, no margin, no unit price, no other party and none of the notes in this ledger</b> can travel with it &mdash; the notes here are written for you, and several are about your own bookkeeping.</div>
  <div class="card">
    <div class="qrow">
      <div class="qfield"><label>Whose statement</label><select id="stParty"><option value="">Choose a customer…</option>${[...new Set(sales.map(x=>x.customer))].sort().map(id=>`<option value="${id}">${codeOf(id)}</option>`).join('')}</select></div>
      <div class="qfield qkg"><label>From <span style="color:var(--dim)">optional</span></label><input id="stFrom" type="date"></div>
      <div class="qfield qkg"><label>To <span style="color:var(--dim)">optional</span></label><input id="stTo" type="date"></div>
      <div class="qfield"><label>&nbsp;</label><button class="vbtn" onclick="stmtExport()">Export the statement</button></div>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:12px;color:var(--mut)">
      <label style="display:flex;align-items:center;gap:5px"><input type="checkbox" id="stDone" checked> Settled orders</label>
      <label style="display:flex;align-items:center;gap:5px"><input type="checkbox" id="stOpen" checked> Open, with a balance</label>
      <label style="display:flex;align-items:center;gap:5px"><input type="checkbox" id="stPend"> Agreed but nothing moved</label>
      <label style="display:flex;align-items:center;gap:5px"><input type="checkbox" id="stDates" checked> Show payment date where it differs</label>
      <label style="display:flex;align-items:center;gap:5px"><input type="checkbox" id="stRecon" checked> Show the workings where salt settled a balance</label>

    <div class="dsc" style="margin-top:9px"><b>The unit price is deliberately absent.</b> It told them nothing they did not already know, and it made their own rate legible in a single portable document, which is the sort of thing that ends up beside another buyer&rsquo;s. Totals say what was paid; the arithmetic is theirs to do. <b>Their real name</b> is off by default and needs the vault unlocked, the code being used otherwise. It is the one name that belongs on the document, since it is going to them, and no other party appears at any setting.</div>

/* ============ TAB: FINANCIALS (P6 - monthly + financial-year statements) ============ */
/* Basis, stated on the tab: accrual by ORDER DATE (the month a deal was struck);
   pending orders (nothing paid, nothing delivered) count nowhere; in-kind revenue
   (barter, rebate units) is included with a matching in-kind expense so it nets to
   nil cash; provisions follow the desk ladder and are charged in the month the
   receivable arose. Cash view = money actually in, by the same order month. */
function finRows(){
  const m={};
  const bump=(mo,k,v)=>{if(!m[mo])m[mo]={rev:0,cogs:0,cash:0,inkind:0,provAR:0,provSup:0,kg:0};m[mo][k]+=v;};
  /* net of the pending tail, exactly as recompute() does. Without this the P&L reported
     a different revenue from the Overview on the same desk: a part-pending order was
     dropped from neither, so its unmoved slice was counted here and nowhere else. */
  pricedSales.forEach(t=>{const mo=t.date.slice(0,7);
    bump(mo,'rev',(t.total||0)-txPendRM(t));bump(mo,'cogs',(t.qty-txPendKgRaw(t))*costOf(t));bump(mo,'cash',t.cash||0);bump(mo,'kg',t.qty-txPendKgRaw(t));
    bump(mo,'inkind',(t.waived||0)+((t.settle==='barter'||t.rebate)?(t.settledRM||0):0));
    bump(mo,'provAR',+(txAdvance(t)*provRate(dbet(t.date))).toFixed(2));});
  if(typeof supplierReceivable!=='undefined'&&supplierReceivable)
    bump(supplierReceivable.since.slice(0,7),'provSup',+(supRecovGross*provRate(dbet(supplierReceivable.since))).toFixed(2));
  return Object.entries(m).sort((a,b)=>a[0]<b[0]?-1:1);
}

/* AN EMPTY CHART SHOULD TAKE UP NO ROOM (v233). Every one of these guards replaced the
   CANVAS with a sentence, but the .chartbox around it carries an inline height, so a chart
   with nothing to draw still reserved up to 250px of empty box, under a heading describing
   a chart that was not there. His screenshot of the Order book showed one sentence floating
   in a 190px void. chartEmpty removes the whole CARD where the card exists only to hold the
   chart, and otherwise collapses the box to the sentence. */
function chartEmpty(el,msg){
  if(!el)return;
  const box=el.closest?el.closest('.chartbox'):el.parentNode;
  const card=el.closest?el.closest('.card'):null;
  /* a card that is only a heading, a chartbox and its caption has nothing left to say once
     the chart is gone, so it goes with it. A card holding tables keeps its place. */
  const onlyChart=card&&!card.querySelector('table')&&card.querySelectorAll('.chartbox').length<=1;
  if(onlyChart){const d=document.createElement('div');d.className='dsc';d.innerHTML=msg;
    card.parentNode.replaceChild(d,card);return;}
  if(box){box.style.height='auto';box.style.minHeight='0';box.innerHTML='<div class="dsc" style="margin:0">'+msg+'</div>';}
  else if(el.parentNode)el.parentNode.innerHTML='<div class="dsc">'+msg+'</div>';
}

/* ---- what it actually costs to put one order in one customer's hands ---------------
   The point of this panel is the SHAPE, not the total: a per-order cost lands whole on
   a half-unit order and whole again on a six-unit one, so it decides small against bulk
   in a way a per-unit figure never shows. */
/* ============ THE PHONE PAYLOAD (v284) ============
   ONE function, and it is the entire contract between this desk and the phone app.

   The phone is a separate application. It does not load this desk, reflow it, or
   reimplement any of its arithmetic: it fetches what this function returns and renders
   it. That is the whole point. A price shown on a phone is therefore the price THIS
   engine computed, and the two cannot drift, because there is only one of them.

   Two rules it must never break:
     NO REAL NAMES. Codes only. The repo that serves this is private but the app is
     public by decision, so a name here would be a name on the open internet.
     NO COST, MARGIN OR LEAK. Everything the leak test bans from a statement is banned
     here for the same reason and by the same list.
   What it carries is what a seller needs standing in front of a buyer: the board, the
   parties, and the position. */
function phonePayload(){
  /* NAMES OFF, ALWAYS, WHATEVER THE SCREEN IS DOING. `revealed` defaults to TRUE since
     v217 so the directory opens readable, and ID() therefore returns a real name whenever
     the directory is loaded. The first payload built this way carried "Chase Chris for
     RM 90" and "Chase Ron for RM 80" straight out of actions(), bound for a URL this
     repo documents as public with no sign-in. Forcing the lock for the duration of the
     build is the only thing that makes the guarantee hold no matter who calls it. */
  const _reveal=revealed;
  revealed=false;
  try{ return phonePayloadBuild(); } finally { revealed=_reveal; }
}
function phonePayloadBuild(){
  const prods=PROD_IDS.slice();   // salt first, then oil
  const board=PRICE_TIERS.tiers.map(t=>({
    code:t.code, name:t.name, who:t.who||'',
    prices:PRICE_TIERS.sizes.map((q,i)=>t.prices[i]!=null?+t.prices[i]:null)
  }));
  /* position per product, read from the desk's own recompute rather than re-derived */
  const pos={};
  const keep=(typeof PROD!=='undefined')?PROD:prods[0];
  prods.forEach(pid=>{
    try{
      if(typeof setProd==='function')setProd(pid,true); else if(typeof PROD!=='undefined')PROD=pid;
      recompute();
      const cv=coverStats(), f=forecast();
      pos[pid]={
        name:PRODUCTS[pid].name,
        onHand:+currentStock.toFixed(2),
        free:+(currentStock-defKg).toFixed(2),
        owedOut:+defKg.toFixed(2),
        coverDays:cv.days==null?null:+cv.days,
        rate:+(cv.rate||0).toFixed(2),
        owedToYou:+(typeof arGross!=='undefined'?arGross:0).toFixed(2),
        promised:+(f.commitKg||0).toFixed(2),
        short:+(f.shortKg||0).toFixed(2)
      };
    }catch(e){ pos[pid]={name:PRODUCTS[pid].name,error:true}; }
  });
  try{ if(typeof setProd==='function')setProd(keep,true); else if(typeof PROD!=='undefined')PROD=keep; recompute(); }catch(e){}
  /* the action list, trimmed to what fits a phone and stripped of its markup */
  const strip=h=>String(h==null?'':h).replace(/<[^>]+>/g,'').replace(/&[a-z]+;/g,' ').replace(/\s+/g,' ').trim();
  /* TITLES AND MONEY ONLY. The `why` prose is written for him at his own desk and carries
     the effective cost and the provisioning language verbatim: the first payload built
     shipped "RM 58.88/unit effective" and tripped the leak test's own banned list. The app
     this feeds is public by decision, so the reasoning stays on the laptop and the phone
     gets the instruction. */
  let acts=[];
  try{ acts=actions().slice(0,12).map(a=>({sev:a.sev,kind:a.kind,title:strip(a.title),rm:+(a.rm||0).toFixed(2)})); }catch(e){}
  return {
    ok:true,
    v:(evolution[0]?evolution[0].v:''), stamped:LAST_UPDATED,
    generated:new Date().toISOString(),
    unit:'unit', currency:'RM',
    sizes:PRICE_TIERS.sizes.slice(),
    tiers:board,
    products:prods.map(id=>({id:id,name:PRODUCTS[id].name})),
    parties:roster.slice().filter(c=>!/^S/.test(c)),   // customers only; codes, never names
    suppliers:roster.slice().filter(c=>/^S/.test(c)),
    position:pos,
    actions:acts
  };
}
/* The leak test, turned on the payload itself. Same banned vocabulary as
   05_Pricing/leak_test.js, plus every per-unit cost in the book in its money form. The
   build calls this and refuses to write data.json if it returns anything. */
function phonePayloadLeaks(){
  /* the generated timestamp is scrubbed before scanning. An ISO stamp carries digits and
     a dot, so ":17.00Z" reads as the money form of a RM7 cost and the check failed on one
     run in sixty for no reason at all. leak_test.js learned the same lesson about dates
     and font sizes: a test that cries wolf teaches you to skim past the real one. */
  const p=JSON.stringify(phonePayload()).replace(/"generated":"[^"]*"/,'').toLowerCase();
  const TERMS=['markup','mark-up','cost per','unit cost','per-unit cost','wavg','weighted average',
    'shrinkage','walk-away','walkaway','floor price','breakeven','break-even','gross profit',
    'gross margin','bad debt','provision','free-to-sell','effective cost','/unit effective'];
  const hits=TERMS.filter(t=>p.indexOf(t)>=0);
  /* every real name the desk can currently see, checked against the payload. This is the
     check that would have caught Chris and Ron, and it only works while the directory is
     loaded, which is exactly when the risk exists. */
  try{
    Object.keys(vaultNames||{}).forEach(code=>{
      const nm=nameOnly(String(vaultNames[code]||'')).trim();
      if(nm.length>2 && p.indexOf(nm.toLowerCase())>=0) hits.push('REAL NAME '+nm);
    });
  }catch(e){}
  const money=v=>Number(v).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});
  const costs=new Set();
  sales.forEach(s=>{if(s.cost!=null&&+s.cost>0)costs.add(money(+s.cost));});
  costs.forEach(c=>{if(p.indexOf(c.toLowerCase())>=0)hits.push('cost figure '+c);});
  return hits;
}

  </div>

  </div>

  <div class="card" style="margin-top:8px"><table><thead><tr><th class="l">Size</th><th>${esc(tier.code)} price</th><th>Goods</th><th>Per order</th><th>Order earns</th><th>Per unit</th><th>Pays your time to</th></tr></thead><tbody>${rows}</tbody></table>

function tabReceivables(){

     totals under each heading were the totals of everything. Every list here is now scoped,
     which is what the heading above it has been claiming since v262.
     THE SUPPLIER REFUND IS THE ONE EXCEPTION and stays as it is: supRecovGross is already
     salt-only by construction, because a written-off default belongs to the book it happened
     on and must not follow the switcher onto another product's page. */
  const _S=pSales(PROD), _B=pPurch(PROD);
  const none='<div class="dsc">None.</div>';

  const cSaltKg=+cSalt.reduce((a,r)=>a+r.k,0).toFixed(2),cSaltRm=+cSalt.reduce((a,r)=>a+r.rm,0).toFixed(2);

  const cPenKg=+cPen.reduce((a,r)=>a+r.k,0).toFixed(2),cPenRm=+cPen.reduce((a,r)=>a+r.rm,0).toFixed(2);
  const cPenBody=cPen.map(r=>`<tr><td class="l mono">${ID(r.id)}</td><td class="l">${r.date||'not dated'}</td><td>${kg(r.k)}</td><td>${fmt0(r.rm)}</td></tr>`).join('');
  // ===== SUPPLIER SIDE =====
  // Cash you owe suppliers: bills for salt delivered to you, unpaid.
  /* an unpaid lot is a bill whether or not it has landed: excluding in-transit hid a
     real payable, and the panel opposite was simultaneously calling it "paid for" */
  const sCash=_B.filter(p=>p.status!=='paid'&&!p.defaulted&&!p.pending).map(p=>({id:p.supplier,date:p.date,rm:+(p.total-(p.cash||0)).toFixed(2)}));
  const sCashBody=sCash.map(p=>`<tr><td class="l mono">${ID(p.id)}</td><td class="l">${p.date}</td><td>${fmt0(p.rm)}</td></tr>`).join('');
  const sCashTot=+sCash.reduce((a,p)=>a+p.rm,0).toFixed(2);
  // Salt suppliers owe you: paid (or part-paid) but not yet received (in transit).
  const sSalt=_B.filter(p=>poOpenKg(p)>0.0001&&!p.defaulted&&!p.pending)
    .map(p=>({id:p.supplier,date:p.date,k:poOpenKg(p),rm:+(poOpenKg(p)*poRate(p)).toFixed(2),paid:poCash(p)>=p.total-0.009}));
  const sSaltBody=sSalt.map(p=>`<tr><td class="l mono">${ID(p.id)}</td><td class="l">${p.date}</td><td>${kg(p.k)}</td><td>${fmt0(p.rm)}</td></tr>`).join('');

  ${sec('Cash owed to you','advance deliveries &mdash; salt out, payment short; aged &amp; provisioned',cCash.length,
    `<table><thead><tr><th class="l">Customer</th><th class="l">Since</th><th>Age</th><th>Gross</th><th>Prov.</th><th>Net</th></tr></thead><tbody>${cCashBody}<tr class="tot"><td class="l" colspan="3">Total</td><td>${fmt0(arGross)}</td><td>&mdash;</td><td>${fmt0(ar)}</td></tr></tbody></table>`)}

const PLAN_ST={committed:'Committed',idea:'Idea',done:'Done',dropped:'Dropped'};
function planQueued(){return queue.filter(x=>x.payload&&x.payload.mode==='plan');}
function planList(){
  return whiteboard.concat(planQueued().map(x=>({
    id:'new',added:(x.at||'').slice(0,10),due:(x.payload.due||null),
    status:(x.payload.status||'idea'),title:(x.payload.title||x.raw||'(untitled)'),
    detail:(x.payload.detail||''),worth:(x.payload.worth==null?null:x.payload.worth),_q:true})));
}
function planDue(p){
  if(!p.due||p.status==='done'||p.status==='dropped')return '';
  const d=dbet(p.due);
  return d>0?` &middot; due <b>${p.due}</b> <span class="risk">overdue by ${d} day${d===1?'':'s'}</span>`
       :d===0?` &middot; due <b>${p.due}</b> <span class="attn">today</span>`
       :` &middot; due <b>${p.due}</b>, in ${-d} day${d===-1?'':'s'}`;
}
/* WHAT A PLAN IS WORTH IS A FIELD, NOT A GUESS FROM ITS PROSE (v210).
   This shipped twice as a regex over the plan text and was wrong both times. Taking the
   FIRST figure made P17 read RM62.94, a unit cost it quotes in passing, when the plan is
   worth RM973. Taking the LARGEST made P15 read RM8,950, a cash count it mentions while
   proposing to draw RM250. Both produced a number that looked computed, sat in a money
   column and was neither checked nor checkable, which is the exact failure this desk
   refuses everywhere else: an invented figure is indistinguishable from a counted one.
   So there is no inference. worth is an explicit optional number on the plan record,
   entered in the form below, and a plan nobody has priced shows a dash. The dash is
   information: it says this has not been thought about in money yet. */
const planWorth=p=>(p.worth==null||p.worth===''||!isFinite(+p.worth))?null:fmt0(+p.worth);
/* A PLAN IS NOW A HEADLINE WITH THE REASONING FOLDED BEHIND IT (v210). It used to print
   in full, every plan, every visit: 18 blocks and 16,863 characters, 93% of the tab and
   the worst density on the desk. The write-up is the asset and none of it is deleted;
   it is one click away instead, and the summary carries what decides whether to click:
   what it is, what it is worth, and whether it has slipped. The detail deliberately
   carries class plbody rather than dsc, or the notes rule would hide it a second time
   and the click would open an empty box. */
function planCard(p){
  const live=p.status!=='done'&&p.status!=='dropped';
  const d=p.due&&live?dbet(p.due):null;
  const late=d!=null&&d>0;
  const rm=planWorth(p);
  const state=late?`${d}d late`:(d===0?'due today':(d!=null?`in ${-d}d`:(PLAN_ST[p.status]||esc(p.status))));
  return `<details class="plan${late?' planlate':''}${live?'':' plandone'}"${late?' open':''}>
    <summary>
      <span class="plid mono">${esc(p.id==='new'?'NEW':p.id)}</span>
      <span class="plt">${esc(p.title)}</span>
      <span class="plrm" title="What you judged this plan to be worth when you filed it. A dash means nobody has priced it yet.">${rm||'&mdash;'}</span>
      <span class="plst">${state}</span>
    </summary>
    <div class="plbody">${p.detail?esc(p.detail):'<i>No detail recorded.</i>'}
      <div class="plfoot">Added ${esc(p.added)}${planDue(p)}${p._q?' &middot; <span class="attn">queued, not yet filed</span>':''}</div>
    </div>
  </details>`;
}
/* ============ THE OBSERVATION ENGINE (v273) ============
   THE WHITEBOARD USED TO HOLD WHAT HE TYPED. It now holds what the desk works out for
   itself, and the difference is that a derived item cannot go stale: it is recomputed from
   the ledger on every load, so it can never disagree with the tab it came from. The old
   P-series went stale the moment a figure moved and then sat on screen reading as current,
   which is the failure this replaces.

   SIX FAMILIES, and the split is by what you would DO about the item, not by where the
   data came from:
     rhythm     when demand arrives, and therefore when to buy
     integrity  the book contradicting itself, or a row that cannot be right
     customer   who is drifting away, and what that is worth
     pricing    margin moving underneath prices that are not moving
     promo      something worth doing, sized before it is proposed
     upkeep     the desk's own hygiene: counts, locks and unattributed figures

   EVERY OBSERVATION CARRIES ITS OWN SAMPLE SIZE AND SAYS WHEN IT IS TOO THIN TO ACT ON.
   That is not a disclaimer, it is the point: this book is six weeks old, so a day-of-week
   read stands on roughly six observations per day and a single 12.5 unit lot can invent a
   pattern out of nothing. Anything computed off a thin sample is shrunk towards no effect
   before it reaches the restock signal, and labelled so on screen.

   NOTHING HERE MOVES A FIGURE. The engine reads; it never writes to sales, purchases,
   stock or cash. Acknowledging or dismissing an item rides the queue as mode:'obs', which
   applyOverlay ignores exactly as it ignores mode:'plan'. */

/* KL PUBLIC HOLIDAYS, verified 08 Aug 2026 against publicholidays.com.my and

   not, so 2027 carries only the fixed anchors and the engine says plainly when it has run

const HOL_VERIFIED_TO='2026-12-25';
const HOL_MAP=(()=>{const m={};KL_HOLIDAYS.forEach(h=>{m[h.d]=h.n;});return m;})();

const OBS_FAM={
  rhythm   :{lbl:'Demand rhythm',   q:'when demand arrives, and what to buy against it'},
  integrity:{lbl:'Integrity',       q:'the book disagreeing with itself'},
