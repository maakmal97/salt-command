/* DISMISSALS COMMITTED INTO THE DESK. Each run I fold anything you dismissed on the tab
   down into this array, so it survives a browser clear and reaches every copy of the desk.
   until:null is permanent; a date is a snooze and the item returns by itself on that day. */
const OBS_DISMISS=[
];
function obsQueued(){return queue.filter(x=>x.payload&&x.payload.mode==='obs');}
/* the queue wins over the committed array, because it is newer by construction */
function obsState(id){
  let st=null;
  OBS_DISMISS.forEach(d=>{if(d.id===id)st={act:d.act||'dismiss',until:d.until||null,why:d.why||''};});
  obsQueued().slice().sort((a,b)=>(a.at||'')<(b.at||'')?-1:1).forEach(q=>{
    if(q.payload.id===id)st={act:q.payload.act||'dismiss',until:q.payload.until||null,why:q.payload.why||'',_q:true};
  });
  if(!st)return null;
  /* BRINGING ONE BACK IS ITSELF AN ENTRY, not the absence of one. The queue is append-only,
     so a restore cannot delete the dismissal that preceded it; it has to overrule it, and
     the last entry for an id wins. Without this the Bring back button wrote a record that
     read as another kind of hush and the item never came back. */
  if(st.act==='restore')return null;
  if(st.until&&dbet(st.until)>=0)return null;   /* the snooze has run out, so it comes back */
  return st;
}

/* ---- small helpers, all guarded: a division by nothing must return null, never NaN ---- */
const obsDiv=(a,b)=>(b&&isFinite(b)&&b!==0&&isFinite(a))?a/b:null;
const obsPct=(a,b)=>{const r=obsDiv(a,b);return r==null?null:+(r*100).toFixed(1);};
const obsISO=d=>d.toISOString().slice(0,10);
const obsDay=n=>new Date(TODAY.getTime()+n*86400000);
const DOW=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DOW3=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
/* Kuala Lumpur keeps a Saturday to Sunday weekend. Johor, Kedah, Kelantan and Terengganu
   run Friday to Saturday; this desk sells in KL, so Saturday and Sunday it is. */
const isWknd=dt=>dt.getUTCDay()===0||dt.getUTCDay()===6;
/* THE PAY WINDOW. Malaysian wages must be paid within seven days of the end of the wage
   period, so for a monthly salary the money lands somewhere between the 25th and the 7th.
   That is the window, not a single day, because employers inside it differ. */
const inPayWin=dt=>{const d=dt.getUTCDate();return d>=25||d<=7;};

/* A ROW COUNTS AS DEMAND ONLY IF SOMEBODY ASKED FOR SALT AND PAID A PRICE FOR IT.
   Rebate redemptions are salt earned, not salt asked for; cancelled rows never happened;
   a nil-value row is a correction. Including any of them would put a spike in the rhythm
   on the day a reward was handed over, which is the opposite of a demand signal. */
function obsDemandRows(pr){
  const P=pr||DEFAULT_PROD;
  return sales.filter(s=>prodOf(s)===P&&!s.cancelled&&!s.rebate&&s.date&&(+s.qty>0.0001)&&(+s.total>0.0001));
}

/* ============ RHYTHM ============
   MEASURED ON THE ORDER DATE, NOT THE DELIVERY DATE. Demand arrives when somebody asks;
   when the salt physically moved is a fulfilment fact and belongs to the shelf walk, not
   here. Using delivery dates would smear a Sunday order onto a Tuesday van.

   TWO RATES, AND THE SECOND ONE IS THE HONEST ONE. Units a day is what you buy against,
   but on a book this size it is dominated by lot size: one 12.5 unit order lands on one
   weekday and that weekday looks like a phenomenon. Orders a day is far steadier, so both
   are computed and the confidence is judged on the order count. */
function demandRhythm(pr){
  const rows=obsDemandRows(pr);
  if(!rows.length)return {n:0,days:0,empty:true};
  const dates=rows.map(r=>r.date).sort();
  const first=new Date(dates[0]), last=TODAY;
  const days=Math.max(1,Math.round((last-first)/86400000)+1);
  const perDay={};                       /* ISO date -> {kg, n} */
  rows.forEach(r=>{const k=r.date;(perDay[k]=perDay[k]||{kg:0,n:0});perDay[k].kg+=+r.qty;perDay[k].n++;});
  /* every calendar day in the window, including the silent ones: a day nobody ordered is
     evidence about that weekday, and dropping it would read only the days that worked */
  const cal=[];
  for(let i=0;i<days;i++){
    const dt=new Date(first.getTime()+i*86400000), k=obsISO(dt);
    cal.push({dt:dt,iso:k,kg:(perDay[k]||{}).kg||0,n:(perDay[k]||{}).n||0,dow:dt.getUTCDay()});
  }
  const agg=list=>{
    const d=list.length, kgs=list.reduce((a,x)=>a+x.kg,0), ns=list.reduce((a,x)=>a+x.n,0);
    return {days:d,kg:kgs,orders:ns,kgPerDay:obsDiv(kgs,d),ordPerDay:obsDiv(ns,d)};
  };
  const all=agg(cal);
  const byDow=DOW.map((_,i)=>agg(cal.filter(c=>c.dow===i)));
  const wknd=agg(cal.filter(c=>isWknd(c.dt))), wkdy=agg(cal.filter(c=>!isWknd(c.dt)));
  const payw=agg(cal.filter(c=>inPayWin(c.dt))),  mid=agg(cal.filter(c=>!inPayWin(c.dt)));
  /* HOW MANY HOLIDAYS FELL INSIDE THE OBSERVED WINDOW. On this book the answer is none,
     and that is a finding rather than a gap to paper over: the holiday factor is therefore
     pinned at 1.00 and the tab says so instead of inventing a lift. */
  const holIn=cal.filter(c=>HOL_MAP[c.iso]).length;
  /* SHRINKAGE TOWARDS NO EFFECT. A ratio computed on six days is mostly noise, so it is
     pulled back towards 1 by n/(n+k) with k=8 day-observations. At six days a measured
     +60% arrives as +26%; at forty it arrives as +50%. Nothing here is a forecast, and
     shrinking is what stops a thin read turning into a confident purchase. */
  const K=8;
  const fac=(part,base)=>{
    const r=obsDiv(part.ordPerDay,base.ordPerDay);
    if(r==null||!isFinite(r))return {raw:null,f:1,n:part.days};
    const w=obsDiv(part.days,part.days+K)||0;
    return {raw:+r.toFixed(3),f:+(1+(r-1)*w).toFixed(3),n:part.days};
  };
  return {
    n:rows.length,days:days,from:dates[0],to:obsISO(TODAY),empty:false,
    all:all,byDow:byDow,wknd:wknd,wkdy:wkdy,payw:payw,mid:mid,holIn:holIn,
    fWknd:fac(wknd,all),fWkdy:fac(wkdy,all),fPay:fac(payw,all),fMid:fac(mid,all),
    fDow:byDow.map(b=>fac(b,all)),
  };
}

/* THE FORWARD WINDOW: fourteen days, each one carrying the weekday factor times the pay
   window factor. The holiday factor is 1.00 by construction until a holiday has actually
   been traded through, so a holiday in the window raises a flag and does not move a number.
   Multiplying two shrunk factors is deliberately conservative. */
function restockSignal(R){
  if(!R||R.empty)return null;
  const days=[];
  for(let i=1;i<=14;i++){
    const dt=obsDay(i), iso=obsISO(dt);
    const fD=(R.fDow[dt.getUTCDay()]||{f:1}).f;
    const fP=(inPayWin(dt)?R.fPay.f:R.fMid.f);
    days.push({iso:iso,dow:dt.getUTCDay(),f:fD*fP,hol:HOL_MAP[iso]||null,pay:inPayWin(dt)});
  }
  const flat=R.all.kgPerDay||0;
  const idx=obsDiv(days.reduce((a,d)=>a+d.f,0),days.length);
  const expect=flat*days.reduce((a,d)=>a+d.f,0);
  const flatExpect=flat*14;
  return {days:days,flat:flat,index:idx==null?1:+idx.toFixed(3),
          expect:expect,flatExpect:flatExpect,
          delta:expect-flatExpect,
          pct:obsPct(expect-flatExpect,flatExpect),
          hols:days.filter(d=>d.hol),
          pastTable:obsISO(obsDay(14))>HOL_VERIFIED_TO};
}

/* ============ THE PARITY SELF-TEST (v275) ============
   THE PRODUCT SPLIT AT v228 WAS NEVER FINISHED, AND NOTHING NOTICED FOR FORTY-SEVEN VERSIONS.
   Six tabs were wrapped in perProduct; roughly forty reads inside them, and inside the
   helpers they call, kept reading `sales` and `purchases` WHOLE while being compared against
   figures recompute() had scoped to one product. The order book was caught at v272 and the
   forecast behind Today and Forward at v275, both by eye.

   Knowing which globals are scoped is a rule that has to be remembered, and this desk has
   already learned twice what happens to those. So the desk now tests itself. Each check
   below states a relationship that MUST hold if scoping is right, and reports where it does
   not. It cannot find every case, because a bare read that happens to agree today is
   invisible; it finds the ones that are actually wrong now, which is the set that matters.

   THE POINT IS PRODUCT THREE. Declaring one should surface its own gaps on this tab within a
   load, rather than waiting to be spotted by somebody reading the source. */
function parityScan(){
  const out=[], keep=PROD;
  const per={};
  try{
    PROD_IDS.forEach(pr=>{PROD=pr;recompute();
      per[pr]={stock:currentStock,counted:stockCounted,rev:revTotal,ar:ar,defKg:defKg,
               sold:pSales(pr).length,bought:pPurch(pr).length,
               fc:(function(){try{const f=forecast();return {commit:f.commitKg,short:f.shortKg};}catch(e){return null;}})()};
    });
  }finally{PROD=keep;recompute();}

  /* 1. A COMMITMENT THAT IS IDENTICAL ACROSS TWO BOOKS IS THE SIGNATURE OF AN UNSCOPED READ.
        Two products cannot owe the same quantity to the same people by coincidence; when
        they do, something is reading the whole book and calling it one. */
  const commits=PROD_IDS.map(pr=>(per[pr].fc||{}).commit).filter(v=>v!=null&&v>0.009);
  if(commits.length>1&&new Set(commits.map(v=>+v.toFixed(2))).size===1){
    out.push({k:'commit',pr:null,what:'Every book reports the same '+kg(commits[0])+' promised out',
      why:'Two products do not owe the same quantity by coincidence. Something behind Today and Forward is reading every order and presenting it as one book\u2019s.'});
  }
  /* 2. A BOOK WITH NO ORDERS CANNOT HAVE COMMITMENTS OR RECEIVABLES OF ITS OWN. */
  PROD_IDS.forEach(pr=>{
    const d=per[pr]; if(!d)return;
    if(d.sold===0){
      if(d.fc&&d.fc.commit>0.009)out.push({k:'empty',pr:pr,what:PRODUCTS[pr].name+' has no orders yet but reports '+kg(d.fc.commit)+' promised out',
        why:'A book with nothing sold on it cannot owe anything. The figure belongs to another product.'});
      if(d.ar>0.009)out.push({k:'empty',pr:pr,what:PRODUCTS[pr].name+' has no orders yet but reports '+fmt0(d.ar)+' receivable',
        why:'Nothing has been sold on this book, so nobody can owe it money.'});
    }
  });
  /* 3. UNCOUNTED IS A REAL STATE AND MUST NOT BORROW ANOTHER BOOK'S COUNT. */
  PROD_IDS.forEach(pr=>{
    const d=per[pr]; if(!d||d.counted)return;
    out.push({k:'uncounted',pr:pr,what:PRODUCTS[pr].name+' has never been counted, so its shelf is the ledger',
      why:'Stated rather than hidden: the count always wins on this desk, and where there is no count the ledger stands and the plug is nil. Take one and the shrinkage on this book becomes measurable.'});
  });
  /* 4. THE FORM MUST BE ABLE TO REACH EVERY BOOK. If a product cannot be selected on the
        Transaction tab it cannot be recorded, which is how oil went four versions with three
        hand-written rows and no way to add a fourth. */
  const reach=(typeof WB_NO_PROD!=='undefined');
  if(!reach)out.push({k:'form',pr:null,what:'The Transaction tab cannot say which book an entry is for',
    why:'Every entry would book to '+((PRODUCTS[DEFAULT_PROD]||{}).name||DEFAULT_PROD)+' whatever the rail shows.'});
  /* 5. A PRODUCT DECLARED BUT ABSENT FROM THE BOOKS is not an error, but it is worth saying,
        because every per-product surface will draw an empty block for it. */
  PROD_IDS.forEach(pr=>{const d=per[pr];if(d&&d.sold===0&&d.bought===0)
    out.push({k:'declared',pr:pr,what:PRODUCTS[pr].name+' is declared but has nothing on the books',
      why:'Every per-product tab will draw an empty block for it until the first entry lands.'});});
  return {rows:out,per:per};
}

/* ============ THE RULES ============
   Each one pushes at most a handful of items and every item states the evidence it stands
   on. An id must be STABLE across loads and must encode the thing observed rather than its
   position in a list, or a dismissal would silently move onto a different item the next
   time the book changed. */
function observations(){
  const O=[], add=o=>{if(o)O.push(o);};
  /* v275: PRODUCT-AWARE, AND IT WAS INCOHERENT BEFORE. The rhythm was pinned to salt while
     the pricing and upkeep rules read pxCost() and tierBoard(), which follow the ACTIVE
     product, so one tab mixed one book's demand with another's cost. Now the per-product
     families run once per product and carry the product in their id, so a hush on salt's
     shrinkage does not also hush oil's. The cross-product families, integrity and customers,
     run once over the whole book, because a duplicate entry and a lapsed customer belong to
     the business rather than to a commodity. */
  const PSCOPE=PROD_IDS.filter(pr=>obsDemandRows(pr).length>0);
  const R=demandRhythm(DEFAULT_PROD), F=restockSignal(R);
  const D=obsDemandRows(DEFAULT_PROD);
  const cust=[...new Set(sales.filter(s=>!s.cancelled&&s.customer).map(s=>s.customer))];

  /* ---------- RHYTHM ---------- */
  if(!R.empty){
    /* CONFIDENCE IS JUDGED ON THE THINNEST BUCKET, NOT THE TOTAL. Fifty-five orders sounds
       like plenty until they are cut seven ways and each weekday stands on six days. Any
       claim that leans on a per-day split is therefore thin however many orders the book
       holds in total; only the coarse two-way splits earn the total as their sample. */
    const minDow=Math.min.apply(null,R.byDow.map(b=>b.days));
    const conf=R.all.orders>=40?'measured':'thin';
    const confDay=(R.all.orders>=40&&minDow>=12)?'measured':'thin';
    /* WEEKEND AGAINST WEEKDAY */
    const wr=obsDiv(R.wknd.ordPerDay,R.wkdy.ordPerDay);
    if(wr!=null){
      const up=wr>=1, pct=Math.abs((wr-1)*100);
      add({id:'rhythm:weekend:'+DEFAULT_PROD,fam:'rhythm',sev:pct>=25?'watch':'note',conf:conf,rm:null,tab:'analysis',
        title:`Weekends run ${pct<5?'level with':(up?'busier than':'quieter than')} weekdays`,
        why:pct<5
          ? `Saturday and Sunday take ${R.wknd.ordPerDay.toFixed(2)} orders a day against ${R.wkdy.ordPerDay.toFixed(2)} on weekdays. On this book the weekend is not a different market, so there is nothing to buy against here.`
          : `Saturday and Sunday take ${R.wknd.ordPerDay.toFixed(2)} orders a day against ${R.wkdy.ordPerDay.toFixed(2)} on weekdays, ${pct.toFixed(0)}% ${up?'more':'less'}. Measured instead against the all-day average of ${R.all.ordPerDay.toFixed(2)}, which is the basis the restock signal works in, the weekend sits at ${R.fWknd.raw==null?'no reading':R.fWknd.raw.toFixed(2)} and arrives as ${R.fWknd.f.toFixed(2)} once shrunk for ${R.wknd.days} days of evidence. The two comparisons are different questions and both are shown, because a weekend that is quiet against weekdays is not the same claim as a weekend that is quiet against the week.`,
        ev:[`${R.wknd.days} weekend days and ${R.wkdy.days} weekdays observed, ${R.from} to ${R.to}`,
            `weekend ${kg(R.wknd.kg)} over ${R.wknd.orders} orders, weekday ${kg(R.wkdy.kg)} over ${R.wkdy.orders}`,
            `units a day: ${(R.wknd.kgPerDay||0).toFixed(2)} weekend against ${(R.wkdy.kgPerDay||0).toFixed(2)} weekday`]});
    }
    /* THE BUSIEST AND QUIETEST DAY, only where there is something to separate them */
    const ranked=R.byDow.map((b,i)=>({i:i,b:b})).filter(x=>x.b.days>=3&&x.b.ordPerDay!=null)
                        .sort((a,b)=>b.b.ordPerDay-a.b.ordPerDay);
    if(ranked.length>=4&&ranked[0].b.ordPerDay>0){
      const hi=ranked[0], lo=ranked[ranked.length-1];
      const spread=obsDiv(hi.b.ordPerDay,lo.b.ordPerDay||null);
      add({id:'rhythm:dow:'+DEFAULT_PROD,fam:'rhythm',sev:'note',conf:confDay,rm:null,tab:'analysis',
        title:`${DOW[hi.i]} is the busiest day, ${DOW[lo.i]} the quietest`,
        why:`${DOW[hi.i]} takes ${hi.b.ordPerDay.toFixed(2)} orders a day and ${DOW[lo.i]} ${lo.b.ordPerDay.toFixed(2)}${spread?`, a spread of ${spread.toFixed(1)} to 1`:''}. Each weekday stands on about ${Math.round(R.days/7)} observations, so treat this as where to look rather than as a rule. One 12.5 unit lot on a Tuesday would rewrite it.`,
        ev:R.byDow.map((b,i)=>`${DOW3[i]}: ${b.days} days, ${b.orders} orders, ${kg(b.kg)}`)});
    }
    /* THE PAY WINDOW */
    const pr=obsDiv(R.payw.ordPerDay,R.mid.ordPerDay);
    if(pr!=null){
      const up=pr>=1, pct=Math.abs((pr-1)*100);
      add({id:'rhythm:payday:'+DEFAULT_PROD,fam:'rhythm',sev:pct>=25?'watch':'note',conf:conf,rm:null,tab:'analysis',
        title:`The pay window runs ${pct<5?'level with':(up?'ahead of':'behind')} mid-month`,
        why:`Malaysian wages must be paid within seven days of the end of the wage period, so a monthly salary lands somewhere between the 25th and the 7th. Across that window this book takes ${R.payw.ordPerDay.toFixed(2)} orders a day against ${R.mid.ordPerDay.toFixed(2)} from the 8th to the 24th${pct<5?'. On this book payday is not visible in the order flow yet.':`, ${pct.toFixed(0)}% ${up?'more':'less'}. Shrunk for sample that is a factor of ${R.fPay.f.toFixed(2)}.`}`,
        ev:[`${R.payw.days} days inside the window, ${R.mid.days} outside`,
            `in-window ${kg(R.payw.kg)} over ${R.payw.orders} orders, mid-month ${kg(R.mid.kg)} over ${R.mid.orders}`,
            `the window is 25th to 7th, which spans a month end, so it is two part-months rather than one block`]});
    }
    /* HOLIDAYS: calendar awareness, and an honest nil where there is no sample */
    if(F){
      const hs=F.hols;
      const nextH=KL_HOLIDAYS.filter(h=>h.d>=obsISO(TODAY)).sort((a,b)=>a.d<b.d?-1:1)[0];
      add({id:'rhythm:holiday:'+DEFAULT_PROD,fam:'rhythm',sev:hs.length?'watch':'note',conf:'none',rm:null,tab:'inventory',
        title:hs.length
          ? `${hs.length} Kuala Lumpur ${hs.length===1?'holiday':'holidays'} inside the next fortnight`
          : (nextH?`Next Kuala Lumpur holiday is ${esc(nextH.n)}, ${-dbet(nextH.d)} days out`:'No verified holiday left in the table'),
        why:`${hs.length?`${hs.map(h=>`${esc(h.hol)} on ${h.iso}`).join(' and ')}. `:''}${R.holIn===0
          ? `THIS BOOK HAS NEVER TRADED THROUGH A HOLIDAY. Not one Kuala Lumpur holiday falls inside ${R.from} to ${R.to}, so there is no measured lift or drop to apply and the restock signal holds the holiday factor at 1.00 rather than guessing one. What the calendar can tell you is that the shelf should not be allowed to run thin across the date; what it cannot tell you is which way demand moves.`
          : `${R.holIn} holiday day${R.holIn===1?'':'s'} sit inside the observed window, which is still too few to read a factor from.`}`,
        ev:[`holiday table verified 08 Aug 2026 for Kuala Lumpur, complete to ${HOL_VERIFIED_TO}`,
            `2027 carries statutory fixed dates only; the lunar and Islamic festivals are left out rather than guessed`,
            F.pastTable?'the forward window now runs past the verified table, so treat the far end as unchecked':'the forward window sits inside the verified table']});
    }
    /* THE SIGNAL ITSELF */
    if(F){
      const pct=F.pct==null?0:F.pct, big=Math.abs(pct)>=8;
      add({id:'rhythm:restock:'+DEFAULT_PROD,fam:'rhythm',sev:big?'watch':'note',conf:confDay,rm:null,tab:'inventory',
        title:big?`Buy about ${Math.abs(pct).toFixed(0)}% ${pct>0?'more':'less'} than the flat rate implies`
                 :'The next fortnight looks ordinary, so buy at the flat rate',
        why:`The flat run rate is ${kg(F.flat)} a day, which over fourteen days is ${kg(F.flatExpect)}. Weighting each of the next fourteen days by its own weekday and pay-window factor gives ${kg(F.expect)}, an index of ${F.index.toFixed(2)}${big?`, so ${kg(Math.abs(F.delta))} ${pct>0?'more':'less'} than the flat rate would have you hold`:'. That is inside the noise, so the flat rate is the better instruction'}. ${(function(){const inPay=F.days.filter(d=>d.pay).length;
          if(inPay===0)return `The whole window sits outside the pay window, and on this book the 8th to the 24th is the busier half, which is where the movement comes from.`;
          if(inPay===F.days.length)return `Every day of it sits inside the pay window, so the pay-window factor moves the whole fortnight in one direction.`;
          return `${inPay} of the fourteen days sit inside the pay window and ${F.days.length-inPay} outside, so the two halves partly cancel.`;})()} Both factors are shrunk towards no effect for sample size, and the holiday factor is pinned at 1.00 because nothing in this book measures one.`,
        ev:[`fourteen days from ${F.days[0].iso} to ${F.days[13].iso}`,
            `${F.days.filter(d=>d.pay).length} of them fall inside the pay window`,
            `${F.days.filter(d=>isWknd(new Date(d.iso))).length} are weekend days`,
            F.hols.length?`${F.hols.length} public holiday day${F.hols.length===1?'':'s'} in the window, not weighted`:'no public holiday in the window']});
    }
  }

  /* ---------- INTEGRITY ---------- */
  /* NEAR-DUPLICATES. Same party, same money, same quantity, within three days of each
     other. This is the rule that would have caught the 05 August CN6-WM entry before it was
     ever queued, which is the case that put this tab on the desk. */
  const seen={};
  sales.forEach((s,i)=>{
    if(!s.date||s.cancelled)return;
    sales.forEach((t,j)=>{
      if(j<=i||!t.date||t.cancelled)return;
      if(s.customer!==t.customer||prodOf(s)!==prodOf(t))return;
      if(Math.abs((+s.total||0)-(+t.total||0))>0.009)return;
      if(Math.abs((+s.qty||0)-(+t.qty||0))>0.009)return;
      const gap=Math.abs((new Date(t.date)-new Date(s.date))/86400000);
      if(gap>3||!(+s.total>0))return;
      const key='dup:'+s.customer+':'+s.date+':'+t.date+':'+s.total;
      if(seen[key])return;seen[key]=1;
      /* HOW HARD TO SHOUT. A pair the book already tells apart, by different settlement
         dates, different cash or a trail on one and not the other, is very probably two
         real orders from a customer with a habit: that is what a regular looks like. A pair
         the book CANNOT tell apart is the dangerous one, because it is exactly what a
         re-entry looks like, and it is the shape the 05 August CN6-WM entry had. So the pair
         is still raised either way, and only the volume changes. Crying wolf on every loyal
         customer would get the whole rule ignored, which costs more than the rule earns. */
      const tell=[];
      if((s.deliveredOn||null)!==(t.deliveredOn||null))tell.push('different delivery dates');
      if((s.paidOn||null)!==(t.paidOn||null))tell.push('different payment dates');
      if((s.amend||[]).length!==(t.amend||[]).length)tell.push('a trail on one and not the other');
      if(Math.abs((+s.cash||0)-(+t.cash||0))>0.009)tell.push('different cash received');
      const twin=!tell.length;
      add({id:key,fam:'integrity',sev:twin?'act':'note',conf:'measured',rm:+s.total,tab:'ledger',
        title:twin
          ? `${ID(s.customer)} carries the same order twice and nothing tells them apart`
          : `${ID(s.customer)} bought the same thing twice in ${gap} day${gap===1?'':'s'}`,
        why:twin
          ? `${s.date} and ${t.date} both book ${kg(+s.qty)} for ${fmt0(+s.total)} to the same party, with identical settlement on both. Either the second is real and something on it should say so, or one is the other re-entered. Booking a duplicate counts the money twice, takes salt off a shelf it never left, and can push a reseller across a rebate step nobody earned. Nothing is assumed either way: check it and say which.`
          : `${s.date} and ${t.date} both book ${kg(+s.qty)} for ${fmt0(+s.total)}, but the book already separates them by ${tell.join(', ')}. That is what a regular customer with a fixed order looks like rather than a double entry, so this is raised for completeness and not as a fault. Dismiss it and it stays dismissed.`,
        ev:[`${s.date}: ${kg(+s.qty)}, ${fmt0(+s.total)}, ${(+s.cash||0)>0?fmt0(+s.cash)+' cash':'no cash recorded'}${s.deliveredOn?', out '+s.deliveredOn:''}`,
            `${t.date}: ${kg(+t.qty)}, ${fmt0(+t.total)}, ${(+t.cash||0)>0?fmt0(+t.cash)+' cash':'no cash recorded'}${t.deliveredOn?', out '+t.deliveredOn:''}`,
            twin?'nothing on either row distinguishes it from the other':`told apart by ${tell.join(', ')}`]});
    });
  });
  /* A PRICED SALE WITH NO COST OF ITS OWN falls back to the weighted average, which
     back-dates today's cheap salt onto an old order and quietly flatters its margin. */
  const nocost=sales.filter(s=>s.cost==null&&(+s.total>0.0001)&&(+s.qty>0.0001)&&!s.cancelled);
  if(nocost.length){
    const w=nocost.reduce((a,s)=>a+(+s.qty||0),0);
    add({id:'int:nocost',fam:'integrity',sev:'watch',conf:'measured',rm:null,tab:'ledger',
      title:`${nocost.length} priced ${nocost.length===1?'sale carries':'sales carry'} no cost of its own`,
      why:`Each falls back to the weighted average, which is today's blend rather than what that salt actually cost. On a book whose buying rate has moved from RM64 to RM47 that flatters an old order and understates a new one. ${nocost.length===1?`It covers ${kg(w)}.`:`Between them they cover ${kg(w)}.`} Queue lots in receipt order and consume them in delivery order, then state the cost on the row.`,
      ev:nocost.slice(0,6).map(s=>`${s.date||'not dated'} ${ID(s.customer)}: ${kg(+s.qty)} for ${fmt0(+s.total)}`)});
  }
  /* SALT OUT WITH NO DATE ON IT. txDates falls back to the order date and marks it
     assumed; enough of those and the reconstructed shelf goes negative, which reads as a
     stockout and is really a dating fault. */
  /* THE TEST IS NOT "HAS A DATE", IT IS "COULD THE ASSUMED DATE BE WRONG". A row paid in
     full in cash with no trail is a walk-in: the order date IS the delivery date and the
     assumption costs nothing. Flagging those too put twenty-two rows on this tab, almost
     all of them from the first fortnight and every one of them harmless, which is how a
     rule teaches you to skip it. What is left is rows where the book ITSELF says the day
     was not clean: money that arrived later, or salt handed over against no cash at all. */
  const undated=sales.filter(s=>{
    if(!(+s.deliveredQty>0.0001)||s.deliveredOn)return false;
    if((s.amend||[]).some(a=>a.kind==='Fulfilment'))return false;
    const settled=(+s.cash||0)+(+s.settledRM||0);
    const lateMoney=s.paidOn&&s.paidOn!==s.date;
    const shortMoney=settled<(+s.total||0)-0.009;
    return !!(lateMoney||shortMoney);
  });
  if(undated.length){
    add({id:'int:undated',fam:'integrity',sev:undated.length>=4?'watch':'note',conf:'measured',rm:null,tab:'ledger',
      title:`${undated.length} ${undated.length===1?'delivery is':'deliveries are'} dated by assumption on a day that was not clean`,
      why:`Salt went out and the money did not follow on the same day, yet no delivery date is recorded, so txDates falls back to the order date and marks it assumed. That is the case where the assumption can actually be wrong. It matters because the shelf walk consumes lots in delivery order: a wrong date consumes the wrong lot, mis-costs the sale, and can drive the reconstructed shelf below zero, which then reads as a stockout when it is a dating fault. Rows paid in full on the day are excluded, because there the assumption cannot be wrong.`,
      ev:undated.slice(0,8).map(s=>{const settled=(+s.cash||0)+(+s.settledRM||0);
        return `${s.date} ${ID(s.customer)}: ${kg(+s.deliveredQty)} out, ${settled<(+s.total||0)-0.009?`only ${fmt0(settled)} of ${fmt0(+s.total)} received`:`paid ${esc(s.paidOn)}`}`;})});
  }
  /* PENDING GOING STALE. Pending counts nowhere, which is right, and is exactly why it can
     sit unnoticed for weeks. */
  const pend=sales.filter(s=>!s.cancelled&&(+s.total>0)&&!(+s.deliveredQty>0.0001)&&!(+s.cash>0.0001)&&!(+s.settledRM>0.0001));
  const stale=pend.filter(s=>s.date&&dbet(s.date)>=7);
  if(stale.length){
    const rm=stale.reduce((a,s)=>a+(+s.total||0),0), q=stale.reduce((a,s)=>a+(+s.qty||0),0);
    add({id:'int:stalepend',fam:'integrity',sev:'watch',conf:'measured',rm:rm,tab:'receivables',
      title:`${stale.length} pending ${stale.length===1?'order has':'orders have'} sat a week or more`,
      why:`${kg(q)} worth ${fmt0(rm)} agreed with nothing moved either way. Pending counts nowhere by design, so it costs nothing on the books and everything in attention: the salt is not reserved, the money is not owed, and the customer may well think it is settled. Convert it or close it.`,
      ev:stale.map(s=>`${s.date} ${ID(s.customer)}: ${kg(+s.qty)} for ${fmt0(+s.total)}, ${dbet(s.date)} days`)});
  }
  /* A SINGLE-STEP TRAIL DATED ON THE ORDER DATE restates the row it belongs to, so the
     ledger card draws Opened, then a movement identical to the opening, then Closed. The
     rule is deliberately narrow: only a trail whose WHOLE length is one step qualifies. */
  const foldable=sales.filter(s=>(s.amend||[]).length===1&&s.amend[0].date===s.date);
  if(foldable.length){
    add({id:'int:samedaytrail',fam:'integrity',sev:'note',conf:'measured',rm:null,tab:'ledger',
      title:`${foldable.length} ${foldable.length===1?'order draws':'orders draw'} a movement identical to its own opening`,
      why:`The whole trail is one step dated on the order date, so it restates the canonical row rather than recording a change. The card reads Opened, then a movement that moves nothing new, then Closed. State deliveredOn and paidOn on the row and delete the trail. This applies ONLY where the entire trail is one step: stripping the first step of a multi-step trail would understate every later state by whatever the opening moved, because replayAmend starts from zero and accumulates.`,
      ev:foldable.slice(0,6).map(s=>`${s.date} ${ID(s.customer)}: single ${esc(s.amend[0].kind||'step')} step on the order date`)});
  }
  /* A RECORDED SALE UNDER ITS OWN BAND FLOOR. The cards are policy and may sit under floor
     deliberately; a booked sale under floor is a different thing and is always worth a look. */
  const C=pxCost(), eff=(C&&C.effEx!=null)?C.effEx:(C?C.eff:null);
  if(eff!=null&&isFinite(eff)){
    const breach=D.filter(s=>{
      const q=+s.qty||0,tot=+s.total||0; if(!(q>0)||!(tot>0))return false;
      const fp=floorPct(q); const need=(eff*q)/(1-fp/100);
      return tot<need-0.009&&dbet(s.date)<=45;
    }).sort((a,b)=>a.date<b.date?1:-1);
    if(breach.length){
      const worst=breach.slice(0,5);
      add({id:'int:underfloor',fam:'integrity',sev:'watch',conf:'measured',rm:null,tab:'pricing',
        title:`${breach.length} recent ${breach.length===1?'sale sits':'sales sit'} under the band floor at today's cost`,
        why:`Measured against an effective cost of ${fmt(eff)} a unit and the band floor that applies at each size. These were priced when cost was lower, so this is cost catching up with a price rather than a mistake at the time. It matters because it is what those same customers will expect to pay next.`,
        /* v280: the floor is one markup on the lot cost now, so this reads it from the same
           function the ladder does rather than rebuilding the old band formula. */
        ev:worst.map(s=>{const q=+s.qty||0,need=floorTotal(q);
          return `${s.date} ${ID(s.customer)}: ${kg(q)} for ${fmt0(+s.total)}, floor ${fmt0(need)}, short ${fmt0(need-(+s.total))}`;})});
    }
  }

  /* ---------- CUSTOMERS ---------- */
  /* PAST THEIR OWN CADENCE, not past a number somebody picked. A customer who buys weekly
     and a customer who buys monthly are both silent at three weeks and only one of them
     has gone quiet. */
  const late=[];
  cust.forEach(c=>{
    const rows=D.filter(s=>s.customer===c).sort((a,b)=>a.date<b.date?-1:1);
    if(rows.length<3)return;
    const gaps=[];for(let i=1;i<rows.length;i++)gaps.push((new Date(rows[i].date)-new Date(rows[i-1].date))/86400000);
    gaps.sort((a,b)=>a-b);
    const med=gaps.length%2?gaps[(gaps.length-1)/2]:(gaps[gaps.length/2-1]+gaps[gaps.length/2])/2;
    if(!(med>0))return;
    const since=dbet(rows[rows.length-1].date);
    if(since>med*1.5&&since>=7){
      const avg=obsDiv(rows.reduce((a,r)=>a+(+r.total||0),0),rows.length)||0;
      /* HOW LONG THE RHYTHM ITSELF TOOK TO SET. Three orders inside one week give a median
         gap of three days, and dividing a 38-day silence by that produces "15.2 times his
         own rhythm", which is arithmetically true and reads as nonsense. The span is
         carried so the card can say plainly that the rhythm came out of a short burst. */
      const span=(new Date(rows[rows.length-1].date)-new Date(rows[0].date))/86400000;
      late.push({c:c,med:med,since:since,avg:avg,n:rows.length,span:span,
                 burst:span<14,over:+(since/med).toFixed(1)});
    }
  });
  if(late.length){
    late.sort((a,b)=>b.avg*b.over-a.avg*a.over);
    const rm=late.reduce((a,x)=>a+x.avg,0);
    add({id:'cust:cadence',fam:'customer',sev:'watch',conf:'measured',rm:rm,tab:'concentration',
      title:`${late.length} settled ${late.length===1?'customer is':'customers are'} past their own rhythm`,
      why:`Each has bought at least three times, so the gap is theirs rather than a number picked for everybody. ${ID(late[0].c)} is furthest out: silent ${late[0].since} days against a ${late[0].med.toFixed(0)}-day rhythm${late[0].burst?`, though that rhythm was cut from ${late[0].n} orders inside ${late[0].span.toFixed(0)} days, so it is the pace of one burst rather than a settled habit and the multiple it implies means very little`:''}. Worth about ${fmt0(rm)} if each reorders at his usual size, which is the only claim being made: it is what they have paid before, not a forecast that they will.`,
      ev:late.slice(0,8).map(x=>`${ID(x.c)}: ${x.n} orders over ${x.span.toFixed(0)} days, ${x.med.toFixed(0)}-day rhythm${x.burst?' (one burst)':''}, silent ${x.since} days, usually ${fmt0(x.avg)}`)});
  }
  /* ONE AND DONE. The single most expensive pattern a young book can have and the one it
     is least likely to notice, because every first order looks like a success. */
  const once=cust.filter(c=>D.filter(s=>s.customer===c).length===1);
  if(cust.length>=8&&once.length){
    const share=obsPct(once.length,cust.length);
    add({id:'cust:oneanddone',fam:'customer',sev:share>=50?'watch':'note',conf:'measured',rm:null,tab:'concentration',
      title:`${once.length} of ${cust.length} customers have bought exactly once`,
      why:`${share}% of every name on the book. A first order costs the most to win and earns the least, so a book that does not convert first orders into second ones is paying acquisition over and over for the same revenue. This is a rate rather than a list of failures: some of these are simply recent.`,
      ev:[`${once.length} single-order names against ${cust.length-once.length} repeat`,
          `of the single-order names, ${once.filter(c=>dbet(D.filter(s=>s.customer===c)[0].date)<=14).length} bought within the last fortnight and may simply not be due yet`,
          `worth ${fmt0(once.reduce((a,c)=>a+(+D.filter(s=>s.customer===c)[0].total||0),0))} in total first orders`]});
  }
  /* CONTACTED AND NO REPLY. A follow-up that got no answer is a different state from one
     that was never made, and the difference decides whether to chase or to let it go. */
  const noreply=(typeof contacts!=='undefined'?contacts:[]).filter(k=>k.outcome==='noreply'&&k.date&&dbet(k.date)>=3);
  if(noreply.length){
    add({id:'cust:noreply',fam:'customer',sev:'note',conf:'measured',rm:null,tab:'concentration',
      title:`${noreply.length} follow-${noreply.length===1?'up has':'ups have'} gone unanswered`,
      why:`The silence is theirs rather than yours, which is worth knowing before spending another message on it. A second approach to a name that did not answer the first is usually worth less than a first approach to a name nobody has tried.`,
      ev:noreply.map(k=>`${ID(k.party)}: ${esc(k.how||'contact')} on ${k.date}, ${dbet(k.date)} days, no reply`)});
  }

  /* ---------- PRICING ---------- */
  try{
    const H=boardHeadroom(false);
    if(H&&H.live>0){
      const pct=H.pct==null?null:H.pct;
      const urgent=!H.unbounded&&pct!=null&&pct<10;
      add({id:'px:headroom:'+PROD,fam:'pricing',sev:urgent?'act':(pct!=null&&pct<20?'watch':'note'),conf:'measured',rm:null,tab:'pricing',
        title:H.unbounded?'The board clears its floors at any buying rate the walk tried'
             :(H.headroom===0?'The board has no headroom left at all'
             :`The buying rate can rise ${fmt(H.headroom)} a unit, ${pct}%, before a card breaches`),
        why:H.unbounded
          ? 'Walking the replacement rate up two hundred ringgit found no tier going under its own floor, so nothing on the printed board is close to breaching.'
          : `The cards are frozen numbers and the floors move with cost, so every ringgit on the buying rate eats headroom that never comes back until the cards are redrawn. At ${fmt(H.firstAt)} a unit ${esc(H.firstTier)} goes under floor first${H.hits&&H.hits.length?`, worst at ${kg(H.hits[H.hits.length-1].q)} by ${fmt(H.hits[H.hits.length-1].shortBy)}`:''}. ${urgent?'Under a tenth of the live rate this is the week’s most urgent pricing fact.':''} Headroom also falls when the leak worsens or delivery rises, not only when the supplier moves.`,
        ev:[`live replacement rate ${fmt(H.live)} a unit`,
            H.unbounded?'no breach found up to two hundred ringgit above the live rate':`safe to ${fmt(H.safeTo)}, first breach at ${fmt(H.firstAt)}`,
            H.hits&&H.hits.length?`${H.hits.length} tier price${H.hits.length===1?'':'s'} would breach at that rate`:'nothing breaches']});
    }
  }catch(e){}
  /* CARDS ALREADY UNDER FLOOR TODAY. Reported, never clamped: a tier may sit under floor
     as policy, and a desk that hid that would be lying to itself. */
  try{
    const B=tierBoard(), under=[];
    B.forEach(row=>row.cells.forEach(cl=>{if(cl&&cl.p!=null&&cl.underFloor)under.push({code:cl.code,q:row.q,p:cl.p,short:(cl.floor!=null?cl.floor:row.floor)-cl.p});}));
    if(under.length){
      const worst=under.slice().sort((a,b)=>b.short-a.short)[0];
      add({id:'px:underfloor:'+PROD,fam:'pricing',sev:'watch',conf:'measured',rm:null,tab:'pricing',
        title:`${under.length} printed card ${under.length===1?'price sits':'prices sit'} under its own floor`,
        why:`Worst is ${esc(worst.code)} at ${kg(worst.q)}, ${fmt0(worst.p)} against a floor of ${fmt0(worst.p+worst.short)}, short by ${fmt(worst.short)}. The engine reports and does not clamp, which is deliberate: a tier may sit under floor as a standing concession, and the desk shows it rather than quietly repricing. Decide each one, then either lift the card or record the concession.`,
        ev:under.slice(0,8).map(u=>`${esc(u.code)} at ${kg(u.q)}: ${fmt0(u.p)}, short ${fmt(u.short)}`)});
    }
  }catch(e){}

  /* ---------- WORTH DOING ---------- */
  /* THE PROMOTION WINDOW FALLS OUT OF THE RHYTHM rather than being chosen. If a window
     is measurably busier, that is when a promotion buys the least; the quiet window is
     where the same discount does the most work. */
  if(!R.empty&&F){
    const promoConf=(R.all.orders>=40&&Math.min.apply(null,R.byDow.map(b=>b.days))>=12)?'measured':'thin';
    const quiet=F.days.slice().sort((a,b)=>a.f-b.f)[0], busy=F.days.slice().sort((a,b)=>b.f-a.f)[0];
    const spread=obsDiv(busy.f,quiet.f);
    if(spread!=null&&spread>1.15){
      add({id:'promo:window:'+DEFAULT_PROD,fam:'promo',sev:'note',conf:promoConf,rm:null,tab:'pricing',
        title:`If you run one promotion this fortnight, run it on ${DOW[quiet.dow]} ${quiet.iso}`,
        why:`The forward window's quietest day carries a factor of ${quiet.f.toFixed(2)} against ${busy.f.toFixed(2)} on ${DOW[busy.dow]}, a spread of ${spread.toFixed(2)} to 1. A discount on the busy day mostly discounts sales you were going to make; the same discount on the quiet day is buying volume that is not there. Both factors are already shrunk for a thin sample, so treat the direction as the finding and the size as indicative.`,
        ev:[`quietest ${quiet.iso} ${DOW3[quiet.dow]}, factor ${quiet.f.toFixed(2)}`,
            `busiest ${busy.iso} ${DOW3[busy.dow]}, factor ${busy.f.toFixed(2)}`,
            `the board's own floors still apply: a promotion under floor is a loss with a name on it`]});
    }
  }
  /* REVIVING THE QUIET NAMES, sized at what they have actually paid. */
  if(late.length>=2){
    const top=late.slice(0,3), rm=top.reduce((a,x)=>a+x.avg,0);
    add({id:'promo:revive',fam:'promo',sev:'note',conf:'measured',rm:rm,tab:'concentration',
      title:`Three messages are worth about ${fmt0(rm)} at their own usual sizes`,
      why:`${top.map(x=>ID(x.c)).join(', ')} are the three furthest past their own rhythm weighted by what they usually spend. Nothing here needs a discount: they are lapsed rather than lost, they bought at a price they accepted, and the cost of asking is one message each.`,
      ev:top.map(x=>`${ID(x.c)}: silent ${x.since} days on a ${x.med.toFixed(0)}-day rhythm, usually ${fmt0(x.avg)}`)});
  }

  /* ---------- UPKEEP ---------- */
  /* THE PLUG. The count always wins, so this figure never moves a number; it is the size
     of what nobody has explained. */
  if(typeof SHRINK!=='undefined'&&C&&C.shrink!=null&&isFinite(C.shrink)){
    const p=+(C.shrink*100).toFixed(1);
    add({id:'upkeep:shrink:'+PROD,fam:'upkeep',sev:p>=12?'act':(p>=8?'watch':'note'),conf:'measured',rm:null,tab:'inventory',
      title:`The unexplained plug runs at ${p}% of everything handled`,
      why:`Against an expected ${SHRINK.expectedPct}% and a settled ${((SHRINK.levels||[]).filter(l=>l.key==='settled')[0]||{}).pct||5}%. It is a single number with nothing behind it: nobody knows how much is personal use, how much is spillage and how much is short delivery, and the three have entirely different fixes. It also feeds effective cost, so it is quietly setting every floor on the board. Recording what you know as it happens splits it without moving a figure, because the count still wins.`,
      ev:[`observed ${p}%, expected ${SHRINK.expectedPct}%`,
          'a large purchase makes this ratio fall while nothing less is lost, because the denominator is everything handled',
          'effective cost is the replacement rate divided by one minus the attributed share, so this number is inside every floor']});
  }
  /* THE COST LOCK. A locked rate is a decision with a shelf life. */
  if(C&&C.locked&&C.lockAge!=null&&C.lockAge>=3){
    add({id:'upkeep:costlock:'+PROD,fam:'upkeep',sev:C.lockAge>=10?'watch':'note',conf:'measured',rm:null,tab:'pricing',
      title:`The replacement rate has been locked for ${C.lockAge} days`,
      why:`Locked at ${fmt(C.repl)} a unit on ${esc(C.lockedOn)}. A lock is right while a quote is live and wrong once it is stale, because every floor on the board is computed from it. If the supplier has moved since, every floor is being read off a rate that no longer exists.`,
      ev:[`locked ${esc(C.lockedOn)} at ${fmt(C.repl)} a unit`,`landed ${fmt(C.landed)} after freight`,`effective ${fmt(C.eff)} once the plug is attributed`]});
  }
  /* THE SHELF ROLL AGAINST THE LATEST LOT. */
  try{
    const lots=pPurch(DEFAULT_PROD).filter(p=>poLive(p)&&poRecvKg(p)>0.0001)
                 .sort((a,b)=>(a.receivedOn||a.date)<(b.receivedOn||b.date)?-1:1);
    const last=lots[lots.length-1];
    if(last&&typeof STOCK_COST!=='undefined'&&STOCK_COST!=null){
      const rate=obsDiv(+last.total,+last.qty);
      if(rate!=null&&Math.abs(rate-STOCK_COST)>0.005){
        add({id:'upkeep:stockcost:'+PROD,fam:'upkeep',sev:'note',conf:'measured',rm:null,tab:'inventory',
          title:`The shelf is carried at ${fmt(STOCK_COST)} while the latest lot cost ${fmt(rate)}`,
          why:`Both can be right: the roll is the blend of the lots actually sitting there, and where an older remnant survives underneath a new lot the blend is above the newest rate. It is worth a look only because the Inventory tile labels the roll "latest lot", which is loose wording for a blend. If the remnant is now entirely from the newest lot, the roll should come down to it.`,
          ev:[`shelf roll ${fmt(STOCK_COST)} a unit`,`newest received lot ${esc(last.receivedOn||last.date)} at ${fmt(rate)} a unit`,`${lots.length} lots in the basis`]});
      }
    }
  }catch(e){}
  /* A PLAN THAT HAS SLIPPED is still an observation, even though it was typed rather than
     derived: it is the one place the two halves of this tab meet. */
  try{
    planList().filter(p=>p.due&&p.status!=='done'&&p.status!=='dropped'&&dbet(p.due)>0).forEach(p=>{
      add({id:'upkeep:plan:'+p.id,fam:'upkeep',sev:'watch',conf:'measured',rm:null,tab:'plans',
        title:`Plan ${esc(p.id)} is ${dbet(p.due)} days overdue`,
        why:esc(p.title),ev:[`due ${esc(p.due)}`,`added ${esc(p.added)}`]});
    });
  }catch(e){}

  /* ---------- PARITY: THE DESK TESTING ITS OWN PRODUCT SPLIT ---------- */
  try{
    const PS=parityScan();
    PS.rows.forEach(r=>{
      const sev=(r.k==='commit'||r.k==='empty'||r.k==='form')?'act':(r.k==='uncounted'?'watch':'note');
      add({id:'parity:'+r.k+':'+(r.pr||'all'),fam:'upkeep',sev:sev,conf:'measured',rm:null,tab:r.k==='form'?'add':'inventory',
        title:r.what,
        why:r.why+' The desk checks this itself on every load rather than waiting to be read: the product split at v228 wrapped six tabs and left roughly forty reads behind them looking at both books, and nothing noticed for forty-seven versions.',
        ev:PROD_IDS.map(pr=>{const d=PS.per[pr]||{};
          return `${esc(PRODUCTS[pr].name)}: ${d.sold||0} orders, ${d.bought||0} lots, shelf ${d.stock==null?'unknown':kg(d.stock)}${d.counted?' (counted)':' (ledger, uncounted)'}, promised out ${d.fc?kg(d.fc.commit):'n/a'}`;})});
    });
  }catch(e){}

  /* rank: severity first, then money, then family, so the top of the tab is always the
     thing that costs the most to ignore */
  O.forEach(o=>{o.st=obsState(o.id);});
  const live=O.filter(o=>!o.st), hushed=O.filter(o=>o.st);
  live.sort((a,b)=>(OBS_SEV[a.sev].r-OBS_SEV[b.sev].r)||((b.rm||0)-(a.rm||0))||(a.fam<b.fam?-1:1));
  return {live:live,hushed:hushed,all:O,R:R,F:F};
}

/* ============ RENDERING AND THE HUSH CONTROLS ============ */
function obsCard(o){
  const S=OBS_SEV[o.sev]||OBS_SEV.note, K=OBS_CONF[o.conf]||OBS_CONF.measured;
  const hushed=!!o.st;
  return `<details class="obs${hushed?' obshush':''}" style="--sev:${S.c}"${o.sev==='act'&&!hushed?' open':''}>
    <summary>
      <span class="obsk">${S.lbl}</span>
      <span class="obst">${o.title}</span>
      <span class="obsm${(o.rm>0.009)?'':' nil'}">${(o.rm>0.009)?fmt0(o.rm):'&mdash;'}</span>
      <span class="obsc" title="${esc(K.t)}">${K.lbl}</span>
    </summary>
    <div class="obsb">
      <p style="margin:0 0 9px">${o.why}</p>
      ${(o.ev&&o.ev.length)?`<div class="obsev"><div class="obsevh">What it stands on</div><ul>${o.ev.map(e=>`<li>${e}</li>`).join('')}</ul></div>`:''}
      <div class="obsact">
        <button class="navlink" onclick="switchTab('${o.tab}')">${TAB_LABEL[o.tab]||o.tab} &rarr;</button>
        ${hushed
          ? `<span class="dsc">${o.st.act==='snooze'?`Snoozed to <b>${esc(o.st.until||'')}</b>`:'Dismissed'}${o.st.why?`: ${esc(o.st.why)}`:''}${o.st._q?' &middot; <span class="attn">queued, not yet filed</span>':''}</span>
             <button class="obsbtn" onclick="obsAct('${esc(o.id)}','restore')">Bring back</button>`
          : `<button class="obsbtn" onclick="obsAct('${esc(o.id)}','snooze7')">Snooze 7 days</button>
             <button class="obsbtn" onclick="obsAct('${esc(o.id)}','snooze30')">Snooze 30</button>
             <button class="obsbtn" onclick="obsAct('${esc(o.id)}','dismiss')">Dismiss</button>`}
      </div>
    </div>
  </details>`;
}

/* HUSHING RIDES THE QUEUE, so it reaches me on the next run and survives a browser clear.
   It writes nothing but its own record: applyOverlay reads mode and returns on anything it
   does not recognise, so an 'obs' entry cannot touch a figure even by accident. */
function obsAct(id,what){
  const until=what==='snooze7'?obsISO(obsDay(7)):what==='snooze30'?obsISO(obsDay(30)):null;
  const act=what==='restore'?'restore':(what==='dismiss'?'dismiss':'snooze');
  queue.push({at:new Date().toISOString(),type:'OBS',party:'whiteboard',qty:null,total:null,status:'obs',
    raw:(act==='restore'?'Bring back observation ':act==='dismiss'?'Dismiss observation ':'Snooze observation ')+id+(until?' to '+until:''),
    payload:{mode:'obs',id:id,act:act,until:until,why:''}});
  render();
  Promise.resolve(saveQueue());
}

function tabPlans(){
  const X=observations(), R=X.R, F=X.F;
  const live=X.live, hushed=X.hushed;
  const acts=live.filter(o=>o.sev==='act').length;
  const watch=live.filter(o=>o.sev==='watch').length;
  const stake=live.reduce((a,o)=>a+(o.rm>0.009?o.rm:0),0);
  const fam=k=>{const L=live.filter(o=>o.fam===k);if(!L.length)return '';
    return `<details class="obsec"${L.some(o=>o.sev==='act')?' open':''}>

/* ============ NAME VAULT — client-side AES-GCM, passphrase never leaves browser ============ */
const _b64e=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));
const _b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
/* v277: THE ITERATION COUNT TRAVELS WITH THE ENVELOPE. It was hardcoded at 150,000 in both
   the desk and tools/seed-vault.mjs, so raising it would have stranded every blob already
   sealed at the old count. Reading it from the envelope means the cost can be raised for new
   seeds whenever it is worth doing, and old blobs keep opening. Absent means 150,000, which
   is every blob sealed before today. */
const KDF_DEFAULT_ITER=150000;
async function _deriveKey(pass,salt,iter){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:(+iter>0?+iter:KDF_DEFAULT_ITER),hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function vaultEncrypt(pass,mapObj){
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const key=await _deriveKey(pass,salt);
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(mapObj)));
  return {v:1,salt:_b64e(salt),iv:_b64e(iv),ct:_b64e(ct)};
}
async function vaultDecrypt(pass,blob){
  const key=await _deriveKey(pass,_b64d(blob.salt),blob.it);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:_b64d(blob.iv)},key,_b64d(blob.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

  const em=t.match(/[\w.+-]+@[\w-]+\.[\w.]+/);                 if(em)out.email=em[0];

function queueRename(from,to){
  if(!from||!to||from===to)return;
  if(roster.indexOf(to)>=0){alert('The code '+to+' already belongs to another party. Rename that one first, or change the name so it implies a free code.');return;}
  if(queue.some(q=>q.type==='RENAME'&&q.payload&&q.payload.from===from)){alert(from+' is already queued for renaming.');return;}
  queue.push({at:new Date().toISOString(),type:'RENAME',party:from,qty:null,total:null,status:'rename',
    raw:'Rename '+from+' to '+to+' everywhere, purging '+from+' outright',
    payload:{mode:'rename',from:from,to:to}});
  try{saveQueue();renderQueue();}catch(e){}
  alert('Queued: '+from+' becomes '+to+'.\n\nIt is applied to every transaction on the next run, and '+from+' is purged outright. Nothing changes on screen until then, so the ledger and the code never disagree in the meantime.');
}

  try{loadAdded();}catch(e){}

  roster.forEach(id=>{code[id]=id;const d=dc[id];if(d&&d!==id)diff.push({from:id,to:d});});
  Object.keys(dc).forEach(id=>{if(!(id in code))code[id]=dc[id];});
  newIds=code; newLocs=gg.locs||{};
  try{localStorage.setItem('saltNewIds',JSON.stringify(newIds));
      localStorage.setItem('saltNewLocs',JSON.stringify(newLocs));}catch(e){}
  return diff;
}

/* ============ ONE BASIS, AND ONLY ONE (v248) ============
   His instruction: a single dynamic pricing basis, and no other quote anywhere on the desk.

   surfaces: the revive cards, the reseller table, the cover analysis, the earnings chart,
   the 12.5 commentary and the floor column. The board said RM95 for a unit to Tier I
   and this said RM130. Every rule added since v245, the ringgit floor, the cover guard, the
   strict ordering, bound one of the two and not the other.
   IT IS NOW A THIN WRAPPER ON THE BOARD and computes no price of its own. On a carded size
   it returns the board cell; off the board it calls enginePrice, which is the SAME engine
   that built the board, under the same floors and the same laws. Nothing else is left that
   can invent a number.

   not have to be rewritten to prove it. The signal engine was found dead at v241, computing

function pxQuote(q,sigNet,partyNet,tierCode){

    tgt:(anchor-c.eff)/anchor*100,

    band:sizeBand(q),tier:code,atFloor:total<=walkTotal+0.009};

   half. Ringgit per unit is the figure that decides which trade is worth doing, because
   a unit is the thing in short supply on this desk, not a customer.
   Two costs are reported and they answer different questions. LOT COST is what the salt

/* ============ FORWARD ENGINE (v147) ============
   Every other figure on this desk is AS AT today. This is the only one that looks
   forward, and it is deliberately built out of things already on the book rather than
   out of a forecast: committed units, the observed shipping rate, the desk's own credit
   term, and the provisioning ladder. There is NO demand model here and no seasonality.
   Three dating rules, each taken from a rule the desk already applies:
     - deferred and agreed units are owed NOW, so they sit on day 0
     - a receivable is expected at RULES.creditDays from its order date, floored at today,
       and valued NET of provisioning, because that is the desk's own realistic figure
     - an unpaid supplier bill and a refund owed are both due now
   Two stock lines are drawn, never one. COMMITTED answers "can I cover what I have
   already promised", which needs no forecast at all. COMMITTED PLUS RATE adds the

   apart because the second is an estimate and the first is not. */

function forecast(o){

  /* --- what you owe out, all of it now --- */
  /* v275: SCOPED, ALL FOUR READS. They were whole-book while everything they are compared
     against (currentStock, commitKg, shortKg, the day walk) is the ACTIVE product's, so

     against oil's shelf. Identical fault to the order book at v272, on units not money. */
  const defRows=pSales(PROD).filter(s=>txDeferKg(s)>0.009)
    .map(s=>({id:s.customer,kg:+txDeferKg(s).toFixed(2),rm:0,why:'paid ahead of delivery'}));
  const pendRows=pSales(PROD).filter(s=>txPendKg(s)>0.009)
    .map(s=>({id:s.customer,kg:+txPendKg(s).toFixed(2),rm:txPendRM(s),why:'agreed, nothing moved'}));

  pPurch(PROD).forEach(p=>{if(p.pending)return;const b=+(p.total-poCash(p)).toFixed(2);

                    rm:+(+buy.qty*+buy.rate).toFixed(2),who:buy.who||supplierQuote.supplier,label:'the buy on this tab'});

    const title=short&&low?`Buy: ${kg(f.shortKg)} short on promises and ${kg(cv.shortBy)} under the trigger`
      :short?`Buy: ${kg(f.shortKg)} short of what you have already promised`
      :`Reorder: ${kg(cv.free)} free, ${cv.days==null?'no rate to read':cv.days+' days of cover'}`;
    const why=(short?`<b>${kg(f.commitKg)} is owed out</b> (${kg(f.owedKg)} paid ahead, ${kg(f.promKg)} agreed) against ${kg(currentStock)} on the shelf, so ${kg(f.unmet)} cannot be met. `
        +`${f.pendRows.map(r=>ID(r.id)+' '+kg(r.kg)).join(', ')}${f.defRows.length?'; deferred to '+f.defRows.map(r=>ID(r.id)+' '+kg(r.kg)).join(', '):''}. `:'')
      +(low?`The trigger is ${kg(cv.reorderAt)} and you are ${kg(cv.shortBy)} under it, shipping ${kg(cv.rate)} a day over the last fortnight. `:'')
      +`Refilling the larger gap costs about ${fmt0(refill)} at ${fmt(c.eff)}/unit effective.`
      +(f.cashKnown?` You hold ${fmt0(cashFlow().free)} free.`:'');
    add(sev,'buy',title,Math.max(refill,short?f.promRM:0),why,'sourcing');
  }
  /* 3. money out with other people, each at its own age and provision */
  arList.forEach(s=>{const g=outstandingOf(s),age=dbet(s.date),pr=provRate(age);
    if(g<=0.009)return;
    const sev=age>=RULES.fullProvDays?'now':age>=RULES.creditDays?'now':age>=RULES.creditDays-3?'soon':'watch';
    add(sev,'collect',`Chase ${ID(s.customer)} for ${fmt0(g)}`,g,
      `${age} days out against a ${RULES.creditDays}-day term, ${(pr*100).toFixed(0)}% provisioned, so ${fmt0(g*(1-pr))} is the realistic figure.`
      +(isBanned(s.customer)?' He is banned from sale; the ban ends the trade, not the debt.':''),'receivables');});
  if(typeof supplierReceivable!=='undefined'&&supplierReceivable&&supplierReceivable.status==='recoverable'){
    const age=dbet(supplierReceivable.since),pr=provRate(age);
    add(age>=RULES.fullProvDays?'now':'soon','collect',`Settle the ${ID(supplierReceivable.party)} default, ${fmt0(supplierReceivable.amount)}`,
      supplierReceivable.amount,
      `Paid ${age} days ago for a lot that never arrived, ${(pr*100).toFixed(0)}% provisioned, ${fmt0(supplierReceivable.amount*(1-pr))} net. `
      +`It is ${(supplierReceivable.amount/Math.max(1,grossMargin)*100).toFixed(0)}% of every ringgit of margin the desk has ever earned.`,'receivables');}
  /* 4. money you owe back */
  customerRefunds.filter(r=>!r.paidOn).forEach(r=>add('soon','pay',`Refund ${ID(r.party)} ${fmt0(r.amount)}`,r.amount,
    `Owed since ${r.since}, ${dbet(r.since)} days. ${esc(r.note||'')}`,'receivables'));
  /* 5. rules already broken, grouped by person. Four separate rows about one man is a
     list you stop reading; one row naming all four rules is a decision about him. */
  const br={};boundaryScan().filter(x=>x.sev==='breach').forEach(x=>{(br[x.who]=br[x.who]||[]).push(x);});
  Object.keys(br).forEach(who=>{const xs=br[who];
    /* v163: the REASONING behind each rule is set out in full in Boundaries on the Overview
       tab, and reprinting it here put four paragraphs about one man on the one tab meant to
       be read at a glance. It was the largest single source of repetition on the desk: every
       word of x.why, and most of x.what, appeared twice. So this row names the rules as
       chips and states his position ONCE, deduplicated, and the button goes to Boundaries
       for the argument. A tab you skim and a tab you study are different jobs. */
    const chips=xs.map(x=>`<span class="rchip">${esc(x.rule)}</span>`).join('');
    const pos=[...new Set(xs.map(x=>esc(x.what)))].join(' &middot; ');
    add('now','rule',`${ID(who)} breaks ${xs.length} rule${xs.length===1?'':'s'}`,0,
      `<div class="rchips">${chips}</div><div class="actp">${pos}</div>`,'overview');});
  /* 6. promises you made to people */
  contactsDue().forEach(cd=>add(dbet(cd.next)>0?'now':'soon','call',`Follow up ${ID(cd.party)}`,0,
    `Promised for ${cd.next}${dbet(cd.next)>0?`, ${dbet(cd.next)} days late`:', today'}. Last spoke ${cd.date}, ${CONTACT_OUT[cd.outcome]}.`,'concentration'));
  /* ============ 7. QUIET CUSTOMERS, AS ONE LINE (v257) ============
     This printed a card per name: five of them, each with a headline, a sentence of history,
     a quote, a value and a button, to say a thing that is one sentence long. Today is the tab
     that answers what to do now, and "five people are overdue" IS the answer; which five, by
     how much and at what quote is the next question and it already has a tab.
     AND IT NOW MEANS WHAT IT SAYS. The old test was a flat 21 days, which called a man who
     buys monthly quiet and let a weekly buyer go silent for a fortnight unremarked. Overdue is
     measured against a party's OWN median gap, so it is late by his habit rather than by the
     calendar. A party with one order has no habit and is not counted: the desk has always
     refused to hand him the book average and it is not starting here.
     OUT OF AREA IS COUNTED SEPARATELY AND NAMED, never silently dropped. */
  const quietAll=custStats().filter(x=>!isBanned(x.id)&&!isDeparted(x.id))
    .map(x=>{const cad=custCadence(x.id);
      return cad?Object.assign({},x,{med:cad.med,late:dbet(x.last)-cad.med}):null;})
    .filter(x=>x&&x.late>0);
  const farQ=quietAll.filter(x=>{const pl=placeOf(x.id);return !!pl&&!inMetro(pl);});
  const quiet=quietAll.filter(x=>farQ.indexOf(x)<0).sort((a,b)=>b.late-a.late);
  if(quiet.length){
    const worth=quiet.reduce((a,x)=>{const nb=nextBest(x.id);return a+(nb?nb.profit:0);},0);
    const worst=quiet[0];
    add('watch','reconnect',
      `${quiet.length} customer${quiet.length===1?' has':'s have'} not ordered within their own cadence`,
      worth,
      `Worth about ${fmt0(worth)} at today's board if each reorders at his usual size. The furthest behind is ${ID(worst.id)}, ${worst.late} day${worst.late===1?'':'s'} past his own ${worst.med}-day rhythm.`
      +(farQ.length?` ${farQ.length} more (${farQ.map(x=>ID(x.id)).join(', ')}) are out of area and not counted.`:''),
      'concentration');
  }
  /* 8. rewards already earned and not yet handed over */
  networkStats().forEach(r=>{const ap=rebateApplied(r.id);
    const free=+((r.earned||0)-ap).toFixed(2);
    if(free>0.009)add('soon','reward',`${ID(r.id)} has ${kg(free)} of reward waiting`,+(free*c.eff).toFixed(2),
      `Earned and not yet applied. Valued at ${fmt(c.eff)}/unit effective cost, which is what it costs you to honour it.`,'network');});
  /* 9. entries typed into the desk and not yet in the book */
  const qn=queue.filter(q=>!(q.payload&&q.payload.mode==='plan')).length;
  if(qn)add('soon','queue',`${qn} entr${qn===1?'y':'ies'} queued and not yet in the book`,0,
    'Typed into the Transaction tab and saved to the queue file. Until they are committed, no figure on this desk includes them.','add');
  /* 10. plans you committed to, past their own date */
  whiteboard.filter(p=>p.status==='committed'&&p.due&&dbet(p.due)>=0).forEach(p=>
    add(dbet(p.due)>0?'now':'soon','plan',`${p.id} is due: ${esc(p.title)}`,0,
      `Committed ${p.added}, due ${p.due}${dbet(p.due)>0?`, ${dbet(p.due)} days late`:', today'}.`,'plans'));

  return out.sort((a,b)=>ACTSEV[a.sev].r-ACTSEV[b.sev].r||b.rm-a.rm);
}

/* ---- what a customer would buy next, and what it is worth ----
   Cadence is observed, never assumed: the median gap between his own order dates. A
   customer with one order has no cadence and is said to have none rather than being
   given the desk average, which would invent a habit he has not shown. The suggested
   lot is the median size HE buys, quoted at today's board including his own overlay. */
function custCadence(id){
  const ds=[...new Set(pricedSales.filter(s=>s.customer===id&&!s.cancelled&&s.date).map(s=>s.date))].sort();
  if(ds.length<2)return null;
  const g=[];for(let i=1;i<ds.length;i++)g.push(Math.round((new Date(ds[i])-new Date(ds[i-1]))/86400000));
  const sorted=g.slice().sort((a,b)=>a-b);
  return {n:ds.length,med:sorted[Math.floor(sorted.length/2)],last:ds[ds.length-1],gaps:g};
}
function nextBest(id){
  const rows=pricedSales.filter(s=>s.customer===id&&!s.cancelled&&s.qty>0);
  if(!rows.length)return null;
  const qs=rows.map(s=>s.qty).sort((a,b)=>a-b);
  const q=qs[Math.floor(qs.length/2)];
  /* WHAT HE HAS PAID EXCLUDES FREE UNITS (v231). A rebate row is salt handed over at RM0;
     it is not evidence of a price anyone accepted. CN6-WM has taken three lots of which two
     were redeemed rebates, so the median rate read RM0 and the uplift against it came out
     as +Infinity on screen. Rebate and zero-value rows are dropped from the rate, and if
     nothing priced is left there is no rate to compare against and delta is null. */
  const paidRows=rows.filter(s=>!s.rebate&&s.total>0.009);
  const ps=paidRows.map(s=>s.total/s.qty).sort((a,b)=>a-b);
  const paid=ps.length?ps[Math.floor(ps.length/2)]:null;
  /* v248: THE CARD QUOTES THE BOARD. This read pxQuote, the ladder that predates the tier
     board, so the desk stated two different prices for the same lot: RM130 on a revive card
     against RM95 on the board at 1 unit, and RM1,010 against RM1,105 at 12.5. Every rule
     added since v245, the ringgit floor, the cover guard, the strict ordering, applied to
     one of the two and not the other. The board is the policy, so the board is the quote.
     pxQuote is kept for the floor figure, which the board does not carry. */
  const tr=custTier(id);
  const r=pxQuote(q,0,0,tr?tr.code:'T2');   // v248: the customer's own tier, off the one board
  const cad=custCadence(id),since=dbet(rows.map(s=>s.date).sort().slice(-1)[0]);
  return {q,paid:paid!=null?+paid.toFixed(2):null,total:r.total,perKg:r.perKg,profit:r.profit,margin:r.margin,
    walkTotal:r.walkTotal,cad,since,
    due:cad?since-cad.med:null,                     // positive means overdue by his own habit
    delta:(paid!=null&&paid>0.009)?+((r.perKg-paid)/paid*100).toFixed(0):null};
}
function renderQueue(){const b=document.getElementById('queueBox');if(!b)return;
  /* plans share the queue file but are NOT transactions and are folded into no
     figure, so they belong on the Whiteboard, never in this panel. */
  const txq=queue.filter(q=>!(q.payload&&q.payload.mode==='plan'));
  const cleared=queueCleared?`<div class="dsc" style="margin-top:10px">&#10003; ${queueCleared} committed entr${queueCleared===1?'y':'ies'} cleared automatically &mdash; already in the ledger.</div>`:'';
  if(!txq.length){b.innerHTML=cleared;return;}
  b.innerHTML=cleared;b.innerHTML+='<div style="margin-top:12px;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--gold)">Live in the desk, awaiting commit ('+txq.length+')— '+qLabel()+'</div>'
    +'<div class="dsc" style="margin-top:5px">These are already folded into every figure on the desk. Undo removes an entry and rebuilds; once committed it is in the ledger and can only be reversed by a new entry.</div>'
    +'<table style="margin-top:6px"><thead><tr><th class="l">Entry</th><th>Type</th><th>Party</th><th>Qty</th><th>RM</th><th>Status</th><th></th></tr></thead><tbody>'+txq.map(q=>`<tr><td class="l" style="max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(q.raw||'')}</td><td>${q.type}</td><td class="mono">${esc(q.party)||'&mdash;'}</td><td>${q.qty!=null?q.qty+'unit':'&mdash;'}</td><td>${q.total!=null?fmt0(q.total):'&mdash;'}</td><td><span class="tag ${q.status==='paid'?'paid':q.status==='inkind'?'inkind':q.status==='modified'?'mod':q.status==='count'?'inkind':'unpaid'}">${({paid:'Paid',unpaid:'Unpaid',partial:'Partial',inkind:'In-Kind',modified:'Modified',credit:'Unpaid',count:'Count'})[q.status]||q.status}</span></td><td><button class="ubtn" onclick="undoEntry('${esc(q.at)}')">Undo</button></td></tr>`).join('')+'</tbody></table>';}

/* ============ CHARTS for tracker tabs ============ */
/* Chart.js comes from the CDN, but the desk must not depend on being online:
   if it did not load, fall back to the local copy in assets\, and if that is
   missing too, leave a quiet note where the chart would be. Either way the rest
   of the tab renders, which it did not before. */
let chartTried=false;
function ensureChart(cb){
  if(window.Chart){chartTheme();return cb(true);}
  if(chartTried)return cb(false);
  chartTried=true;
  const s=document.createElement('script');
  s.src='assets/chart.umd.js';
  s.onload=()=>{chartTheme();cb(!!window.Chart);};
  s.onerror=()=>cb(false);
  document.head.appendChild(s);
}
/* v281: ONE LOOK FOR EVERY CHART. Set once on the loaded library so all of the desk's
   charts inherit its type, a glass tooltip and the reduced-motion setting, instead of
   each options block half-repeating it. Anything a chart states locally still wins. */
function chartTheme(){
  if(!window.Chart||Chart.__salted)return; Chart.__salted=true;
  try{
    const D=Chart.defaults;
    D.font.family=getComputedStyle(document.body).fontFamily||"'Segoe UI',system-ui,sans-serif";
    D.font.size=11;
    D.color='rgba(244,245,247,0.66)';
    D.borderColor='rgba(255,255,255,0.07)';
    if(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches)D.animation=false;
    else{D.animation.duration=420;D.animation.easing='easeOutQuart';}
    const T=D.plugins.tooltip;
    T.backgroundColor='rgba(15,18,26,0.92)';T.borderColor='rgba(255,255,255,0.24)';T.borderWidth=1;
    T.cornerRadius=10;T.padding=10;T.caretSize=5;T.boxPadding=4;
    T.titleColor='#f4f5f7';T.bodyColor='rgba(244,245,247,0.85)';
    T.titleFont={weight:'700',size:11};T.bodyFont={size:11};
    const L=D.plugins.legend.labels;
    L.usePointStyle=true;L.pointStyle='circle';L.boxWidth=7;L.boxHeight=7;
    D.elements.line.borderCapStyle='round';D.elements.line.borderJoinStyle='round';
    D.elements.point.hoverRadius=5;
  }catch(e){}
}
/* v281: PER-PRODUCT CHARTS ACTUALLY DRAW PER PRODUCT. perProduct() emits a tab's markup
   once per book, so every canvas id inside it appears once PER PRODUCT; getElementById
   always found the FIRST, which is why the oil book's charts never drew and salt's canvas
   showed whichever book happened to be active. Three parts fix it structurally:
     - each .prodblock carries data-prod, so a canvas knows which book it belongs to;
     - blkEl() resolves an id INSIDE the block being drawn, falling back to the document
       for the single-book tabs, which are untouched;
     - drawPerProduct() runs a tab's draw functions once per block with PROD set to that
       block's book and the globals recomputed, restoring the active book afterwards.
   A chart object is keyed to its canvas (freshChart), never to a shared variable: a
   shared variable can only remember one book, so drawing the second would destroy and
   blank the first. */
let DRAW_BLK=null;
function blkEl(id){return (DRAW_BLK||document).querySelector('[id="'+id+'"]');}
function freshChart(el,cfg){
  if(!el||!window.Chart)return null;
  try{const old=Chart.getChart?Chart.getChart(el):null;if(old)old.destroy();}catch(e){}
  return new Chart(el,cfg);
}
function drawPerProduct(fns){
  ensureChart(()=>{   /* load once here, so the fns' own ensureChart calls resolve synchronously */
    const keep=PROD;
    document.querySelectorAll('.sec.on .prodblock[data-prod]').forEach(b=>{
      const p=b.dataset.prod; if(!PRODUCTS[p])return;
      PROD=p; recompute(); DRAW_BLK=b;
      fns.forEach(f=>{try{f();}catch(e){}});
    });
    DRAW_BLK=null; PROD=keep; recompute();
  });
}
function trackCharts(){
  const ic=blkEl('invChart');
  if(!ic)return;
  ensureChart(ok=>{
    if(!ok){ const h=ic.parentNode; if(h)h.innerHTML='<div class="dsc">Chart unavailable. Every figure it draws is in the tables on this tab.</div>'; return; }
    try{ drawInvChart(ic); }catch(e){ const h=ic.parentNode; if(h)h.innerHTML='<div class="dsc">The movement chart could not be drawn: '+(e&&e.message||e)+'</div>'; }
  });
}
function drawInvChart(ic){
  const loanOut=loanDrawKg();
  const labs=['Opening','Received','Sold','Self-use','On hand'],vals=[opening.qty,buyKg,-(soldKg-loanOut),-selfUse,currentStock],cols=['#e8c66b','#7fd7e8','#ff7a8a','#f0932b','#6ee7a8'];
  if(loanOut>0){labs.splice(3,0,'Loan out');vals.splice(3,0,-loanOut);cols.splice(3,0,'#b3a6f5');}  // the walk splits it; the chart should too
  freshChart(ic,{type:'bar',data:{labels:labs,datasets:[{data:vals,backgroundColor:cols,borderRadius:6}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},title:{display:true,text:'Inventory movement (unit)',color:'#f4f5f7',font:{size:12}}},scales:{x:{grid:{color:'rgba(255,255,255,0.07)'},ticks:{color:'rgba(244,245,247,0.66)'}},y:{grid:{color:'rgba(255,255,255,0.07)'},ticks:{color:'rgba(244,245,247,0.66)'}}}}});
}

/* ============ TAB SWITCH + RENDER ============ */
function custStats(){const m={};pricedSales.filter(s=>isPerson(s.customer)).forEach(s=>{if(!m[s.customer])m[s.customer]={id:s.customer,n:0,kg:0,rev:0,last:s.date,first:s.date};const o=m[s.customer];o.n++;o.kg+=s.qty;o.rev+=s.total;if(s.date>o.last)o.last=s.date;if(s.date<o.first)o.first=s.date;});return Object.values(m).sort((a,b)=>b.rev-a.rev);}
/* net of the pending tail, as recompute() and finRows() are: otherwise the Customers
   tab totalled a different revenue from the Overview on the same desk */
function byCustomer(){const m={};pricedSales.filter(s=>isPerson(s.customer)).forEach(s=>{if(!m[s.customer])m[s.customer]={rev:0,kg:0,margin:0,n:0};const o=m[s.customer];
  const rev=(s.total||0)-txPendRM(s),q=s.qty-txPendKgRaw(s);
  o.rev+=rev;o.kg+=q;o.margin+=rev-q*costOf(s);o.n++;});return Object.entries(m).map(([id,o])=>({id,...o})).sort((a,b)=>b.rev-a.rev);}
/* R3 attribution: a referred customer's FIRST order only (the introduction).
   An order can be split across consecutive days, so sum the earliest row plus any
   rows dated within 1 day of it; later orders are excluded. */
function firstOrderOf(cid){const rows=pricedSales.filter(s=>s.customer===cid&&s.total!=null).slice().sort((a,b)=>new Date(a.date)-new Date(b.date));if(!rows.length)return 0;const d0=new Date(rows[0].date);return rows.reduce((a,s)=>a+((new Date(s.date)-d0)/86400000<=1?(s.total||0):0),0);}
/* Free-unit rebate, R2 and R3 only. Own buys earn nothing. Two live triggers:
     MONEY  1 unit per REBATE.r2 resold, 1 per REBATE.r3 referred. Recurring.
     LOT    1 unit per single qualifying order of REBATE.lotKg or more. Added 04 Aug 2026.
   Three calls settled on his instruction, recorded because each is reversible:
     SCOPE     R2 and R3 only. All sales would have caught 11 direct orders from
               non-associates, about RM517 at lot cost.
     BASIS     alongside the money thresholds, not instead. Replacing them would push
               CS6-BS and CJ4-OKR negative on a rule written after they drew.
     STACKING  one per ORDER however large, so it cannot be gamed by splitting.
   OFFSET IS AUTOMATIC, REDEEM IS NOT (his rule, 04 Aug 2026). An earned unit that meets
   an outstanding advance clears it in kind, on its own, with nothing to press and no
   salt moving. Handing salt over is the opposite: it leaves the shelf, so it stays a
   deliberate act behind the Redeem button. The offset is booked into the row itself
   (settledRM + rebate:true), not derived at render, so the ledger stays the one record
   and an offset cannot be counted twice. See redeemRebate(). */
/* ============ STATED AWARDS, SEPARATE FROM EARNED (v268) ============
   A reward the rules produce and a reward he decides to give are different things, and a
   desk that adds them into one number cannot tell you which it is looking at. This holds the
   second kind. It is added to `earned` so the milestones panel balances, and it is listed
   apart so the reason survives.
   WHY CS6-PER IS HERE RATHER THAN IN THE RULE. He directed that the oil turnover count, which
   takes CS6-PER to exactly RM500 and earns a unit. Making the rule itself count oil would apply
   RETROSPECTIVELY to everyone: CS6-BS's R2 would go RM1,430 to RM1,560, crossing a third step,
   and his 10 unit oil resell would ALSO trip the large-lot trigger, so he would gain one or
   two units nobody intended to give him. The grant is therefore recorded here, and whether
   oil counts for everyone stays the open question it was. */
const AWARDS={
  'CS6-PER':{units:1,on:'2026-08-07',
       why:'Oil turnover counted at his direction: RM400 of salt plus RM100 of oil is exactly the RM500 step.'}
};
const REBATE={r2:500,r3:1500,lotKg:5,lotFree:1};   /* RETIRED at v280, kept only so any
   surviving reference fails loudly rather than silently reading undefined. Nothing should
   read it: the scheme below replaces all four numbers. */
/* ============ THE REWARD SCHEME (v280) ============
   ONE FORMULA, TWO HURDLES, FOUR BANDS.

     hurdle = base lot x cheapest unit cost x multiple

   The base lot is the smallest quantity the product is ever sold in, 1 unit for salt and
   10 for oil, so a lot costs RM47 and RM70. The multiple is 20 for a customer and 10 for
   an associate, which puts the salt hurdles at RM940 and RM470 and the oil ones at RM1,400
   and RM700. Everything is measured in MONEY, never in units: the unit basis went with the
   old large-lot trigger because the same quantity earns wildly different margin at
   different prices, and rewarding quantity rewarded the cheapest sales hardest.

   WHY A BAND AND NOT A FLAT UNIT. Turnover says who is big and margin says who is worth
   having, and on this book they rank almost nothing alike: the three largest accounts by
   turnover are first, third and eighteenth by margin. A flat unit per hurdle would pay
   most to whoever was sold to most cheaply. So the hurdle decides IF, and the margin band
   decides HOW MUCH.

   AN ASSOCIATE HAS TWO STREAMS AND THEY ARE MEASURED DIFFERENTLY. What he RESELLS and what
   he REFERS are now one stream against the associate hurdle, because both are him bringing
   business he does not consume. What he buys for HIMSELF is a customer purchase and takes
   the customer hurdle, because it is one.

   OPENING POSITIONS ARE STATED, NOT DERIVED. The scheme is applied retrospectively, and
   several units were handed over under rules that no longer exist. Re-deriving history
   against today's rule would either claw back salt already given or invent a debt nobody
   agreed. So each party opens on a STATED position, exactly as cash opens on a count, and
   the engine accrues from there. A negative opening is carried forward: it absorbs the
   next units earned rather than being written off. */
const REWARD={
  /* THE SCHEME ACCRUES FROM ITS ADOPTION, NOT OVER ALL HISTORY, and the reason is worth
     keeping. The opening positions below are the NET result of every unit earned and taken
     under the old rules. If the engine also re-earned against that same history it would
     pay twice for it: CJ4-OKR would be settled by his opening AND earn again on the
     referrals that settled it. So history is captured once, in the opening, and the engine
     counts only what happens from this date. */
  since:'2026-08-10',
  hurdleMultiple:{customer:20, associate:10},
  lot:{salt:{base:1, cost:47}, oil:{base:10, cost:7}},
  /* margin on revenue, read from what the party has ACTUALLY delivered, not from a quote */
  bands:[{min:50,units:1,label:'full'},{min:40,units:0.5,label:'half'},{min:30,units:0.25,label:'quarter'},{min:0,units:0,label:'none'}]
};
function rewardHurdle(prod,who){
  const L=REWARD.lot[prod]||REWARD.lot.salt;
  return +(L.base*L.cost*REWARD.hurdleMultiple[who]).toFixed(2);
}
function rewardBand(pct){
  for(const b of REWARD.bands){ if(pct>=b.min) return b; }

/* ============ THE CUSTOMER SIDE OF THE REWARD SCHEME (v280) ============

   which is RM940 on salt and RM1,400 on oil, against RM470 and RM700 for someone bringing
   business in. He buys for himself, so he is paid less for the same money than a man who
   brings you a stranger, which is the whole point of having two hurdles.

   THE BAND STILL DECIDES HOW MUCH. Turnover says who is big and margin says who is worth
   having, and on this book they rank almost nothing alike. Rewarding turnover alone would pay
   most to whoever was sold to most cheaply.

   OPENINGS ARE STATED, exactly as they are for associates. Three customers were rewarded by
   hand before the scheme existed, and those rewards settle their positions: CE4-CHE took half
   a unit extra on the same money, CM4-MK took a rate cut worth about nine tenths of a unit for
