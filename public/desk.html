    <div class="dsc" style="margin-top:9px">A customer clears <b>${fmt0(rewardHurdle(PROD,'customer'))}</b> for a unit, against <b>${fmt0(rewardHurdle(PROD,'associate'))}</b> for an associate bringing business in: base lot times cheapest unit cost times ${REWARD.hurdleMultiple.customer} and ${REWARD.hurdleMultiple.associate}. The hurdle decides <b>if</b>, the margin band decides <b>how much</b>: ${REWARD.bands.filter(b=>b.units>0).map(b=>`${b.min}% and over earns ${kg(b.units)}`).join(', ')}, and under ${REWARD.bands.filter(b=>b.units>0).slice(-1)[0].min}% earns nothing. Turnover and margin rank almost nothing alike on this book, so paying on turnover alone would pay most to whoever was sold to most cheaply.${crReady.length?` <b style="color:var(--gold)">${crReady.map(r=>ID(r.id)).join(', ')} ${crReady.length===1?'has':'have'} a reward waiting.</b>`:''}</div></div>`;
  return `<h1>Customers</h1>

  ${thin.length?` <b>${thin.length} customer${thin.length===1?'':'s'} sit under a 20% margin</b> (${thin.map(x=>codeOf(x.id)+' at '+(x.margin/x.rev*100).toFixed(0)+'%').join(', ')}), which is a price problem rather than a cost one: the same salt earns more elsewhere on the same book.`:' Nobody is under a 20% margin.'}
  ${overdue.length?` <b>${overdue.length} ${overdue.length===1?'is':'are'} past their own buying habit</b>, worth <b>${fmt0(overdueRM)}</b> if the usual lot went out at today&rsquo;s price: ${overdue.slice(0,3).map(r=>codeOf(r.id)+' by '+r.due+'d').join(', ')}${overdue.length>3?' and others':''}. That is the most valuable thing on this tab, because it needs a message rather than a decision.`:''}
  ${Object.keys(owedBy).length?` Note that ${Object.keys(owedBy).length} of them owe money, and a chase comes before an offer.`:''}</div>

  <h2 style="margin-top:18px">Where the book leans <span class="rule"></span></h2>

  <div class="card" style="margin-top:14px"><div class="cardh">Revenue against margin <span class="sub">per order across, total revenue as the circle</span></div>
      <div class="chartbox" style="height:230px"><canvas id="ccScatter"></canvas></div>
      <div class="dsc" style="margin-top:7px">Each dot is a customer, sized by volume. The line is the 20% mark. <b>Bottom right is the problem quadrant</b>: a large buyer on a thin margin, where the revenue flatters the book and the salt would earn more sold to someone else. The overdue bar chart that used to sit beside this was removed at v208: it plotted days past cadence, which is what the calendar below now says by position, and two pictures of one fact is how a tab starts costing more than it tells you.</div></div>
  <div class="card" style="margin-top:14px"><div style="font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--dim);margin-bottom:4px">Revenue by customer <span style="text-transform:none;letter-spacing:0">&mdash; drawn without Chart.js, so it is always here</span></div>${bars}</div>

  <h2 style="margin-top:18px">Who to approach next <span class="rule"></span></h2>
  <div class="dsc" style="margin-bottom:9px">The month, by the day each buyer is next due on his own habit. Everything the old ten-column table carried is still here, in the card that opens when you point at a name or tap it.</div>
  ${approach.filter(r=>r.cad&&r.cad.last).length?approachBoard(approach,owedBy,bm)
    :'<div class="card"><div class="dsc">No customer has two priced orders yet, so there is no habit to read and nothing to place on a calendar.</div></div>'}

  <h2 style="margin-top:18px">Demand you could not serve <span class="rule"></span></h2>

      +ld.map(r=>`<tr><td class="l">${r.date}</td><td class="l mono">${r.party?ID(r.party):'walk-up'}</td><td>${kg(r.kg)}</td><td>${fmt0(r.rm)}</td><td>${r.kg>0&&r.rm>0?fmt(r.rm/r.kg):'&mdash;'}</td><td class="l">${LOST_LABEL[r.why]||r.why}${r.note?' &middot; '+esc(r.note):''}</td></tr>`).join('')

/* ---- the three Customers charts (v165) -------------------------------------
   All three read the same numbers the tables do; none of them models anything. Pareto
   answers how few names the desk depends on, the scatter separates big from profitable,
   and the cadence bar says who is late against his OWN habit rather than an average. */
let ccParetoObj=null,ccScatterObj=null;   /* ccDueObj went at v208 with the overdue bar chart */
function drawConcCharts(){
  const p=document.getElementById('ccPareto'),s=document.getElementById('ccScatter');
  if(!p&&!s)return;
  ensureChart(ok=>{
    if(!ok){[p,s].forEach(el=>{chartEmpty(el,'Chart unavailable. Every figure it draws is in the tables on this tab.');});return;}
    try{
      const c=concentration();
      const GRID='rgba(255,255,255,0.07)',TICK='rgba(244,245,247,0.66)';
      [ccParetoObj,ccScatterObj].forEach(o=>{if(o){try{o.destroy();}catch(e){}}});
      if(p){
        let run=0;const cum=c.bc.map(x=>{run+=x.rev;return +(run/c.tot*100).toFixed(1);});
        ccParetoObj=new Chart(p,{data:{labels:c.bc.map(x=>codeOf(x.id)),datasets:[
          {type:'bar',label:'Revenue',data:c.bc.map(x=>+x.rev.toFixed(2)),
           backgroundColor:'#7fd7e8',borderWidth:0,borderRadius:3,order:2},
          {type:'line',label:'Cumulative share',data:cum,yAxisID:'y1',borderColor:'#e8c66b',
           backgroundColor:'transparent',pointRadius:2,borderWidth:2,tension:.2,order:1}]},
          options:{responsive:true,maintainAspectRatio:false,
            plugins:{legend:{labels:{color:TICK,boxWidth:12,font:{size:11}}}},
            scales:{x:{grid:{display:false},ticks:{color:TICK,font:{size:10},maxRotation:60,minRotation:45}},
              y:{grid:{color:GRID},ticks:{color:TICK,callback:v=>Number(v).toLocaleString('en-MY',{maximumFractionDigits:0})}},
              y1:{position:'right',min:0,max:100,grid:{display:false},
                  ticks:{color:'#e8c66b',callback:v=>v+'%'}}}}});
      }
      if(s){
        /* ============ REVENUE AGAINST MARGIN (v260) ============
           Three things were asked for and each replaces a guess with a measurement.
           THE AVERAGE IS DRAWN, NOT DESCRIBED. It is the WEIGHTED average, total margin over
           total revenue, which is the desk's actual blended margin; a simple mean of the dots
           would let a RM50 order pull the line as hard as a RM1,600 one.
           EVERY DOT CARRIES ITS PERCENTILE. "42% margin" means nothing on its own; "42%, which
           is the 62nd percentile of this book" says whether it is a good trade HERE.
           AND THE TWO TAILS ARE NAMED, because they are the only two that imply an action.
           The top quartile is where the money is made: high value CUSTOMERS. The bottom
           quartile is not a list of mistakes, it is what he keeps for reasons other than
           margin: high value RELATIONSHIPS. The middle is the book working normally and is
           left in one neutral colour so the tails read at a glance. */
        /* v261: THE TWO AXES WERE THE SAME FACT TWICE. x carried total revenue and the
           bubble carried volume, so a big customer was big twice over and the chart could not
           tell a customer who buys often in small lots from one who buys rarely in large ones.
           x IS NOW REVENUE PER ORDER, which is the size of a typical trade with that party,
           and the BUBBLE IS TOTAL REVENUE, which is what he is worth altogether. Read across
           for the size of the deal, read the circle for the size of the relationship. */
        const raw=c.bc.filter(x=>x.rev>0&&x.n>0).map(x=>({rev:x.rev,per:x.rev/x.n,n:x.n,
          mar:x.margin,pct:x.margin/x.rev*100,id:x.id,kg:x.kg}));
        const revs=raw.map(z=>z.rev), rMax=Math.max.apply(null,revs);
        const sorted=raw.slice().sort((a,b)=>a.pct-b.pct);
        const pctlOf=v=>{const n=sorted.length;if(!n)return null;
          const below=sorted.filter(z=>z.pct<v-1e-9).length, same=sorted.filter(z=>Math.abs(z.pct-v)<1e-9).length;
          return Math.round((below+same/2)/n*100);};
        const wAvg=raw.reduce((a,x)=>a+x.mar,0)/Math.max(0.01,raw.reduce((a,x)=>a+x.rev,0))*100;
        const band=q=>q>=75?'top':q<=25?'bottom':'mid';
        const BANDCOL={top:{f:'rgba(232,198,107,.55)',b:'#e8c66b',lab:'high value customer'},
                       mid:{f:'rgba(127,215,232,.45)',b:'#7fd7e8',lab:'the middle of the book'},
                       bottom:{f:'rgba(179,166,245,.55)',b:'#b3a6f5',lab:'high value relationship'}};
        /* area, not radius, carries the value: doubling revenue should double the ink, and
           radius-proportional bubbles overstate a big customer by the square */
        const pts=raw.map(x=>{const q=pctlOf(x.pct);
          return {x:+x.per.toFixed(2),y:+x.pct.toFixed(1),
            r:Math.max(4,Math.min(20,Math.sqrt(x.rev/Math.max(1,rMax))*20)),
            id:codeOf(x.id),kg:x.kg,rev:x.rev,n:x.n,q:q,band:band(q)};});
        const xs=pts.map(z=>z.x), xlo=Math.min.apply(null,xs)*0.9, xhi=Math.max.apply(null,xs)*1.05;
        const ord=n=>n+((n%100>=11&&n%100<=13)?'th':({1:'st',2:'nd',3:'rd'})[n%10]||'th');
        ccScatterObj=new Chart(s,{data:{datasets:[
          {type:'line',label:'Average margin '+wAvg.toFixed(1)+'%',
           data:[{x:xlo,y:+wAvg.toFixed(1)},{x:xhi,y:+wAvg.toFixed(1)}],
           borderColor:'#e8dcae',borderDash:[6,4],borderWidth:1.5,pointRadius:0,fill:false,order:1},
          {type:'bubble',label:'Customers',data:pts,order:2,
           backgroundColor:pts.map(q=>BANDCOL[q.band].f),
           borderColor:pts.map(q=>BANDCOL[q.band].b),borderWidth:1}]},
          options:{responsive:true,maintainAspectRatio:false,
            plugins:{legend:{labels:{color:TICK,boxWidth:12,font:{size:10}},
                             filter:it=>it.datasetIndex===0},
              tooltip:{callbacks:{label:i=>{if(i.datasetIndex===0)return 'Average margin '+wAvg.toFixed(1)+'%';
                const q=i.raw;
                return q.id+': '+CUR+' '+Number(q.x).toLocaleString('en-MY',{maximumFractionDigits:0})+' an order'
                  +' over '+q.n+' order'+(q.n===1?'':'s')+', '+CUR+' '+Number(q.rev).toLocaleString('en-MY',{maximumFractionDigits:0})+' in all'
                  +', '+q.y+'% margin — '+ord(q.q)+' percentile, '+BANDCOL[q.band].lab;}}}},
            scales:{x:{title:{display:true,text:'Revenue per order (RM)',color:TICK,font:{size:11}},
                       grid:{color:GRID},ticks:{color:TICK,callback:v=>Number(v).toLocaleString('en-MY',{maximumFractionDigits:0})}},
                    y:{title:{display:true,text:'Margin %',color:TICK,font:{size:11}},
                       grid:{color:GRID},ticks:{color:TICK,callback:v=>v+'%'}}}}});
      }
    }catch(e){}
  });
}
function redeemRebate(rid){const rst=networkStats().find(x=>x.id===rid);if(!rst)return;const applied=rebateApplied(rid);const freeKg=+(rst.earned-applied).toFixed(2);if(freeKg<=0.009)return;
  // rule: a free unit offsets an outstanding advance first (clears the debt, no salt leaves the shelf);
  // only where the associate holds no advance does it go out as free salt through the queue.
  const adv=sales.filter(s=>s.customer===rid&&txAdvance(s)>0.009).sort((a,b)=>a.date<b.date?-1:1);
  if(adv.length){const s=adv[0],owe=txAdvance(s),price=txPrice(s),offKg=+Math.min(freeKg,price>0?owe/price:freeKg).toFixed(2),offRM=+(price*offKg).toFixed(2);
    queue.push({at:new Date().toISOString(),type:'REBATE_OFFSET',party:codeOf(rid),ref:s.date,qty:offKg,total:0,cash:0,settledRM:offRM,status:'inkind',raw:'Rebate: offset '+offKg+' unit for '+codeOf(rid)+' against the '+s.date+' advance, clearing '+CUR+' '+offRM});}
  else{queue.push({at:new Date().toISOString(),type:'REDEEM',party:codeOf(rid),qty:freeKg,total:0,status:'inkind',raw:'Redeem '+freeKg+' unit free rebate salt for '+codeOf(rid)});}
  saveQueue();switchTab('add');}
/* one badge builder for every partner: level tag + Diamond gem-pill or star pill */
/* PRINCIPAL. The founding partner is not a bigger associate, he is a different tier: he
   opened the network the rest of it hangs off. He carries his own title, held by him
   alone, and no R-number, because a rank number invites comparison with a bench he does
   not sit on. Everyone else remains an Associate, ranked #1, #2 by contribution. */
const PRINCIPAL_TITLE='Co-Founder';
function isPrincipal(r){return (r&&r.kind==='R0');}
function partnerBadge(r){
  if(isPrincipal(r)){
    let p=`<span class="rtag" style="border-color:var(--gold);color:var(--gold)">${PRINCIPAL_TITLE}</span>`;
    if(typeof DIAMOND!=='undefined'&&DIAMOND.indexOf(r.id)>=0)p+=' <span class="gem" title="Diamond &mdash; top partner, awarded on a special basis">&#9670; Diamond</span>';
    else if(r.starN>0)p+=` <span class="starpill s${r.starN}" title="${r.starN}-star by revenue share">${'&#9733;'.repeat(r.starN)} ${r.starN}&#8209;star</span>`;
    return p;
  }
  const lvl='#'+(r.rNum||1);
  let out=`<span class="rtag">Associate &middot; ${lvl}</span>`;
  if(typeof DIAMOND!=='undefined'&&DIAMOND.indexOf(r.id)>=0){
    out+=' <span class="gem" title="Diamond &mdash; top partner, awarded on a special basis">&#9670; Diamond</span>';
  } else if(r.starN>0){
    out+=` <span class="starpill s${r.starN}" title="${r.starN}-star by revenue share">${'&#9733;'.repeat(r.starN)} ${r.starN}&#8209;star</span>`;
  }
  return out;
}
function resellerCard(r){

  // summary line (collapsed)
  const summary=`<summary><span class="mono rname">${ID(r.id)}</span> ${badge}<span class="rsum">made you <b>${fmt0(r.total)}</b> &middot; R3 <b>${fmt0(r.r3)}</b> &middot; ${rebateStr}</span></summary>`;
  // KPI trio: R1 / R2 / R3 (same for every associate)
  const kpis=`<div class="kpis k3" style="margin-top:10px">
    <div class="kpi"><div class="l">Bought from you</div><div class="v">${fmt0(r.direct)}</div><div class="n">their own orders &middot; R1</div></div>
    <div class="kpi g"><div class="l">Sold for you</div><div class="v">${fmt0(r.indirect)}</div><div class="n">${r.dsResell} onward ${r.dsResell===1?'sale':'sales'} &middot; R2</div></div>
    <div class="kpi p"><div class="l">Brought you</div><div class="v">${fmt0(r.r3)}</div><div class="n">${r.referrals.length} introduced, first order &middot; R3</div></div>

function pxMarket(){
  const c=pxCost();
  const rows=pricedSales.filter(s=>s.total>0&&s.qty>0);
  const seg=f=>{const r=rows.filter(s=>f(s.qty));
    const k=+r.reduce((a,s)=>a+(s.qty-txPendKgRaw(s)),0).toFixed(2);
    const rm=+r.reduce((a,s)=>a+(s.total-txPendKgRaw(s)*txPrice(s)),0).toFixed(2);
    const p=k>0?rm/k:0;return {k,rm,p:+p.toFixed(2),m:p>0?+((p-c.eff)/p*100).toFixed(1):0,n:r.length};};
  const all=seg(()=>true),small=seg(q=>q<PX.bulkFrom),bulk=seg(q=>q>=PX.bulkFrom);
  /* wholesale stripped of anything marked a one-off, because a single outlier at
     RM104/unit is what makes the wholesale average look survivable */
  const bulkEx=(()=>{const r=rows.filter(s=>s.qty>=PX.bulkFrom&&!isOneOff(s.customer));
    const k=+r.reduce((a,s)=>a+(s.qty-txPendKgRaw(s)),0).toFixed(2);
    const rm=+r.reduce((a,s)=>a+(s.total-txPendKgRaw(s)*txPrice(s)),0).toFixed(2);
    const p=k>0?rm/k:0;return {k,rm,p:+p.toFixed(2),m:p>0?+((p-c.eff)/p*100).toFixed(1):0,n:r.length};})();
  const excluded=rows.filter(s=>s.qty>=PX.bulkFrom&&isOneOff(s.customer));
  /* the buying rate at which the realised bulk price would clear the floor
     unchanged: back out the effective cost the floor allows, then strip the shrink load */
  const needEff=bulk.p*(1-PRICE.floorPct.wholesale/100);
  const needRate=+(needEff*(1-c.shrink)).toFixed(2);
  return {c,all,small,bulk,bulkEx,excluded,needRate};
}
/* THE ACTIVE PRODUCT'S SUPPLY QUOTE (v228). One panel, driven by QUOTES, so a third
   product needs an entry there and nothing here. It checks the ladder the way the salt
   board checks itself: the rate must not rise with size, and no tier may be beaten by
   buying the same quantity as smaller tiers. Both are BUY-side questions here, because a
   quote is what a supplier charges, which is the mistake v226 made and v228 makes
   impossible by putting quotes in one place with one label. */
function ladderCheck(tiers){
  const rows=tiers.map(t=>({q:t.q!=null?t.q:t.qty,total:t.total,note:t.note||''}))
    .map(r=>Object.assign(r,{rate:+(r.total/r.q).toFixed(2)})).sort((a,b)=>a.q-b.q);
  const rising=[];
  for(let i=1;i<rows.length;i++) if(rows[i].rate>rows[i-1].rate+0.009)
    rising.push({from:rows[i-1],to:rows[i],by:+(rows[i].rate-rows[i-1].rate).toFixed(2)});
  const memo={};
  const solve=n=>{const k=n.toFixed(2);if(n<0.009)return 0;if(memo[k]!=null)return memo[k];
    memo[k]=Infinity;let b=Infinity;
    rows.forEach(r=>{if(r.q<=n+0.009){const sub=solve(+(n-r.q).toFixed(2));if(sub!==Infinity)b=Math.min(b,r.total+sub);}});
    return memo[k]=b;};
  const beaten=rows.map(r=>{const c=solve(r.q);
    return c<r.total-0.009?{q:r.q,total:r.total,cheap:+c.toFixed(2),save:+(r.total-c).toFixed(2)}:null;}).filter(Boolean);
  /* THE UNCARDED SIZES, STEPPED BY THE LADDER'S OWN GRAIN (v229). Walking whole units was
     wrong twice over: on oil, measured in tens, it proposed 46 sizes nobody would ever ask
     for; on salt, whose tiers are 12.5 apart, it proposed 96. The meaningful step is the
     highest common factor of the tier sizes, so oil steps by 10 and salt by 12.5, and the
     panel reports the handful of sizes a customer might actually name. Computed on hundredths
     so a fractional tier like 12.5 does not fall out of an integer gcd. */
  const gcd=(a,b)=>b<1?a:gcd(b,a%b);
  const step=(rows.map(r=>Math.round(r.q*100)).reduce((a,b)=>gcd(a,b)))/100||1;
  const gaps=[];const top=rows[rows.length-1].q;
  for(let n=step;n<top-0.009;n=+(n+step).toFixed(2)){
    if(rows.some(r=>Math.abs(r.q-n)<0.009))continue;
    const c=solve(n),up=rows.find(r=>r.q>n);
    if(c!==Infinity)gaps.push({q:n,built:+c.toFixed(2),up:up?up.q:null,upTotal:up?up.total:null,step:up?+(up.total-c).toFixed(2):null});}
  return {rows,rising,beaten,gaps,grain:step,gapsShown:Math.min(gaps.length,4),gapsMore:Math.max(0,gaps.length-4)};
}

    <div id="mnOut" style="margin-top:13px"><div class="dsc">Publish sends the board above to the menu, so every code already in circulation shows the new figures without being rescanned. Make a code issues a link to one reseller. Download a page saves a file you can send, which does <b>not</b> need the server or this wifi.</div></div>
    <div class="dsc" style="margin-top:11px"><b>What this cannot do.</b> No web page can blank a screenshot: there is no API for it on iOS Safari or anywhere else, and anything claiming otherwise is theatre. What it does instead is make a leak <b>traceable and perishable</b>, by writing the reseller&rsquo;s code across the page and expiring the link. If a screenshot turns up, the code on it names who took it.</div>
    <div class="dsc" style="margin-top:9px"><b>The downloaded page needs no wifi, and is opened with a password that stops working.</b> The prices travel inside the file as <b>AES-GCM ciphertext</b>, under a key derived from the password by PBKDF2 at 150,000 iterations, the same scheme as this desk&rsquo;s own name vault. The password is not stored in the file and there is nothing in it to compare against: a wrong one fails because the authentication tag does not verify. So a forwarded file, on its own, is ciphertext. <b>Send the password down a different channel than the file</b>, or the two travel together and the lock is decoration.</div>
    <div class="dsc" style="margin-top:9px"><b>What the time limit is, exactly.</b> The expiry is passed as authenticated data, so <b>editing the date inside the file stops it opening at all</b>. That half is cryptographic. The comparison, though, is against the reader&rsquo;s own device clock, and a clock can be set backwards, so it is not proof against a determined reader. And once the right password is typed the prices are on a screen, which no scheme can un-see. That is why the code stays tiled across the sheet: a leaked screenshot still names who opened it. <b>The QR route remains the stricter one</b> &mdash; it keeps the prices out of the file entirely and can be withdrawn &mdash; so use a code where you would not hand over a copy at all, and the file where the reseller needs it to work without your wifi.</div>
  </div>

  <details class="obsec"><summary>Price response <span class="q">what has sold at each price</span></summary>
  <div class="dsc" style="margin-bottom:9px">What you have actually sold at each price, carried over from the original Register. Observed trade only &mdash; <b>no fitted demand curve and no invented elasticity</b>. Volume tells you where the business really sits; revenue tells you which price is carrying it. Prices are grouped to the nearest ringgit, and the axis lists the prices you have traded at rather than a continuous scale, so the gaps are not to scale.</div>
  <div class="two">
    <div class="chartbox"><canvas id="priceQtyChart"></canvas></div>
    <div class="chartbox"><canvas id="priceRevChart"></canvas></div>
  </div>
  <div class="insight" style="margin-top:10px">${priceNote()}</div>
  </details>
  ${(()=>{const c=pxCost();if(!c.lotQty)return '';
    const r=(lab,v,tag,n)=>`<tr><td class="l">${lab}<div class="iref">${esc(n||'')}</div></td><td class="mono">${fmt(v)}</td><td><span class="tag ${tag==='inventory'?'paid':'prov'}">${tag==='inventory'?'Inventory':'Period'}</span></td></tr>`;
    const LK=priceLockState(PROD);

    return `<h2 style="margin-top:22px">What a unit costs ${chip} <span class="sub" style="font-weight:400">${c.locked?`held since ${LK.lock.lockedOn}`:'not the locked basis'}</span> <span class="rule"></span></h2>
    <div class="card"><table class="fintab istmt"><tbody>
      ${r('Lot rate',c.lot,'inventory',`${kg(c.lotQty)} on ${c.lotDate}`)}
      ${r('Collection',c.freight,'inventory',`${fmt0(COST_BASIS.freightPerLot.rm)} spread over ${kg(c.lotQty)}`)}

      <tr class="tot"><td class="l"><b>Pricing basis</b><div class="iref">what a price has to return</div></td><td class="mono"><b>${fmt(c.eff)}</b></td><td></td></tr>
    </tbody></table>
    ${c.absorbed>0.009?`<div class="dsc" style="margin-top:8px">Absorbed and not recovered: ${fmt(c.absorbed)}/unit, the unexplained half of the leak.</div>`:''}
    ${c.locked?`<div class="dsc" style="margin-top:7px">Frozen on the ${kg(c.lotQty)} lot of ${c.lotDate}. Selling, losing, counting and delivering do not move it; the next lot does.</div>`
      :c.stale?`<div class="dsc" style="margin-top:7px"><b style="color:var(--crim)">A newer lot has landed and the board has repriced itself.</b> ${LK.cur?`${kg(LK.cur.qty)} at ${fmt(LK.cur.rate)} on ${LK.cur.date}`:''}, against the locked ${kg(LK.lock.lot.qty)} at ${fmt(LK.lock.lot.rate)}. Write the figures above into PRICE_LOCK to hold them.</div>`

  ${tabProductQuote()}

/* ============ RESELLER MENU (v160) ============
   The board on this tab, published to a phone-sized page that the desk serves to the
   wifi and nobody else. Publishing pushes the CURRENT prices, so a code already in a
   reseller's phone shows the new figures without being rescanned; that is what makes it
   live. Minting signs a link for one reseller, server-side, because the secret must
   never reach the browser. */
let mnOver={who:'',hours:'48',pass:''};
/* Six characters, read out loud over a call without ambiguity: no O/0, no I/1/l.
   Short because it is a perishable door code sent down a second channel, not a login. */
function mnPass6(){
  const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  let s='';const r=crypto.getRandomValues(new Uint8Array(6));
  for(let i=0;i<6;i++)s+=A[r[i]%A.length];
  return s;
}
function mnRows(){
  const sg=pxSignals(),cap=capLot();
  const sizes=PX.sizes.filter(q=>cap==null||q<=cap+0.009);
  /* one hero, not several: the size actually ordered most often. Tagging every size with
     three orders put the badge on half the list, which tells a reseller nothing. */
  let best=null,bestN=0;
  sizes.forEach(q=>{const n=pxHistory(q).n||0;if(n>bestN){bestN=n;best=q;}});
  /* The reseller menu quotes the R TIER (v165), because R is the card that actually
     leaves his phone and the published list has to be the same number as the card.
     Above the carded sizes there is no R price, so the engine answers there.

     SIZES THE R CARD SKIPS ARE DROPPED, not filled from the engine. 3.5 and 4.5 have no
     R price, and taking them from the computed board put RM340 at 3.5 next to RM390 at
     4, which is RM97.14 a unit then RM97.50: the rate RISES with size and the ladder
     inverts. A published list that gets dearer as the lot grows invites exactly one
     question from a reseller and there is no good answer to it. */
  const topCard=PRICE_TIERS.sizes[PRICE_TIERS.sizes.length-1];
  return sizes.filter(q=>tierPrice('R',q)!=null||q>topCard+0.009).map(q=>{
    const tp=tierPrice('R',q);
    const row={q:q,p:tp!=null?tp:pxQuote(q,sg.net,0).total};
    if(q===best&&bestN>=3){row.hero=true;row.label='most asked for';}
    return row;});
}

/* ---- Save one tier, no password (v172) -------------------------------------
   The encrypted download at v164 is issued to ONE reseller, expires, and is opened with
   a code sent down a second channel. That is the right shape for a personal list and the
   wrong shape for the thing he actually hands out most: a tier's price list, the same
   sheet for everyone on that tier, printed today and stale tomorrow.

   So this is the plain twin. No password, no expiry, no script in the output. It carries
   the prices openly BECAUSE that is the job: a customer cannot be asked for a passphrase
   at the point of sale.

   IT FOLLOWS THE PRINTED CARDS EXACTLY, including the part that looks like decoration.
   cards.py is explicit that NO CARD NAMES ITS TIER, and that the three markers telling
   them apart are meant to be known only to him: the filename, the accent rule under the
   masthead, and a row of faint dots after the date (1 for SS, 5 for P). A recipient
   holding one sheet learns nothing about what anyone else pays. Printing a big "R" on it
   would undo that in one stroke, so the letter appears in the filename and nowhere on

function mnSaveTier(code){

/* ---- Download a page: password-gated and time-limited (v164) ----------------
   A self-contained price list that needs NO WIFI and NO SERVER, and is opened with a
   password that stops working after a set number of hours.

                  nothing to reach. This is absolute.

                  the same iteration count as the desk's own name vault. The password

                  against: a wrong password fails because the authentication tag does
                  not verify, not because a check said no. This is real protection. A

async function mnDownload(){
  var who=(document.getElementById('mnWho')||{}).value||roster[0];
  var hrs=parseFloat((document.getElementById('mnHrs')||{}).value)||48;
  var pass=((document.getElementById('mnPass')||{}).value||'').trim();
  mnOver.who=who;mnOver.hours=String(hrs);mnOver.pass=pass;
  if(!pass)return mnStatus('<div class="dsc" style="color:var(--crim)">Set a password first. It is the only thing standing between the file and whoever it gets forwarded to.</div>');
  if(!(window.crypto&&window.crypto.subtle))return mnStatus('<div class="dsc" style="color:var(--crim)">This browser cannot encrypt the file (no Web Crypto). Open the desk over <b>localhost</b> with <b>Open Salt Command.bat</b> rather than by double-clicking it.</div>');
  var code=codeOf(who);
  var rows=mnRows();
  if(!rows.length)return mnStatus('<div class="dsc" style="color:var(--crim)">The board has no sizes to publish, so there is nothing to download.</div>');
  var now=new Date(), exp=Math.floor(now.getTime()/1000)+Math.round(hrs*3600);
  var pad=function(n){return (n<10?'0':'')+n;};
  var fmtWhen=function(d){return d.toLocaleString('en-GB',{day:'2-digit',month:'short',
    year:'numeric',hour:'2-digit',minute:'2-digit'})+' KL';};
  var secret={rows:rows,
    note:'Prices move with the buying rate. This list is today’s, not a quotation held open.'};
  var payload;
  try{
    var enc=new TextEncoder();
    var salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
    var base=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:150000,hash:'SHA-256'},
      base,{name:'AES-GCM',length:256},false,['encrypt']);
    /* the expiry is authenticated, not merely written down: change it in the file and
       the tag stops verifying, so the whole list refuses to open */
    var ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv,additionalData:enc.encode(String(exp))},
      key,enc.encode(JSON.stringify(secret)));
    payload={v:1,code:code,brand:'Obsidian Salt',version:(evolution[0]?evolution[0].v:''),
      dated:LAST_UPDATED.replace(/,.*/,''),issued:fmtWhen(now),
      exp:exp,expLabel:fmtWhen(new Date(exp*1000)),iter:150000,
      salt:_b64e(salt),iv:_b64e(iv),ct:_b64e(ct)};
  }catch(err){
    return mnStatus('<div class="dsc" style="color:var(--crim)">Could not encrypt the file: '+esc(err.message)+'</div>');
  }
  var html=mnDocHTML(code,payload,{brand:'Obsidian Salt'});
  var stamp=now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate());
  var fname='menu_'+String(code).replace(/[^A-Za-z0-9._-]+/g,'-')+'_'+stamp+'.html';
  try{
    var blob=new Blob([html],{type:'text/html;charset=utf-8'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url;a.download=fname;a.style.display='none';
    document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(url);a.remove();},1500);
  }catch(err){
    return mnStatus('<div class="dsc" style="color:var(--crim)">Could not save the file: '+esc(err.message)+'</div>');
  }
  mnStatus('<div class="insight"><b>Saved '+esc(fname)+'</b> &mdash; '+rows.length+' lots, locked, issued to <b>'+esc(code)+'</b>.'
    +'<div style="margin-top:9px;font-family:ui-monospace,Consolas,monospace;font-size:19px;letter-spacing:.2em">'+esc(pass)+'</div>'
    +'<div class="dsc" style="margin-top:7px">Valid until <b>'+esc(payload.expLabel)+'</b>, '+hrs+' hours.'
    +' <b>Send the password by a different channel</b> than the file, or the two travel together and the lock is decoration.'
    +' Needs no wifi and no server: the prices are inside the file, encrypted, and nothing is fetched.'
    +' The expiry is authenticated, so editing the date in the file stops it opening at all &mdash; but it is compared against the reader&rsquo;s own clock, which a determined reader can move.'
    +' And once the right password is in, a screenshot cannot be stopped, which is why the code is tiled across the sheet.</div></div>');
}

/* ---- price response: observed volume and revenue at each price ----
   Ported from the Salt Trading Register. Two deliberate choices kept from it: only
   PRICED, non-pending trade is counted, and no curve is fitted -- there is nowhere near
   enough data to infer demand, and a drawn curve would invite decisions it cannot carry.
   The Register's rounding fault is fixed: it bucketed by rounded price and then valued
   the bar at that rounded price, so RM108.33 x 6 unit showed as RM648 instead of RM650.
   Revenue here is summed from the real totals. */
function priceBuckets(){
  const b={};
  pricedSales.forEach(s=>{const q=s.qty-txPendKgRaw(s);if(!(q>0)||!(s.total>0))return;
    const p=Math.round(s.total/s.qty);
    if(!b[p])b[p]={kg:0,rm:0,n:0};
    b[p].kg+=q;b[p].rm+=(s.total||0)-txPendRM(s);b[p].n++;});
  return Object.keys(b).map(Number).sort((a,b2)=>a-b2).map(p=>({p,...b[p]}));
}
function priceNote(){
  const pts=priceBuckets();
  if(!pts.length)return 'No priced trade yet.';
  const byKg=pts.slice().sort((a,b)=>b.kg-a.kg)[0], byRM=pts.slice().sort((a,b)=>b.rm-a.rm)[0];
  /* judged against the BULK floor, the most forgiving of the three, so this reads as
     a floor no trade of any size should fall under rather than an unfair single-unit
     test applied to a 12.5 unit lot. */
  const rc=replCost(),flB=PRICE.floorPct.wholesale,under=pts.filter(x=>x.p<rc/(1-flB/100));
  const underKg=under.reduce((a,x)=>a+x.kg,0),totKg=pts.reduce((a,x)=>a+x.kg,0);
  return `Your busiest price is <b>${fmt0(byKg.p)}/unit</b> at ${kg(byKg.kg)}; the price earning most is <b>${fmt0(byRM.p)}/unit</b> at ${fmt0(byRM.rm)}. `
   +`Across ${pts.length} distinct prices, <b>${(underKg/totKg*100).toFixed(0)}% of your volume</b> has gone below ${fmt0(floorPrice(12))}/unit, the total that clears even the ${flB}% wholesale floor against today's ${fmt(rc)}/unit replacement cost. Retail is held to ${PRICE.floorPct.retail}%. `
   +`That is the gap between what you have been charging and what the shelf now costs.`;
}

    const mar=(wbDir==='SELL'&&price>0)?` &middot; margin <b>${((price-replCost())/price*100).toFixed(0)}%</b> on ${fmt(replCost())}/unit replacement <span style="color:var(--dim)">(${((price-costBasis())/price*100).toFixed(0)}% on the ${fmt(costBasis())}/unit book average)</span>`:'';
    body=`<div style="display:flex;gap:7px;align-items:center;flex-wrap:wrap">`
      +wbPill(st.pay,wbPayCls(st.pay))+wbPill(st.deliv,wbPayCls(st.deliv))+wbPill(st.state,wbStCls(st.state))
      +`<span style="font-size:13px;color:var(--mut)">${price>0?fmt(price)+'/unit':'&mdash;'}${mar}</span></div>`
      +(st.state==='Completed'?`<div class="dsc" style="margin-top:6px">Settles in one &mdash; records as a <b>single line</b>, no movements.</div>`:'')
      +(st.state==='Pending'?`<div class="dsc" style="margin-top:6px">Nothing has moved yet &mdash; recorded as a <b>pending order</b>.</div>`:'');
    if(!(qty>0))errs.push('Quantity must be more than zero.');
    /* a blank total silences the whole pricing pane, because every coach test needs a
       price. Left unguarded it booked a zero-revenue order that still drew real units. */
    if(!(total>0))errs.push('Total must be more than zero &mdash; enter the ringgit before recording.');
    if(cash>total+0.009)errs.push('Cash received cannot exceed the total.');
    if(kgd>qty+0.009)errs.push('Delivered units cannot exceed the order quantity.');
    const free=+(currentStock-defKg).toFixed(2);
    if(wbDir==='SELL'&&kgd>free+0.009)warns.push(`Only ${kg(free)} is free to sell &mdash; short by ${kg(+(kgd-free).toFixed(2))}.`);
    const advKg=price>0?Math.max(0,kgd-cash/price):0;
    /* the cap is on the customer, not the order: count what they already hold unpaid */
    /* an unchosen party must never fall through to whoever happens to be first in the
       roster: that is how a sale gets booked to the wrong person and only shows up in
       an audit weeks later. R2 books to the associate, so the field is genuinely unused
       there and is not required. */
    const r2books=(wbDir==='SELL'&&wbEl('wbAssoc')&&wbEl('wbAssoc').checked&&wbStream==='R2');
    const pv=wbVal('wbParty');
    if(!r2books&&!pv)errs.push(`Choose a ${wbDir==='BUY'?'supplier':'customer'} &mdash; nothing is selected.`);
    if(wbDir==='SELL'&&wbEl('wbAssoc')&&wbEl('wbAssoc').checked&&!wbVal('wbAssocSel'))errs.push('Choose the associate.');
    /* the date is blank by default so it cannot silently carry a stale day */
    if(!wbVal('wbDate'))errs.push('Enter the date &mdash; it is deliberately blank.');
    if(wbDir==='SELL'){
      /* a ban is the one boundary that stops the entry rather than warning about it.
         Payments still go through, because the debt is still being pursued: those are
         recorded as an amendment to his existing order, not as a new sale. */
      if(isBanned(pv)){const b=banOf(pv);
        errs.push(`<b>${ID(pv)} is permanently banned from sale</b> since ${b.since}. Record a payment against his existing order under Amend instead; ${fmt0(b.pursue)} is still being pursued.`);}
      const tot=wbCreditKg(pv,advKg),cap=capForParty(pv);
      if(tot>cap+0.009)warns.push(`Takes this customer to ${kg(tot)} delivered and unpaid, over their ${kg(cap)} credit cap.`);
      /* the Boundaries panel is only worth having if it reaches the moment of the
         trade. A party already in breach is named here, before you record another. */
      const bb=boundaryScan().filter(b=>b.sev==='breach'&&b.who===pv);
      if(bb.length)warns.push(`<b>${ID(pv)} is already in breach</b> on ${bb.map(b=>b.rule.toLowerCase()).join(' and ')}. Clear it before handing over more.`);
      priceCoach(r2books?wbVal('wbDown'):pv,price,qty).forEach(c=>{
        if(c.sev==='err')warns.push(c.msg);        // advisory: a loss-making sale is still a sale you may choose to make
        else if(c.sev==='warn')warns.push(c.msg);
        else goods.push(c.msg);});
    }
  }else if(wbMode==='amend'){
    const o=wbAmendList().find(x=>x.code===wbVal('wbOrder'));
    if(o&&!wbVal('wbKind'))errs.push('Choose what happened to this order.');
    if(o&&!wbVal('wbADate'))errs.push('Enter the date &mdash; it is deliberately blank.');
    if(!o){body='<div class="dsc">Pick an order.</div>';errs.push('Pick an order to amend.');}
    else if(wbASide==='BUY'){
      const t=o.t,sf=wbSoFarBuy(t),ac=wbNum('wbACash'),ak=wbNum('wbAKg'),kind=wbVal('wbKind');
      const now=wbState(t.total,t.qty,sf.cash,sf.kg);

      body=`<div style="display:flex;gap:7px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--mut)">`
        +`<span style="${lbl0()}">Now</span>`+wbPill(now.pay,wbPayCls(now.pay))+wbPill(wbRecvLbl(now.deliv),wbPayCls(now.deliv))+wbPill(now.state,wbStCls(now.state))
        +`<span style="color:var(--dim)">&rarr;</span>`
        +`<span style="${lbl0()}">After</span>`+wbPill(nxt.pay,wbPayCls(nxt.pay))+wbPill(wbRecvLbl(nxt.deliv),wbPayCls(nxt.deliv))+wbPill(nxt.state,wbStCls(nxt.state))
        +`</div><div style="font-size:13px;color:var(--mut);margin-top:6px">${o.code} &middot; lot from ${ID(t.who)} &middot; ${kg(t.qty)} for ${fmt0(t.total)} at ${fmt(t.qty>0?t.total/t.qty:0)}/unit &mdash; ${fmt0(sf.cash)} paid, ${kg(sf.kg)} received so far.</div>`;
      const outRM=+(t.total-sf.cash).toFixed(2),outKg=+(t.qty-sf.kg).toFixed(2);
      if(kind==='Payment'){
        if(ac<=0.009)errs.push('A payment needs cash.');
        if(ac>outRM+0.009)errs.push(`Only ${fmt0(outRM)} is outstanding on ${o.code}.`);
        if(ak>0.009)warns.push('Units are ignored on a payment &mdash; use Receipt to book an arrival.');
      }else if(kind==='Receipt'){
        if(ak<=0.009)errs.push('A receipt needs units.');
        if(ak>outKg+0.009)errs.push(`Only ${kg(outKg)} is still to arrive on ${o.code}.`);
        if(ac>0.009)warns.push('Cash is ignored on a receipt &mdash; use Payment to book money out.');
      }else if(kind==='Default'){
        warns.push(`Marks the lot as never delivered: the ${fmt0(sf.cash)} already paid becomes a recoverable, not stock, and the lot leaves the cost basis.`);

      const now=wbState(t.total,t.qty,sf.cash,sf.kg),nxt=wbState(t.total,t.qty,sf.cash+ac,sf.kg+ak);
      body=`<div style="display:flex;gap:7px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--mut)">`
        +`<span style="${lbl0()}">Now</span>`+wbPill(now.pay,wbPayCls(now.pay))+wbPill(now.deliv,wbPayCls(now.deliv))+wbPill(now.state,wbStCls(now.state))
        +`<span style="color:var(--dim)">&rarr;</span>`
        +`<span style="${lbl0()}">After</span>`+wbPill(nxt.pay,wbPayCls(nxt.pay))+wbPill(nxt.deliv,wbPayCls(nxt.deliv))+wbPill(nxt.state,wbStCls(nxt.state))
        +`</div><div style="font-size:13px;color:var(--mut);margin-top:6px">${o.code} &middot; ${ID(t.who)} &middot; ${kg(t.qty)} for ${fmt0(t.total)} &mdash; ${fmt0(sf.cash)} paid, ${kg(+sf.kg.toFixed(2))} delivered so far.</div>`
        +((wbVal('wbADate')===t.date)?`<div class="dsc" style="margin-top:6px">Same day as the order &mdash; this <b>folds into the opening</b> as one transaction rather than a separate movement.</div>`:'');
      const outRM=+(t.total-sf.cash).toFixed(2),outKg=+(t.qty-sf.kg).toFixed(2);
      if(ac>outRM+0.009)warns.push(`Cash moved exceeds the ${fmt0(outRM)} outstanding on ${o.code}.`);
      if(ak>outKg+0.009)warns.push(`Salt moved exceeds the ${kg(outKg)} outstanding on ${o.code}.`);
      if(ac<=0.009&&ak<=0.009&&wbVal('wbKind')==='Fulfilment')warns.push('Nothing moves on this step.');
      if(wbVal('wbKind')==='Modification'){
        if(ac<=0.009&&ak<=0.009)warns.push('A modification restates the order, so it needs the NEW total and the NEW quantity, not zero.');
        else if(ak<sf.kg-0.009||ac<sf.cash-0.009)warns.push('The new terms are smaller than what has already moved on this order, so it would read as over-delivered or over-paid. Check the figures.');
      }
      /* the same boundaries the register holds, checked before the entry is made */
      const pr=txPrice(t);
      if(pr>0){
        const nowOwed=Math.max(0,(t.deliveredQty||0)-txPaid(t)/pr);
        const nextOwed=Math.max(0,((t.deliveredQty||0)+ak)-(txPaid(t)+ac)/pr);
        const tot=+(wbCreditKg(t.customer,0)-nowOwed+nextOwed).toFixed(2),acap=capForParty(t.customer);
        if(tot>acap+0.009)warns.push(`Takes this customer to ${kg(tot)} delivered and unpaid, over their ${kg(acap)} credit cap.`);
      }
      if(ak>0.009){const fr=+(currentStock-defKg).toFixed(2);
        if(ak>fr+0.009)warns.push(`Only ${kg(fr)} is free to sell &mdash; short by ${kg(+(ak-fr).toFixed(2))}.`);}
      if(ac>0.009){
        const older=sales.filter(s=>s.customer===t.customer&&ovKey(s)!==ovKey(t)&&txAdvance(s)>0.009&&s.date<t.date);
        if(older.length)warns.push(`This customer still owes ${fmt0(older.reduce((a,s)=>a+txAdvance(s),0))} on an older order, so at commit this cash may clear that instead of this one.`);}

  }else if(wbMode==='loss'){
    const el=wbEl('wbLossKg'),w=wbNum('wbLossKg'),has=el&&el.value!=='';
    const why=wbVal('wbLossWhy'),atCost=+(w*wavgBuy).toFixed(2);

      +(px>0?`<div class="dsc" style="margin-top:6px">At the ${fmt(replCost())}/unit replacement cost that order would have carried about <b>${fmt0((px-replCost())*w)}</b> of margin. ${px<floorPrice(w)?`It was <b>below</b> the ${fmt0(floorPrice(w))}/unit floor for ${BAND_LABEL[sizeBand(w)]}, so turning it away may have been right.`:`It <b>cleared</b> the ${fmt0(floorPrice(w))}/unit floor for ${BAND_LABEL[sizeBand(w)]}, so this is a real loss.`}</div>`:'')
      +`</div>`;
    if(!has||!(w>0))errs.push('Enter the units they wanted.');
    if(!wbVal('wbLostDate'))errs.push('Enter the date &mdash; it is deliberately blank.');
  }else if(wbMode==='contact'){
    const who=wbVal('wbCtParty'),out=wbVal('wbCtOut'),how=wbVal('wbCtHow'),next=wbVal('wbCtNext');
    const cs2=custStats().find(c=>c.id===who);
    body=`<div style="font-size:13px;color:var(--mut)">${who?`You <b style="color:var(--ink)">${CONTACT_HOW[how]}</b> <b style="color:var(--ink)">${ID(who)}</b> and they <b style="color:var(--ink)">${CONTACT_OUT[out]}</b>${next?`; next due <b style="color:var(--ink)">${next}</b>`:''}.`:'Choose a customer.'}`
      +(cs2?`<div class="dsc" style="margin-top:6px">${ID(who)} last ordered <b>${dbet(cs2.last)} days</b> ago, ${cs2.n} order${cs2.n===1?'':'s'} for <b>${fmt0(cs2.rev)}</b> in total.</div>`:'')
      +`</div>`;
    if(!who)errs.push('Choose a customer.');
    if(!wbVal('wbCtDate'))errs.push('Enter the date &mdash; it is deliberately blank.');
  }else{
    const el=wbEl('wbCountKg'),w=wbNum('wbCountKg'),has=el&&el.value!=='';
    const diff=+(w-currentStock).toFixed(2);
    body=`<div style="font-size:13px;color:var(--mut)">Counted stock now <b style="color:var(--ink)">${kg(currentStock)}</b>`
      +(has?` &middot; new count <b style="color:var(--ink)">${kg(w)}</b> &middot; difference <b style="color:${diff<0?'var(--crim)':diff>0?'var(--grn)':'var(--mut)'}">${diff>0?'+':''}${kg(diff)}</b>`:' &middot; enter the units on hand.')+`</div>`;
    if(!has||!(w>=0))errs.push('Enter the units on hand.');
    if(!wbVal('wbCDate'))errs.push('Enter the date of the count &mdash; it is deliberately blank.');
  }
  prev.innerHTML=body;
  if(msgs)msgs.innerHTML=errs.map(wbErr).join('')+warns.map(wbWarn).join('')+goods.map(wbGood).join('');
  if(btn){btn.disabled=errs.length>0;btn.style.opacity=errs.length?'.45':'1';btn.style.cursor=errs.length?'not-allowed':'pointer';}
}
function wbRecord(){

    const useA=!!(wbEl('wbAssoc')&&wbEl('wbAssoc').checked&&wbDir==='SELL');
    let assoc=useA?wbVal('wbAssocSel'):null;
    if(assoc==='__new__')assoc='NEW '+((wbVal('wbAssocNew')||'').trim()||'associate');
    const isR2=useA&&wbStream==='R2';                         // R2 books to the associate, so the top party is unused
    let down=isR2?wbVal('wbDown'):null;
    if(down==='__new__')down=(wbVal('wbDownNew')||'').trim()||'new end customer';
    /* general downsell buyer, name unknown -> that reseller's single -Gen bucket, never a fresh code */
    else if(isR2&&!down&&assoc)down=codeOf(assoc)+'-Gen';
    const party=isR2?null:wbVal('wbParty');
    /* belt and braces behind the disabled button: never book to an unchosen party */
    if(!isR2&&!party){ok.textContent='Choose a party first.';ok.style.color='var(--crim)';return;}
    if(useA&&!assoc){ok.textContent='Choose the associate first.';ok.style.color='var(--crim)';return;}
    if(!date){ok.textContent='Enter the date first.';ok.style.color='var(--crim)';return;}
    let label,nm='';
    if(isR2){label=down||ID(assoc);}                          // the recipient shown is the reseller's end customer
    /* a brand-new party gets a provisional CODE, never a name. Naming happens once, in
       Names & IDs, and the re-key to the proper code is queued from there. */
    else label=codeOf(party);   // the queue file is plaintext: codes only, never names
    const st=wbState(total,qty,cash,kgd);
    const status=st.pay==='Paid'?'paid':st.pay==='Unpaid'?'unpaid':'partial';
    const raw=(wbDir==='SELL'?'Sell ':'Buy ')+kg(qty)+(wbDir==='SELL'?' to ':' from ')+label+' for '+fmt0(total)+' on '+date
      +' — '+fmt0(cash)+' cash, '+kg(kgd)+' moved → '+st.state
      +(useA?(isR2?' (R2 via '+ID(assoc)+')':' (R3 referred by '+ID(assoc)+')'):'')+(note?' — '+note:'');
    queue.push({at:new Date().toISOString(),type:wbDir,party:label,qty:qty,total:total,status:status,raw:raw,
      payload:{mode:'new',product:wbProdVal(),direction:wbDir,party:party,newId:null,
        date:date,qty:qty,total:total,cash:cash,kg:kgd,assoc:assoc,stream:useA?wbStream:null,downstream:down,kind:null,orderCode:null,linkTo:null,note:note||null}});
    ['wbQty','wbTotal','wbNote','wbDownNew'].forEach(id=>{const e=wbEl(id);if(e)e.value='';});
    ['wbCash','wbKg'].forEach(id=>{const e=wbEl(id);if(e)e.value='0';});
    const nb=wbEl('wbNewBox');if(nb)nb.style.display='none';
    /* clear the party after every record: the next entry must be chosen deliberately,
       so a second sale cannot inherit the first one's buyer */
    const ps=wbEl('wbParty');if(ps)ps.value='';
    const dsel=wbEl('wbDown');if(dsel)dsel.value='';
    /* the associate survived a record and the stream sat on R2 by default, so the next
       sale could be credited to an associate never re-chosen -- silently, in R3, since
       that path still asks for a buyer. Both are cleared and the box re-closed. */
    const ach=wbEl('wbAssoc');if(ach)ach.checked=false;
    const asel=wbEl('wbAssocSel');if(asel)asel.value='';
    const abox=wbEl('wbAssocBox');if(abox)abox.style.display='none';
    const lt=wbEl('wbLinkTo');if(lt)lt.value='';
  }else if(wbMode==='amend'){

    const t=o.t,kind=wbVal('wbKind'),date=wbVal('wbADate'),ac=wbNum('wbACash'),ak=wbNum('wbAKg'),an=(wbVal('wbANote')||'').trim();

      const raw=kind+' on '+o.code+' · lot from '+codeOf(t.who)+' — '+fmt0(ac)+' paid and '+kg(ak)+' received on '+date

          kind:kind,orderCode:o.code,linkTo:null,sameDay:(date===t.date),note:an||null}});

      const isMod=(kind==='Modification');

      const status=(kind==='Modification'||kind==='Cancellation')?'modified':(nxt.pay==='Paid'?'paid':nxt.pay==='Unpaid'?'unpaid':'partial');
      const sameDay=(date===t.date);         // settled the same day -> fold into the opening, not a movement
      const raw=isMod
        ? kind+' on '+o.code+' · '+codeOf(t.who)+' — order restated to '+kg(ak)+' for '+fmt0(ac)
          +' on '+date+' (was '+kg(t.qty)+' for '+fmt0(t.total)+') → '+nxt.state+(an?' — '+an:'')
        : kind+' on '+o.code+' · '+codeOf(t.who)+' — '+fmt0(ac)+' and '+kg(ak)+' moved on '+date+' → '+nxt.state

      queue.push({at:new Date().toISOString(),type:'AMEND',party:codeOf(t.who),qty:ak,total:ac,status:status,raw:raw,

          assoc:null,downstream:null,kind:kind,orderCode:o.code,linkTo:linkTo,sameDay:sameDay,note:an||null},

  }else if(wbMode==='loss'){

    queue.push({at:new Date().toISOString(),type:'LOSS',party:'self-use',qty:w,total:null,status:'count',

/* THE FIELDS MEAN DIFFERENT THINGS FOR DIFFERENT KINDS (v177), and saying so is the fix.
   A Fulfilment MOVES money and salt, so its numbers are added to what has moved already.
   A Modification RESTATES THE ORDER: the numbers are its new total and new quantity, not
   a movement. The form used to add them either way, so amending an order down to 2 unit
   at RM185 was read as 2 unit handed over against a still-5-unit order, and the preview
   said "moved" about salt that had not. The kind now drives the labels and the wording. */
function wbAmendLabels(){
  const cl=wbEl('wbACashLbl'),kl=wbEl('wbAKgLbl'),k=wbVal('wbKind');
  if(!cl||!kl)return;

  if(k==='Modification'){cl.textContent='NEW total (RM)';kl.textContent='NEW quantity (unit)';return;}
  if(k==='Cancellation'){cl.textContent='Cash returned (RM)';kl.textContent='Salt returned (unit)';return;}
  cl.textContent='Cash moved (RM)';kl.textContent='Salt moved (unit)';
}

/* ============ QUEUE HAND-OFF ============
   A page cannot write to disk on its own, so the queue leaves by whichever route
   the way this desk was opened allows:
     served (start_desk.bat)  -> POST it to the local server, which writes the file.
                                 No permission prompt, no clutter: one salt_queue.json,
                                 overwritten each time, read by the daily run.
     double-clicked (file://) -> download salt_queue.json to the download folder.
                                 Each file holds the whole queue, so the newest wins.
   Copy queue is the manual fallback in both cases. */
const QFILE='salt_queue.json';
let qSyncState='download';                  // server | download | clipboard
function qPayload(){return JSON.stringify({updated:new Date().toISOString(),desk:LAST_UPDATED,device:(typeof saltDeviceId==='function'?saltDeviceId():'anon'),queue},null,1);}
/* ask the local server whether it accepts the queue; only meaningful when served */
async function qInit(){
  if(location.protocol==='file:')return;
  try{ const r=await fetch('queue/ping',{cache:'no-store'});
    const j=r.ok?await r.json():{}; if(j.ok){qSyncState='server';window.SALT_CLOUD=!!j.cloud;renderQueue();qStatus(qNote());renderRole(); if(j.cloud){ await vaultLoad(); if(queue&&queue.length){qPost();} } else { await vaultLoad();await bioLoad();qHeartbeat(); } }
  }catch(e){}
}
/* ---- HEARTBEAT (v181) -----------------------------------------------------
   The server stops about ten seconds after the desk is closed, and this is the half that
   makes that safe. A ten-second limit on its own would also kill a server while the desk
   was still open, because browsers throttle timers in a BACKGROUND tab to roughly once a
   minute: a desk sitting behind another window would miss every beat and look shut.

   So the beat reports what the page is doing, and the server keeps two limits.
     visible  beating every 3s, so ten seconds of silence really does mean gone
     hidden   throttling is expected, so a long limit applies and nothing is inferred
   Switching to another tab therefore cannot kill it, and coming back beats immediately
   rather than waiting for the next tick.

   A REAL CLOSE does not wait for any limit: pagehide fires a sendBeacon to /bye, which
   survives the page going away where a normal fetch is cancelled mid-flight, and the
   server stops on its next one-second tick. The limits are only the fallback for a
   browser that never fires the event.

   ONE GUARD WORTH ITS LINE: pagehide also fires when a page goes into the back/forward
   cache, which is a navigation and not a close. event.persisted tells them apart, so a
   bfcache suspend no longer shuts the server on him. */
let qBeat=null;
function qHeartbeat(){
  if(qBeat||qSyncState!=='server')return;
  const beat=()=>{
    const st=(typeof document.visibilityState==='string')?document.visibilityState:'visible';
    fetch('queue/ping?state='+(st==='visible'?'visible':'hidden'),{cache:'no-store'}).catch(()=>{});
  };
  qBeat=setInterval(beat,3000);
  beat();
  /* coming back into view: say so at once rather than on the next tick */
  document.addEventListener('visibilitychange',beat);
  window.addEventListener('pagehide',ev=>{
    if(ev&&ev.persisted)return;              // bfcache, not a close
    try{
      if(navigator.sendBeacon)navigator.sendBeacon('bye','');
      else fetch('bye',{cache:'no-store',keepalive:true}).catch(()=>{});
    }catch(e){}
  });
}
/* ---- name vault, same route ----------------------------------------------
   Only the ENCRYPTED envelope travels: the passphrase never leaves the browser
   and is never stored. Held in its own file so the desk itself carries no name
   data and can be shared or screenshotted freely. */
async function vaultLoad(){
  if(qSyncState!=='server')return false;
  try{ const r=await fetch('vault',{cache:'no-store'}); if(!r.ok)return false;
    const j=await r.json(); if(!j.ok)return false;
    vaultFileStamp=j.updated||null;
    if(j.vault){
      if(vaultFromBrowser){                        // never let the file overwrite the live copy
        vaultFileDiffers=JSON.stringify(j.vault)!==JSON.stringify(NAME_VAULT);
      }else{NAME_VAULT=j.vault;vaultLocalStamp=vaultFileStamp;}
    }
    /* ids are canonical: a roster id always maps to itself, whatever the file says.
       Accepting a file's ids wholesale re-opened the v87 unlock-renamed-everything
       bug through salt_vault.json; only NON-roster keys may come from the file. */
    if(j.ids){const merged={};roster.forEach(id=>{merged[id]=id;});
      Object.keys(j.ids).forEach(k=>{if(!(k in merged))merged[k]=j.ids[k];});newIds=merged;}
    if(j.locs&&Object.keys(j.locs).length)newLocs=j.locs;
    render(); if(typeof renderReveal==='function')renderReveal();
    return true;
  }catch(e){ return false; }
}
async function vaultSave(){
  if(qSyncState!=='server')return false;               // double-clicked: localStorage only, export by hand
  try{ const r=await fetch('vault',{method:'POST',headers:qHeaders(),
      body:JSON.stringify({updated:(vaultLocalStamp=new Date().toISOString()),vault:NAME_VAULT,ids:newIds,locs:newLocs})});
    return r.ok&&(await r.json()).ok;
  }catch(e){ return false; }
}
/* THE WRITE KEY (v288). The cloud desk is public to read by decision, but a stranger with
   the URL could POST into the queue and the daily run would fold it in as real rows. So a
   write carries X-Salt-Key, held on this device only and asked for once. The laptop server
   ignores the header entirely, and the Worker ignores it until its secret is set, so this
   is inert on both until the day it is armed. The key is NOT a password on the ledger: it
   stops writes, and anyone with the URL can still read the book. */
function saltWriteKey(){ try{ return localStorage.getItem('saltWriteKey')||''; }catch(e){ return ''; } }
function saltAskWriteKey(){
  try{ const k=prompt('This desk needs its write key before it can save an entry.\n\nIt is asked for once and kept on this device.');
    if(k){ localStorage.setItem('saltWriteKey',k); return k; }
  }catch(e){}
  return '';
}
function qHeaders(){
  const h={'Content-Type':'application/json'}, k=saltWriteKey();
  if(k)h['X-Salt-Key']=k;
  return h;
}
async function qPost(){
  try{ let r=await fetch('queue',{method:'POST',headers:qHeaders(),body:qPayload()});
    /* 401 means the gate is armed and this device has no key, or the wrong one. Ask, then
       try once more. Once only: a wrong key looping would just ask for ever. */
    if(r.status===401&&saltAskWriteKey()){ r=await fetch('queue',{method:'POST',headers:qHeaders(),body:qPayload()}); }
    if(r.status===401){ qStatus('<b style="color:var(--crim)">The write key was not accepted</b> &mdash; the entry is held on this device. Reopen the desk to try again.'); return false; }
    if(!r.ok)throw new Error('server replied '+r.status);
    const j=await r.json();
    qStatus(window.SALT_CLOUD?('Pushed to the cloud queue &mdash; '+j.entries+' waiting for the daily run.'):('Saved <b>'+QFILE+'</b> to this folder &mdash; '+j.entries+' queued.'));
    return true;
  }catch(e){
    /* the server was there at load and is gone now: do not keep pretending.
       Fall back to the download route so nothing sits invisibly in the browser. */
    if(window.SALT_CLOUD){qStatus('<b style="color:var(--amber)">No signal</b> &mdash; held on this device; it syncs on the next open with a connection.');return false;} qSyncState='download'; qStatus('<b style="color:var(--amber)">The desk server stopped answering</b> &mdash; falling back to downloads. Restart start_desk.bat for in-place saves.');
    renderQueue();
    return false; }
}
function qDownload(){
  try{ const url=URL.createObjectURL(new Blob([qPayload()],{type:'application/json'}));
    const a=document.createElement('a');a.href=url;a.download=QFILE;a.style.display='none';
    document.body.appendChild(a);a.click();
    setTimeout(()=>{try{URL.revokeObjectURL(url);a.remove();}catch(e){}},1500);
    return true;
  }catch(e){ qStatus('Could not save the file: '+(e&&e.message||e)+' Use Copy queue instead.'); return false; }
}
async function qClip(){
  const txt=queue.map(q=>q.raw).join('\n');
  try{ await navigator.clipboard.writeText(txt); qStatus('Copied to the clipboard &mdash; paste it into the chat to commit.'); }
  catch(e){ qStatus('Clipboard blocked. Copy the lines from the table below.'); }
}
function qStatus(msg){const e=document.getElementById('wbSync');if(e)e.innerHTML=msg;}
function qNote(){
  if(qSyncState==='server'&&window.SALT_CLOUD)return 'Record pushes each entry to the cloud queue. The daily run folds it into the source; nothing else to do. <b>Copy queue</b> still puts the lines on the clipboard.';
  if(qSyncState==='server')return 'Record saves straight to <b>'+QFILE+'</b> in this folder, which the daily run reads. Nothing else to do. <b>Save queue file</b> writes it again on demand and <b>Copy queue</b> puts the lines on the clipboard.';
  if(location.protocol!=='file:')return '<b style="color:var(--amber)">The desk server is not answering</b>, so Record downloads <b>'+QFILE+'</b> to your download folder instead. Restart <b>start_desk.bat</b> to save in place again.';
  return 'Opened directly, so Record downloads <b>'+QFILE+'</b> to your download folder. Each file holds the whole queue, so the newest wins and older copies can be deleted. Open the desk with <b>start_desk.bat</b> instead and it saves in place, with nothing to tidy.';}
function qLabel(){return qSyncState==='server'?'saved to '+QFILE+' in this folder'
  :qSyncState==='download'?'saved as '+QFILE+' in the download folder'
  :'<b style="color:var(--amber)">held in this browser only</b> &mdash; use Copy queue';}
function qFlush(){ return qSyncState==='server'?qPost():qDownload(); }
function saveQueue(){try{localStorage.setItem('saltQueue',JSON.stringify(queue));}catch(e){}
  // ALWAYS write, even an emptied queue: the newest file wins, so a stale earlier
  // download must be superseded or cleared entries would be re-committed at 9pm.
  return qFlush();}
/* ============ RENDER A TAB ONCE PER PRODUCT (v262) ============
   THE SWITCHER WAS A FILTER AND THAT WAS THE FAULT. A shelf, a cost basis and a price board
   cannot be added across products: 32 unit of salt plus 45 of oil is not 77 of anything. So
   those tabs are not consolidated, they are REPEATED, once per product, each block headed by
   the product it belongs to. Nothing is hidden and nothing is nonsense.
   IT RESTORES WHAT IT BORROWED. PROD is a global that recompute() reads, so this sets it,
   builds, and puts it back with a final recompute; a builder that left the desk scoped to the
   last product in the list would silently reprice every figure drawn after it. */
function perProduct(builder,opts){
  opts=opts||{};
  const keep=PROD, out=[];
  PROD_IDS.forEach(pr=>{
    if(opts.skipEmpty){const S=pSales(pr),B=pPurch(pr);if(!S.length&&!B.length)return;}
    PROD=pr; recompute();
    const P=PRODUCTS[pr];
    out.push(`<div class="prodblock" data-prod="${pr}"><div class="prodhd">`
      +`<span class="pd" style="background:${P.accent}"></span>${esc(P.name)}`
      +(opts.sub?`<span class="sub">${opts.sub()}</span>`:'')
      +`<span class="rule"></span></div>${builder()}</div>`);
  });
  PROD=keep; recompute();
  return out.join('');
}
/* the two books added together, for the surfaces where addition is meaningful: money */
function consoMoney(){
  const rows=PROD_IDS.map(p=>Object.assign({id:p,name:PRODUCTS[p].name},prodSummary(p)));
  const sum=k=>rows.reduce((a,r)=>a+(r[k]==null?0:r[k]),0);
  const anyNull=k=>rows.some(r=>r[k]==null);
  return {rows:rows,rev:sum('rev'),cash:sum('cash'),spend:sum('spend'),
          cogs:anyNull('cogs')?null:sum('cogs'),margin:anyNull('margin')?null:sum('margin')};
}
function consoBlock(){
  const C=consoMoney();
  const cell=(l,v,n)=>`<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="n">${n}</div></div>`;
  const split=k=>C.rows.map(r=>codeOfProd(r.id)+' '+(r[k]==null?'&mdash;':fmt0(r[k]))).join(' &middot; ');
  return `<div class="conso"><div class="kpis k4">`
    +cell('Revenue, both products',fmt0(C.rev),split('rev'))
    +cell('Collected',fmt0(C.cash),split('cash'))
    +cell('Gross margin',C.margin==null?'&mdash;':fmt0(C.margin),C.margin==null?'a product has an uncosted row':split('margin'))
    +cell('Spent on stock',fmt0(C.spend),split('spend'))
    +`</div></div>`;
}
const codeOfProd=id=>esc((PRODUCTS[id]&&PRODUCTS[id].name)||id);
/* v275: SAY WHICH BOOK YOU ARE LOOKING AT. Today, Forward and Overview are drawn ONCE, at
   the active product, while their own lead lines claim the whole desk. The v228 comment
   asserted the switcher scoped them; the builders map never wrapped them, and v262 turned
   the switcher into a jump button, so the scope only ever moves when localStorage says so.
   Rather than stack every product onto the command tabs, which would bury the one thing
   Today exists to say, the tabs now state their scope and name the other books.
   Generated from PROD_IDS, so a third product appears in the sentence by being declared. */
function prodBadge(){
  const P=PRODUCTS[PROD]||{name:PROD};
  const others=PROD_IDS.filter(x=>x!==PROD).map(x=>`<button class="navlink" style="padding:3px 8px;font-size:11px" onclick="setProdView('${x}')">${esc(PRODUCTS[x].name)}</button>`).join(' ');
  return `<span class="pbadge"><span class="pd" style="background:${P.accent}"></span>${esc(P.name)}</span>`
    +(others?`<span class="pbadgeo">other books: ${others}</span>`:'');
}
/* the switcher jumps to a block on the tabs that draw every product; on the three that draw
   only one, it has to actually change the scope and redraw. */
function setProdView(pr){
  if(!PRODUCTS[pr])return;
