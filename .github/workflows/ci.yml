# CI, added 20 Aug 2026 when the master moved into this repo.
#
# WHAT THIS IS FOR, STATED NARROWLY. It does not fold anything and it does not deploy. It is
# the deterministic half of the arrangement: the cloud agent does the judgement, and this
# proves afterwards that the mechanical facts still hold. The failures it is aimed at are the
# ones this repo has actually hit, both of them silent:
#
#   - a build that ships but does not match the master it claims to come from
#   - a ledger left out of date order, or a version in the master with no changelog entry
#
# It runs with NO SECRETS by design. A workflow that can deploy is a workflow that can deploy
# by accident, and the deploy already has an owner.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    # BOUNDED (26 Sep 2026): the longest run seen took 8.1 min; GitHub's default is six hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5      # v5 runs on Node 24; v4 targeted the retired Node 20 (09 Sep 2026)

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # FIRST, because a workflow that cannot parse runs nothing and CI stayed green while
      # cloud-commit.yml was dead for seven minutes on 20 Aug.
      - name: The workflows themselves parse
        run: node tools/lint-workflows.mjs

      - name: The book is in date order
        run: node tools/sort-ledger.mjs --check

      - name: The master's version is in the changelog
        run: node tools/changelog.mjs --check

      # THE ENGINE IN THE MASTER IS THE MODULE (v337). The desk carries engine/pricing.mjs inlined
      # between markers because it must load nothing; this proves the copy is the file, so there
      # is one pricing engine and not one plus a copy drifting from it.
      - name: The engine in the master is the module
        run: node tools/engine.mjs --check

      # THE BOOK IN THE MASTER IS THE FILE (v339). ledger/book.json is the source of the book; the
      # desk carries a generated copy between markers. This proves the copy is the file.
      - name: The book in the master is ledger/book.json
        run: node tools/booksync.mjs --check

      # THE GEOGRAPHY IN THE MASTER IS THE FILES (v349). geo/basemap.json holds the drawn outlines
      # with their provenance and geo/places.json the gazetteer; the desk carries both inlined.
      # Same rule as the engine and the book: the copy is proved, never trusted.
      - name: The geography in the master is the files in geo/
        run: node tools/geosync.mjs --check

      # THE DESIGN IN THE MASTER IS THE FILES (v472). design/salt-ds.css is the design system's
      # stylesheet vendored from Code/salt-ds, design/desk.css the desk's own layer over it; the
      # master carries both at the foot of its <style>. Same rule again: the copy is proved.
      - name: The design in the master is design/salt-ds.css and design/desk.css
        run: node tools/designsync.mjs --check

      # THE STATEMENT STYLESHEET THE SITE SERVES IS THE ONE THE GENERATOR WRITES. The landing
      # page is served by the statements Worker, which has no filesystem, so it cannot read
      # design/salt-ds.css the way tools/stmt-style.mjs does; stmt/statement-css.js is that
      # stylesheet baked flat. Same rule as the four checks above: the copy is proved, never
      # trusted, so a retune of the design system cannot leave a customer's page behind.
      - name: The statement stylesheet the Worker serves is the one the generator writes
        run: node tools/stmt-style.mjs --check

      # AND THE SITE'S QR ENCODER IS THE ONE ENCODER. The statements Worker draws a QR for each
      # guest referral link and may import only a sibling, so engine/qr.mjs is carried into
      # stmt/qr.js verbatim. Same rule again: the copy is proved rather than trusted, because two
      # encoders drift exactly as two pricing engines would.
      - name: The site's QR encoder is engine/qr.mjs
        run: node tools/qrsync.mjs --check

      # AND THE BRAND FACES THE SITE SERVES ARE THE DESIGN SYSTEM'S FILES. The Worker serves no
      # files, so the two woff2 in design/fonts/ ride in stmt/fonts.js as bytes (22 Sep 2026).
      - name: The site's fonts are design/fonts, as bytes
        run: node tools/stmt-fonts.mjs --check

      # ONE SUITE RUN PER LAPTOP PUSH (26 Sep 2026). cloud-commit.yml runs the same `npm test` on the
      # same runner image after the phone is live, on every push touching its paths, so on such a
      # push this suite was a second run of the same thing. This step asks the compare API what the
      # push changed and says whether cloud-commit is testing it; Tests alone stands down. Every
      # other check here still runs, because they are the net when cloud-commit is refused. The
      # pattern is cloud-commit's on.push.paths exactly (`**` is `.*`), and the suite holds the two
      # lists together. It fails toward running: a first push, a compare that errors, or a push of
      # 300 files or more (the API's cap) reads as not covered. The token is the run's own, read only.
      - name: Is cloud-commit testing this push?
        id: chain
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          covered=0
          if [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            files=$(gh api "repos/$REPO/compare/$BEFORE...$SHA" --paginate --jq '.files[]?.filename') || files=""
            n=$(grep -c . <<< "$files" || true)
            if [ "$n" -lt 300 ] && grep -Eq '^(public/rev\.json|statements/.*|stmt/.*|wrangler\.stmt\.jsonc|tools/stmt-publish\.mjs|tools/make_statements\.mjs)$' <<< "$files"; then covered=1; fi
          fi
          echo "covered=$covered" >> "$GITHUB_OUTPUT"
          echo "cloud-commit tests this push: $covered"

      - name: Tests
        if: steps.chain.outputs.covered != '1'
        run: npm test

      # THE COMMITTED BUILD MATCHES THE MASTER, JUDGED BY THE ID AND NOT BY THE BYTES.
      # public/desk.html, public/data.json and public/rev.json are committed on purpose so the
      # data lives in the repo, and that is only worth anything if they correspond to the
      # master beside them.
      #
      # BUT A PLAIN `git diff -- public/` IS THE WRONG TEST AND FAILS EVERY TIME. rev.json
      # carries `built` and data.json carries `generated`, both wall-clock stamps, so two
      # builds of an identical master differ in bytes a second apart. The repo already learned
      # this on the deploy side on 10 Aug: "a deploy is decided by rev.json.id against
      # .deployed.json.id, NEVER by hashing the build output before and after". Same fault,
      # same fix. The id hashes the master, the app, the service worker and every src/*.js,
      # which is the question actually being asked.
      - name: The committed build matches the master
        run: |
          set -euo pipefail
          before=$(node -p "require('./public/rev.json').id")
          npm run build
          after=$(node -p "require('./public/rev.json').id")
          if [ "$before" != "$after" ]; then
            echo "::error::public/ is not what this master builds (committed $before, rebuilt $after). Run 'npm run build' and commit the result."
            exit 1
          fi
          # Everything except the two timestamps must be byte-identical.
          if ! git diff --quiet -- public/desk.html public/sw.js; then
            echo "::error::the built desk differs from the committed one. Run 'npm run build' and commit."
            git --no-pager diff --stat -- public/desk.html public/sw.js
            exit 1
          fi
          echo "public/ matches the master at $after."
