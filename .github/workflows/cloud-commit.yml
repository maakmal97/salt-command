# THE CHAIN, IN ONE JOB. Rewritten 08 Sep 2026 (v520, Part A step 2 of his instruction of the
# same day: everything within a minute of a tap on Approve, with a literal end-to-end check).
#
# WHY ONE JOB. Until v519 this was three jobs: stage (D1 to master/_to_fold.json), fold (the
# agent, in the same run) and deploy (a SECOND run, started by the agent's push). Each job
# started its own machine, checked out and installed, and the deploy waited for a push event to
# be picked up. Measured on the CJ4-BJ approval of 07 Sep: about 45 seconds of job boundaries
# and 15 seconds of push-to-run on an 8-minute chain. One job does the checkout and install
# once, and the deploy follows the fold in the same workspace without waiting for anything.
#
# WHAT IS UNCHANGED. The credential does the mechanical things (read D1, deploy, mark
# committed); the JUDGEMENT stays with the agent, which writes the notes and the version
# entry. The stage still refuses to trample an unfolded batch. The deploy still proves the
# phone is serving the build before any row is marked committed. The hourly net and the
# daily ship check stand.
#
# THE FOLD IS ONE CALL (v521, step 3): tools/foldcall.mjs builds the dossier, asks Claude once
# for the notes, checks them and folds with fold.mjs. The job then pushes as the runner, which
# starts no second run. "Already serving?" below stays as a guard: a push of the statements
# alone deploys nothing, and a build the phone already has is never deployed twice.
#
# SETUP, AND IT IS THE ONE THING ONLY HE CAN DO:
#   gh secret set CLOUDFLARE_API_TOKEN     Workers Scripts:Edit, Workers KV:Edit, D1:Edit
#   gh secret set ANTHROPIC_API_KEY          (the fold's one call; CLAUDE_CODE_OAUTH_TOKEN is no longer read here)
#   npx wrangler secret put SALT_GITHUB_TOKEN    (the Worker's dispatch on every approval)
name: Cloud commit

on:
  schedule:
    # HOURLY NET. Stages and folds anything an approval's dispatch missed. The clock is not
    # the guard: the guard is in the job, which refuses to overwrite an unfolded batch.
    - cron: '5 * * * *'
  push:
    branches: [master]
    paths:
      - 'public/rev.json'
      # A statements commit never moves the build id; it deploys on its own paths (03 Sep 2026).
      - 'statements/**'
      - 'stmt/**'
      - 'wrangler.stmt.jsonc'
      - 'tools/stmt-publish.mjs'
      - 'tools/make_statements.mjs'
  workflow_dispatch:
    inputs:
      # THE WORKER DISPATCHES THIS ON EVERY APPROVAL with stage_only set. Since v520 a run that
      # folds also deploys in the same job; stage_only now means "do not deploy when nothing
      # was folded", which is what a double tap or an empty batch should do.
      stage_only:
        description: 'Stage the approved rows; deploy only if something was folded'
        type: boolean
        default: false
      test_push:
        description: 'Send a test push, even with no fold in this build'
        type: boolean
        default: false
      probe_key:
        description: 'Prove the fold key with one cheap call, then stop'
        type: boolean
        default: false

concurrency:
  group: cloud-commit
  cancel-in-progress: false

jobs:
  chain:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5      # v5 runs on Node 24; v4 targeted the retired Node 20 (09 Sep 2026)
        with: { ref: master }
      - uses: actions/setup-node@v5
        with: { node-version: '24', cache: npm }
      - run: npm ci

      - name: The credential exists
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set. Run: gh secret set CLOUDFLARE_API_TOKEN"
            exit 1
          fi

      # THE FOLD'S KEY, PROVED WHERE IT IS USED (08 Sep 2026): a dispatch with probe_key asks the
      # API for the fold's model with the repo's secret and stops. Nothing is staged or deployed.
      - name: Probe the fold's key
        if: github.event_name == 'workflow_dispatch' && inputs.probe_key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node tools/foldcall.mjs --probe

      # ---- STAGE: the approved, uncommitted rows out of D1 -------------------------------
      # DO NOT TRAMPLE AN UNFOLDED BATCH. If master/_to_fold.json is still in HEAD, the last
      # fold has not happened (it failed, or it is the batch this tick is about to fold). A
      # batch the fold refused as a replay clears its own handoff (v512): the rows ARE on the
      # book, so the drafts are marked committed, each refusal recorded where the phone shows
      # refusals, and staging carries on.
      - name: Stand down if the last batch is still unfolded
        id: guard
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.probe_key)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "staged=0" >> "$GITHUB_OUTPUT"
          if git cat-file -e HEAD:master/_to_fold.json 2>/dev/null; then
            n=$(git show HEAD:master/_to_fold.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).count")
            if ids=$(node tools/fold.mjs --replays); then
              echo "::notice::The staged batch of $n row(s) is a replay of rows already on the book ($ids): clearing it."
              node tools/drafts.mjs --committed $ids
              for id in $ids; do node tools/drafts.mjs --refused-note "$id" "The fold refused this as a replay: a row with the same party, date, size and total is already on the book, so it was folded once and marked committed."; done
              git config user.name "salt-command stage"
              git config user.email "noreply@github.com"
              git rm -q master/_to_fold.json
              git commit -q -m "The fold refused the staged batch as a replay: $ids"
              git push origin HEAD:master
              echo "skip=0" >> "$GITHUB_OUTPUT"
            else
              echo "::notice::A batch of $n row(s) is staged and not yet folded. Standing down rather than overwriting it; the fold runs on it below."
              echo "skip=1" >> "$GITHUB_OUTPUT"
              echo "staged=1" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Read the approved rows out of D1
        if: (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.probe_key)) && steps.guard.outputs.skip == '0'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node tools/drafts.mjs --approved > master/_to_fold.json
          node -e "
            const j=require('./master/_to_fold.json');
            if(!j.ok) { console.error('::error::drafts.mjs did not report ok'); process.exit(1); }
            console.log('approved and uncommitted: '+j.count);
          "

      # COMMIT IT, AND PROVE IT WAS COMMITTED. `git status --porcelain` sees an untracked file
      # where `git diff --quiet` did not (the first version of this step was silently broken),
      # and the file must be in HEAD afterwards: a healthy log over a dead leg is the fault this
      # repo keeps writing tests for. Staged in HEAD is also the marker the next tick reads if
      # the fold below fails.
      - name: Commit it, and prove it
        id: commit
        if: (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.probe_key)) && steps.guard.outputs.skip == '0'
        run: |
          set -euo pipefail
          echo "staged=0" >> "$GITHUB_OUTPUT"
          count=$(node -p "require('./master/_to_fold.json').count")
          if [ "$count" = "0" ]; then
            echo "Nothing approved is waiting, so nothing is staged."
            rm -f master/_to_fold.json
            exit 0
          fi
          git config user.name  "salt-command CI"
          git config user.email "noreply@github.com"
          git add -f master/_to_fold.json
          if [ -n "$(git status --porcelain -- master/_to_fold.json)" ]; then
            git commit -m "Stage $count approved row(s) for the fold"
            git push
          else
            echo "The staged file is unchanged from the last run."
          fi
          if ! git cat-file -e HEAD:master/_to_fold.json 2>/dev/null; then
            echo "::error::$count row(s) were staged but master/_to_fold.json is not in HEAD. The fold would find nothing and stop, and the rows would sit unfolded."
            exit 1
          fi
          echo "Staged $count row(s) and confirmed the file is in HEAD."
          echo "staged=1" >> "$GITHUB_OUTPUT"

      # ---- THE PLAN FOR THE REST OF THE JOB ---------------------------------------------
      # fold:    something is staged, by this tick or a previous one.
      # deploy:  a push; a dispatch that did not ask to stage only; or any run that folded.
      # publish: EVERY RUN BUT THE PROBE (v701, his question of 18 Sep 2026: can the publish be on
      #          any trigger?). It can, because it needs nothing this job produces: it reads
      #          ledger/book.json and the master out of the checkout, never public/, and the
      #          checkout, setup-node and npm ci above are themselves unconditional. It was gated
      #          on deploy alone and a scheduled tick never set deploy, so on a quiet day the
      #          sealed price lists were never refreshed at all; v698 added the schedule, which
      #          fixed that day and left the same shape of bug in place for the next trigger
      #          nobody thought of. A rule that says WHAT IS EXCLUDED cannot go stale when a
      #          trigger is added. The one exclusion is the key probe, whose whole purpose is one
      #          cheap call and then stop.
      - name: What this run does
        id: plan
        run: |
          fold=0
          if [ "${{ steps.guard.outputs.staged }}" = "1" ] || [ "${{ steps.commit.outputs.staged }}" = "1" ]; then fold=1; fi
          deploy=0
          if [ "${{ github.event_name }}" = "push" ]; then deploy=1; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.stage_only }}" != "true" ] && [ "${{ inputs.probe_key }}" != "true" ]; then deploy=1; fi
          if [ "$fold" = "1" ]; then deploy=1; fi
          publish=1
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.probe_key }}" = "true" ]; then publish=0; fi
          echo "fold=$fold" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "fold=$fold deploy=$deploy publish=$publish"

      # ---- FOLD: the judgement, by one call, in this job (v521) ---------------------------
      # tools/foldcall.mjs plans with fold.mjs, gathers the dossier a person would have looked up
      # (the party's history, the desk's own floor and ask for the size, the drafter's flags, the
      # inventory position), asks Claude once for the notes as JSON, checks them against the house
      # rules and the next version, and folds with fold.mjs --apply. The judgement is still a
      # model's, on the same facts; every refusal rule stays in the tool. The step then builds,
      # tests, commits and pushes as the runner, so no second run starts. A refusal by fold.mjs, a
      # rule the tool will not fold, still leaves the batch staged for a person. A refusal by the
      # MODEL no longer does (22 Sep 2026): no key, a call that will not go through and a reply
      # twice against the house rules all land on tools/foldnotes.mjs, which writes the same notes
      # off the same dossier with no judgement in them and says so where it is read. It is still
      # recorded where the phone shows refusals. The Claude Code action is retired from the job;
      # the manual backup stands.
      - name: Fold
        if: steps.plan.outputs.fold == '1'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # NO KEY IS NO LONGER A STOP (his instruction of 22 Sep 2026). It exited 1 here, and on
          # 22 Sep a credit balance of nothing left two approved rows staged with the deploy, the
          # marks, the mirror, the statements and the suite all behind them. foldcall writes the
          # notes with tools/foldnotes.mjs instead and the fold lands; what is lost is the
          # judgement, and the version entry and every row note say so.
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::warning::ANTHROPIC_API_KEY is not set, so this fold takes the tool's own notes and records no judgement on any row. Set it with: gh secret set ANTHROPIC_API_KEY."
          fi
          if git cat-file -e HEAD:master/_folded.json 2>/dev/null; then
            echo "::notice::master/_folded.json is in HEAD: the last batch is folded and its deploy did not clear it. Nothing is folded until that is resolved."
            exit 0
          fi
          git config user.name  "salt-command fold"
          git config user.email "noreply@github.com"
          node tools/foldcall.mjs
          node tools/ledger.mjs
          npm run build
          node tools/gate.mjs
          v=$(node -p "require('./master/changelog.json')[0].v + ': ' + require('./master/changelog.json')[0].t.toLowerCase()")
          git add -A
          git commit -q -m "$v"
          # master can move while this runs; rebase onto its tip, then push as the runner, which
          # starts no second run.
          git pull -q --rebase origin master
          git push origin HEAD:master
          echo "folded and pushed: $v"

      # ---- DEPLOY: the phone gets the build, and only then are the rows marked ----------
      # ALREADY SERVING? A push of the statements alone, or a re-run, finds the phone already on
      # the build and no fold waiting, and deploys nothing; it republishes the statements only if
      # the push touched them.
      #
      # IT GATES THE DEPLOY AND NOTHING ELSE (10 Sep 2026, his instruction). It used to stand down
      # eight steps, on the assumption that whatever had already put the build on the phone had
      # done the rest of the job too. Cloudflare Workers Builds was reconnected to the repository
      # on his instruction that day and breaks that assumption outright: it deploys the tip of
      # master in about a minute and stops, while this job has a checkout and an npm ci to get
      # through before it reaches this step. A build that wins that race made live=1 here, and the
      # run then skipped the gate, the proof, the marks, the handoff, THE MIRROR RE-SEED and the
      # suite, and still went green. The comment forty lines down calls a stale mirror the silent
      # fault this job exists to end, and this was a road straight to one.
      # So the guard now holds back only the two steps that are about deploying: Gate and Deploy.
      # The six below it run on deploy == '1' alone. Each is already safe without a deploy: the
      # proof step confirms the phone is serving the build whoever put it there, and the marks,
      # the wake and the handoff clear all no-op without master/_folded.json. The fold path never
      # took this road anyway, because a fold leaves _folded.json in HEAD and the second clause
      # below forces live=0; the exposure was the hand push, which is the one a person makes.
      # The cost is a suite run and a re-seed on a push that deployed nothing.
      - name: Already serving?
        id: already
        if: steps.plan.outputs.deploy == '1'
        run: |
          set -euo pipefail
          live=0; stmt=1
          want=$(node -p "require('./public/rev.json').id")
          got=$(curl -fsS --max-time 20 https://salt-command.qyts8mh72kyg.workers.dev/rev | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).id" || echo none)
          if [ "$got" = "$want" ] && ! git cat-file -e HEAD:master/_folded.json 2>/dev/null; then live=1; fi
          if [ "${{ github.event_name }}" = "push" ] && [ "$live" = "1" ]; then
            # THE CHECKOUT IS SHALLOW, SO THE BASE COMMIT HAS TO BE FETCHED BEFORE IT CAN BE
            # DIFFED (10 Sep 2026). actions/checkout takes depth 1, so github.event.before was
            # never in the object store: `git diff <before> <sha>` failed, 2>/dev/null ate the
            # error, grep -q matched nothing and stmt came out 0. A statements-only push could
            # therefore NEVER deploy the site, which is the one case this branch exists for --
            # the trigger's own comment says "a statements commit never moves the build id; it
            # deploys on its own paths". Found by a push that touched stmt/ and wrangler.stmt.jsonc
            # and deployed neither, with the run green. It only ever bit when live=1, because
            # every other path leaves stmt at the 1 it is initialised to, which is why the site
            # has been deploying happily on every fold.
            # AND IT FAILS SAFE NOW: if the base cannot be had at all, deploy rather than skip.
            # Deploying the statements site when nothing changed costs a redundant upload; not
            # deploying it when something did is a silent no-op, and this file has been bitten by
            # that class twice this week already.
            base='${{ github.event.before }}'
            stmt=1
            if git cat-file -e "$base^{commit}" 2>/dev/null \
               || git fetch --no-tags --depth=1 origin "$base" 2>/dev/null; then
              stmt=0
              if git diff --name-only "$base" "${{ github.sha }}" | grep -qE '^(statements/|stmt/|wrangler\.stmt\.jsonc|tools/stmt-publish\.mjs|tools/make_statements\.mjs)'; then stmt=1; fi
            else
              echo "::warning::the base commit $base could not be fetched, so the statements paths could not be compared; deploying the site rather than skipping it"
            fi
          fi
          echo "live=$live" >> "$GITHUB_OUTPUT"
          echo "stmt=$stmt" >> "$GITHUB_OUTPUT"
          echo "live=$live (phone on $got, repo at $want) stmt=$stmt"

      # THE GATE, NOT THE SUITE, STANDS BEFORE THE DEPLOY (v522). What must hold before a build
      # reaches the phone is mechanical and ci.yml already names it: tools/gate.mjs runs those
      # checks in about ten seconds. The full suite runs at the foot of this job, after the phone
      # is live, and fails the run loudly if it fails; it never pulls a correct ledger back off
      # the phone, because its post-fold failures have been its own fixtures moving with the book.
      - name: Gate
        if: steps.plan.outputs.deploy == '1' && steps.already.outputs.live != '1'
        run: node tools/gate.mjs

      - name: Deploy
        if: steps.plan.outputs.deploy == '1' && steps.already.outputs.live != '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: The phone is serving it
        if: steps.plan.outputs.deploy == '1'
        run: |
          set -euo pipefail
          want=$(node -p "require('./public/rev.json').id")
          for i in 1 2 3 4 5 6; do
            got=$(curl -fsS --max-time 20 https://salt-command.qyts8mh72kyg.workers.dev/rev | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).id")
            [ "$got" = "$want" ] && { echo "live at $got"; echo "LIVE_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"; exit 0; }
            echo "attempt $i: live=$got want=$want"
            sleep 10
          done
          echo "::error::the Worker is not serving $want after the deploy reported success"
          exit 1

      # ONLY NOW. A draft marked committed is never offered to the fold again, so it is marked
      # only once the row it became is demonstrably on the phone. The proof time rides with
      # the mark (v519), and the clock is printed per row into the run summary.
      - name: Mark the folded rows committed
        if: steps.plan.outputs.deploy == '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ ! -f master/_folded.json ]; then
            echo "No _folded.json, so nothing to mark. This is normal for a build with no fold in it."
            exit 0
          fi
          ids=$(node -p "(require('./master/_folded.json').ids||[]).join(' ')")
          if [ -z "$ids" ]; then echo "_folded.json names no ids."; exit 0; fi
          node tools/drafts.mjs --committed $ids --live "${LIVE_AT:-}"

      # OPTIONAL BY DESIGN: SALT_PUSH_KEY opens POST /push/send and nothing else. The secret is
      # tested in the shell, never in `if:`, because the secrets context there rejects the file.
      - name: Wake the phone
        if: steps.plan.outputs.deploy == '1'
        continue-on-error: true
        env:
          PUSH_KEY: ${{ secrets.SALT_PUSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${PUSH_KEY:-}" ]; then echo "No SALT_PUSH_KEY secret; nothing is woken. This step is optional."; exit 0; fi
          TEST="${{ inputs.test_push }}"
          if [ "$TEST" = "true" ]; then
            n="test"
          else
            if [ ! -f master/_folded.json ]; then echo "No fold in this build; not waking anyone."; exit 0; fi
            n=$(node -p "(require('./master/_folded.json').ids||[]).length")
            [ "$n" = "0" ] && { echo "Nothing folded."; exit 0; }
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H "X-Push-Key: $PUSH_KEY" -H "content-type: application/json" -d '{"tag":"folded"}' https://salt-command.qyts8mh72kyg.workers.dev/push/send)
          echo "push/send -> $code for $n folded row(s)"

      # A DEPLOY THAT FOLDED NOTHING MUST NOT UNSTAGE A WAITING BATCH (24 Aug 2026):
      # _folded.json is the proof a fold happened in this build; without it only _folded is
      # cleared, which is nothing, and the staged batch is left where the fold expects it.
      - name: Clear the handoff files
        if: steps.plan.outputs.deploy == '1'
        run: |
          set -euo pipefail
          changed=0
          files="master/_folded.json"
          if [ -f master/_folded.json ]; then files="master/_to_fold.json master/_folded.json"; else
            echo "No _folded.json: this build folded nothing, so any staged batch is left alone."
          fi
          for f in $files; do
            if [ -f "$f" ]; then git rm -q "$f"; changed=1; fi
          done
          [ "$changed" = "0" ] && exit 0
          git config user.name  "salt-command CI"
          git config user.email "noreply@github.com"
          git commit -m "Clear the fold handoff: the rows are on the phone and marked committed"
          # master can move while this runs; rebase onto its tip first. --autostash because the
          # suite rebuilds public/ and leaves it dirty, which refuses a rebase outright.
          git pull -q --rebase --autostash origin master
          git push

      # KEEP THE MIRROR LEVEL WITH THE BOOK (22 Aug 2026). The drafter measures every entry
      # against the snapshot in D1; a stale mirror is the silent fault this job exists to end.
      # Last of the ledger's steps, so a failure here leaves the deploy and the marks standing.
      - name: Re-seed the mirror from the master just shipped
        if: steps.plan.outputs.deploy == '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node tools/ledger.mjs
          node tools/d1.mjs --seed

      # ---- THE STATEMENTS SITE, after everything the ledger needs ------------------------
      # A second Worker on its own address with its own KV store (docs/STATEMENTS.md). Both
      # steps stand down while the store has not been created yet.
      - name: Deploy the statements site
        if: steps.plan.outputs.deploy == '1' && steps.already.outputs.stmt == '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if grep -q PLACEHOLDER_STMT_KV_ID wrangler.stmt.jsonc; then
            echo "::warning::wrangler.stmt.jsonc still carries the placeholder KV id; the statements site is not deployed. Create the store and commit its id (docs/STATEMENTS.md)."
            exit 0
          fi
          npx wrangler deploy -c wrangler.stmt.jsonc

      # THE STATEMENTS GO INTO THE SITE'S OWN KV, sealed under content keys derived from
      # STMT_KEY, so an approved row reaches the customer's page in the same run that reaches
      # the phone. Without the key the records go up exactly as issued.
      #
      # IT PUBLISHES ON EVERY DEPLOY, NOT ONLY WHEN A STATEMENTS PATH MOVED (16 Sep 2026). The step
      # above deploys the site's CODE and is rightly gated on stmt/, statements/ and the two tools.
      # This one writes the site's CONTENT, and the content is the ledger and the master: the sealed
      # price list is computed here from the desk's PRICING snapshot, so every version that moves a
      # price makes the published list stale. None of v652 (named-customer quotes), v654 (oil 80 and
      # 100 unit) or v655 (the best-rate rule) touched a statements path, so each left the customers'
      # pages on the lists sealed at v651 while the desk quoted something else, silently. The cost of
      # publishing anyway is one bulk call and about ten seconds of jsdom.
      # v698: ON EVERY DEPLOY, AND ON EVERY HOUR. An hourly run passes --no-retire, because the
      # publish retires an account whose record the newest issue does not carry, and that judgement
      # belongs to a deploy he made, not to a clock. A partial or botched issue read would otherwise
      # retire accounts twenty-four times a day instead of once. Writing is hourly; retiring is not.
      - name: Publish the statements, live
        if: steps.plan.outputs.publish == '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          STMT_KEY: ${{ secrets.STMT_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${STMT_KEY:-}" ]; then
            echo "::warning::STMT_KEY is not set, so no live statement is written. Add it as a repository secret (docs/STATEMENTS.md)."
          fi
          if [ "${{ steps.plan.outputs.deploy }}" = "1" ]; then
            node tools/stmt-publish.mjs
          else
            node tools/stmt-publish.mjs --no-retire
          fi

      # NOTHING RETIRES DESK KEYS BY PREFIX HERE, and nothing may be added that does (10 Sep 2026).
      # A step stood here from 03 Sep that listed the desk's store for the prefix "stmt" and deleted
      # what it found. It was written as a one-off, to clear the old route's stmt:, stmtfail: and
      # stmtseen: keys, and its own comment said "later runs find nothing". Later runs found the two
      # keys the publish had just written: "stmt" is a prefix of stmt-users, and of stmt-site after
      # v564. So every deploy for a week wrote both and deleted both about five seconds later, and
      # the log said "retired stmt-users" in plain words where nobody was reading. The old keys are
      # long gone; the step's work was done on its first run. The publish now reads both keys back,
      # which catches a write that fails but NOT a later step that undoes it, so this stays absent.

      # ---- THE FULL SUITE, AFTER THE PHONE IS LIVE (v522) --------------------------------
      # Off the critical path: the clock has stopped by now. A failure turns the run red, which
      # emails, and is written where the phone shows refusals under a synthetic id above the
      # watermark, so it is seen on the Approve view until someone clears it.
      - name: The full suite, after the phone is live
        id: suite
        if: steps.plan.outputs.deploy == '1'
        run: npm test

      - name: Say so on the phone if the suite failed
        if: always() && steps.suite.outcome == 'failure'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          v=$(node -p "require('./master/changelog.json')[0].v")
          node tools/drafts.mjs --refused-note "suite:$v" "The test suite failed after $v went live. The phone is serving $v; read the run ${{ github.run_id }} before the next fold."
