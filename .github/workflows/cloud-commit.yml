# THE TWO HALVES OF THE CLOUD COMMIT THAT NEED A CREDENTIAL, added 20 Aug 2026.
#
# WHY THIS EXISTS, AND WHY THE EARLIER CLAIM THAT CI NEEDS NO SECRETS WAS WRONG.
# ci.yml holds nothing and should stay that way. But once the laptop is off the critical path,
# two steps of the daily commit still need Cloudflare credentials and nothing else can hold
# them: reading the APPROVED rows out of D1, and running `wrangler deploy`. A scheduled cloud
# agent gets a git checkout and no secrets, so it cannot do either. The deploy has to live
# somewhere, and with the laptop retired that somewhere is here.
#
# THE SPLIT, AND THE RULE BEHIND IT. The credential does the two mechanical things. The
# JUDGEMENT stays with the agent, because rolling STATED_STOCK, writing a row's note, writing
# the evolution entry and deciding what an amendment amends are not arithmetic, and a job that
# folded rows and dropped the prose would be a worse ledger.
#
#   on a tap, and hourly   stage    this file    D1 -> master/_to_fold.json, committed
#   same run, if staged    fold     the agent    the Claude Code action: folds, bumps, builds, tests, pushes
#   same run, and on push  deploy   this file    wrangler deploy, then mark those ids committed
#   11:00 MYT              prove    ship-check.yml
#
# (Until 03 Sep 2026 the fold was a cloud routine, six-hourly and then on demand; see the
# fold job below for why it moved in here.)
#
# SETUP, AND IT IS THE ONE THING ONLY HE CAN DO:
#   gh secret set CLOUDFLARE_API_TOKEN
# The token needs Workers Scripts:Edit, Workers KV:Edit and D1:Edit on the account. Nothing
# here runs until it exists; both jobs check for it and say so rather than failing obscurely.
# Two more since 03 Sep 2026:
#   claude setup-token, then  gh secret set CLAUDE_CODE_OAUTH_TOKEN     (the fold job's agent)
#   npx wrangler secret put SALT_GITHUB_TOKEN                            (the Worker's dispatch:
#     a fine-grained GitHub token on this repo alone, Actions read and write, nothing else)
name: Cloud commit

on:
  schedule:
    # HOURLY. Originally against a fold that ran every SIX hours (his instruction of 20 Aug);
    # that routine is disabled from 24 Aug and folding is on demand instead (CLAUDE.md,
    # "Retiring Cowork"). Staging still runs on its own clock regardless of when, or whether
    # by clock at all, a fold comes: a batch stays ready and recent for whenever one is asked
    # for, and it is still what answers "is anything waiting" without needing D1 credentials.
    # Staging twice an hour, as this briefly did, was 48 runs a day for no gain even against
    # the old four-a-day fold, so hourly stands.
    #
    # THE CLOCK IS NOT THE GUARD, AND THAT WAS THE FIRST DESIGN'S MISTAKE. This was offset to
    # clear a fold at :00, and the routine API then JITTERED the fold's minute of its own
    # accord, twice: to :41, then to :52. A schedule whose safety depends on another scheduler
    # keeping the minute you asked for is not safe. The real guard is in the job: it refuses to
    # overwrite a batch that has not been folded yet. See "Do not trample an unfolded batch".
    - cron: '5 * * * *'
  push:
    branches: [master]
    paths:
      - 'public/rev.json'
      # A STATEMENTS COMMIT NEVER MOVES THE BUILD ID, AND THAT LEFT THE FIRST ISSUE UNPUBLISHED
      # (03 Sep 2026). rev.json hashes the master, sw.js and src/*.js; an issue writes under
      # statements/ and touches none of them, so the merge that carried thirty-seven encrypted
      # September records fired nothing, the publish step below never ran, and every QR code
      # answered "no statement published". The step existed and was correct; nothing ever
      # reached it. A commit under statements/ now deploys, which on a push runs only the
      # deploy job: stage and fold are gated to schedule and dispatch, and the handoff step
      # leaves a staged batch alone when no fold happened.
      - 'statements/**'
      # THE STATEMENTS SITE IS ITS OWN WORKER (03 Sep 2026) and nothing in rev.json hashes it,
      # so a change to it deploys on its own paths. See the two steps at the foot of deploy.
      - 'stmt/**'
      - 'wrangler.stmt.jsonc'
  workflow_dispatch:
    inputs:
      # THE WORKER DISPATCHES THIS ON EVERY APPROVAL (03 Sep 2026), with stage_only set, so
      # a tap on the phone stages within a minute instead of within the hour. Such a run is
      # stage and fold only: the fold's own push is what starts the deploy run.
      stage_only:
        description: 'Stage the approved rows and stop; do not deploy'
        type: boolean
        default: false
      test_push:
        description: 'Send a test push, even with no fold in this build'
        type: boolean
        default: false

concurrency:
  group: cloud-commit
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # STAGE: put the approved, uncommitted rows where an agent with no secrets can
  # read them. It writes nothing to the ledger and decides nothing.
  # ---------------------------------------------------------------------------
  stage:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      staged: ${{ steps.guard.outputs.staged == '1' || steps.commit.outputs.staged == '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci

      - name: The credential exists
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set. Run: gh secret set CLOUDFLARE_API_TOKEN"
            exit 1
          fi

      # DO NOT TRAMPLE AN UNFOLDED BATCH.
      #
      # If master/_to_fold.json is still in HEAD, the agent has not folded the last batch yet:
      # either it is running right now, or its run failed. Writing a fresh batch over it would
      # hand the agent a file it has already partly read, and the deploy job would afterwards
      # clear a file carrying rows nobody folded. Those rows would still be approved and
      # uncommitted in D1, so nothing is LOST, but they would be silently deferred and the
      # logs would all read green.
      #
      # So the stage stands down and says so. The next tick, half an hour later, picks it up.
      - name: Stand down if the last batch is still unfolded
        id: guard
        run: |
          set -euo pipefail
          if git cat-file -e HEAD:master/_to_fold.json 2>/dev/null; then
            n=$(git show HEAD:master/_to_fold.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).count")
            echo "::notice::A batch of $n row(s) is staged and not yet folded. Standing down rather than overwriting it."
            echo "skip=1" >> "$GITHUB_OUTPUT"
            # A batch that is already staged is still a batch to fold, so the fold job runs on
            # this tick too. That is how a batch left behind by a failed fold job, or staged
            # before the fold job existed, is picked up within the hour rather than never.
            echo "staged=1" >> "$GITHUB_OUTPUT"
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Read the approved rows out of D1
        if: steps.guard.outputs.skip == '0'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node tools/drafts.mjs --approved > master/_to_fold.json
          node -e "
            const j=require('./master/_to_fold.json');
            if(!j.ok) { console.error('::error::drafts.mjs did not report ok'); process.exit(1); }
            console.log('approved and uncommitted: '+j.count);
          "

      # COMMIT IT, AND PROVE IT WAS COMMITTED.
      #
      # THE FIRST VERSION OF THIS STEP WAS SILENTLY BROKEN AND THE FIRST RUN CAUGHT IT ONLY
      # BECAUSE THE COUNT WAS ZERO. It asked `git diff --quiet -- master/_to_fold.json`, and
      # git diff does not see an UNTRACKED file: on the first real run the file would have been
      # written, reported as "nothing new", and never committed. The agent would then have
      # found no _to_fold.json, correctly concluded there was nothing to fold, and stopped.
      # Approved rows would have sat unfolded indefinitely with every job green. That is the
      # same shape as the 10 Aug deploy and the 19 Aug ship: a healthy log over a dead leg.
      #
      # So: `git status --porcelain`, which sees untracked files, and then an ASSERTION that
      # the file is actually in HEAD when there was anything to stage. A step that reports
      # success without checking its own effect is the fault this repo keeps writing tests for.
      - name: Commit it, and prove it
        id: commit
        if: steps.guard.outputs.skip == '0'
        run: |
          set -euo pipefail
          echo "staged=0" >> "$GITHUB_OUTPUT"
          count=$(node -p "require('./master/_to_fold.json').count")
          if [ "$count" = "0" ]; then
            # Deliberately NOT committed. Its absence is the signal the agent stops on, and a
            # daily commit of an empty file would be noise that hides the days that matter.
            echo "Nothing approved is waiting, so nothing is staged."
            rm -f master/_to_fold.json
            exit 0
          fi
          git config user.name  "salt-command CI"
          git config user.email "noreply@github.com"
          git add -f master/_to_fold.json
          if [ -n "$(git status --porcelain -- master/_to_fold.json)" ]; then
            git commit -m "Stage $count approved row(s) for the fold"
            git push
          else
            echo "The staged file is unchanged from the last run."
          fi
          # THE ASSERTION. Whatever path was taken above, the file must now be in HEAD.
          if ! git cat-file -e HEAD:master/_to_fold.json 2>/dev/null; then
            echo "::error::$count row(s) were staged but master/_to_fold.json is not in HEAD. The fold would find nothing and stop, and the rows would sit unfolded."
            exit 1
          fi
          echo "Staged $count row(s) and confirmed the file is in HEAD."
          echo "staged=1" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # DEPLOY: the phone gets what was just pushed, and only then are the folded
  # rows marked committed. THAT ORDER MATTERS. Marking first and failing to
  # deploy would leave a row recorded as shipped while the phone still shows the
  # old book, which is the exact silent failure of 10 and 19 Aug.
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # FOLD: the judgement, run by an agent INSIDE this workflow (his instruction, 03 Sep 2026:
  # approve, stage, fold, commit, push and deploy together, or within minutes).
  #
  # The fold was a cloud routine on a six-hourly clock, then on demand. Neither is "within
  # minutes of the tap". A routine webhook cannot do it either: the routine API fires on pull
  # request and release events only, never a push. So the agent runs here, between the stage
  # and the deploy, as the Claude Code action on the owner's subscription token. It follows
  # docs/CLOUD_FOLD.md exactly as the routine did, and holds no Cloudflare credential: this
  # job's secret can fold a book and push a commit, and nothing else.
  #
  # THE ACTION PUSHES AS THE CLAUDE GITHUB APP, NOT AS THE RUNNER, and that push starts the
  # deploy run like any other. The first version of this job assumed the opposite (a push
  # made with GITHUB_TOKEN starts nothing) and chained a deploy onto this run as well, which
  # would have deployed and woken the phone twice per fold. Proved on the first real fold,
  # 03 Sep 2026: the action's push started run 33717101758, which deployed v480. So this job
  # ends when the agent has pushed, and nothing here reads the remote afterwards, because the
  # action rewrites the remote's credentials for its own push and revokes them on the way out.
  # ---------------------------------------------------------------------------
  fold:
    needs: stage
    if: needs.stage.outputs.staged == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with: { ref: master }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci

      - name: The credential exists
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set. Run: claude setup-token, then gh secret set CLAUDE_CODE_OAUTH_TOKEN. The batch stays staged; fold it by hand or fire the backup routine."
            exit 1
          fi
          git config user.name  "salt-command fold"
          git config user.email "noreply@github.com"

      - name: Fold
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          claude_args: '--model claude-opus-5 --allowedTools "Bash,Read,Write,Edit,Glob,Grep" --max-turns 80'
          prompt: |
            You are the fold for the Salt Command trading book, running as the fold job of
            .github/workflows/cloud-commit.yml. This is a real ledger with real money in it; be
            exact and never guess a figure.

            The stage job has just written master/_to_fold.json to master and this checkout is
            master's tip. Two stops come first. If master/_to_fold.json is absent, nothing is
            staged: say so in one line and stop. If master/_folded.json is present, the last batch
            is folded and waiting for its deploy: say so in one line and stop.

            Read these next, in this order, and follow them:
              1. docs/CLOUD_FOLD.md  - your procedure. It is authoritative and short. The book is
                 ledger/book.json and the fold is done by a tool; the rows in
                 master/salt_command.html are a generated copy and are never edited by hand.
              2. CLAUDE.md           - the repo's hard rules.

            In one line: run `node tools/fold.mjs --plan`. If it says there is nothing to fold, say
            so in one line and stop without bumping a version. Otherwise read the plan, fill in
            master/_fold_notes.json (a note for every new row written as a person auditing it
            would need, a trail note for every amendment, the next version, a title in capitals,
            the notes array, and your sentence on the roll), run `node tools/fold.mjs --apply`,
            then `node tools/ledger.mjs`, then `npm run build && npm test`, then commit
            everything it wrote with a message naming the version and what was folded, and push
            with `git push origin HEAD:master`. Git identity is already configured. The deploy
            job that follows in this run deploys, marks the rows committed and clears the
            handoff files; do not run npm run deploy, do not mark anything committed and do not
            delete the handoff files yourself.

            A refusal folds nothing: if --plan or --apply refuses anything, report it plainly and
            stop. Never edit the rows in the master, never write a real name: codes only,
            everywhere, including in a note. A Modification and a Correction are mechanical and
            fold like any other amendment; a Linked or Rewarded amendment is refused by the tool
            and left for a person.

            You have no Cloudflare credential and must not look for one. House style, and it is
            not optional: British English, no em-dashes, RM and 'unit' only (never kg or kilo),
            codes only and never a real name.

            Before you push, state plainly what you folded, what you refused and why, and any
            figure you were unsure of. If anything looks wrong, fold nothing and say so: a day
            with no commit is cheap and a wrong row is not.

  deploy:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.stage_only)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { ref: master }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci

      - name: The credential exists
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set. Run: gh secret set CLOUDFLARE_API_TOKEN"
            exit 1
          fi

      - run: npm test

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: The phone is serving it
        run: |
          set -euo pipefail
          want=$(node -p "require('./public/rev.json').id")
          for i in 1 2 3 4 5 6; do
            got=$(curl -fsS --max-time 20 https://salt-command.qyts8mh72kyg.workers.dev/rev | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).id")
            [ "$got" = "$want" ] && { echo "live at $got"; exit 0; }
            echo "attempt $i: live=$got want=$want"
            sleep 10
          done
          echo "::error::the Worker is not serving $want after the deploy reported success"
          exit 1

      # ONLY NOW. A draft marked committed is a draft the commit run will never offer again,
      # so it must not be marked until the row it became is demonstrably on the phone.
      - name: Mark the folded rows committed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ ! -f master/_folded.json ]; then
            echo "No _folded.json, so nothing to mark. This is normal for a build with no fold in it."
            exit 0
          fi
          ids=$(node -p "(require('./master/_folded.json').ids||[]).join(' ')")
          if [ -z "$ids" ]; then echo "_folded.json names no ids."; exit 0; fi
          node tools/drafts.mjs --committed $ids

      # TELL THE PHONE, IF THERE IS A KEY TO DO IT WITH.
      #
      # OPTIONAL BY DESIGN. /push/send is write-gated like everything else that carries the
      # book, so this needs SALT_WRITE_KEY as a second repo secret. It is skipped silently
      # without one, because the two pushes that matter most (a row waiting, and the morning
      # nudge) come from the Worker itself and need nothing here.
      #
      # A FOLD IS ALSO NOT THE MOST USEFUL BANNER. The phone reloads itself within ten seconds
      # of a new build anyway, so this mostly tells him something he is about to see. It earns
      # its place only when he is away from the app.
      # IT USES SALT_PUSH_KEY, NOT THE WRITE KEY. The write key authorises the queue, the
      # vault and draft approvals, which is the whole ledger, and a GitHub Actions secret is
      # readable by anyone who can land a workflow here. A notification step gets a key that
      # opens POST /push/send and nothing else. See pushKeyOk() in src/worker.js.
      #
      # THE SECRET IS TESTED IN THE SHELL, NOT IN `if:`. The first version wrote
      # `if: ${{ secrets.SALT_WRITE_KEY != '' }}` and GitHub REJECTED THE WHOLE FILE, because
      # the `secrets` context is not available in an if condition. The run had ZERO jobs, no
      # logs, and was named by its file path rather than "Cloud commit", which is the tell that
      # a workflow failed to PARSE rather than failed to run.
      #
      # It was loud, which is the only good thing about it: it emailed. But between adding it
      # and fixing it, the stage and deploy jobs were dead, and a workflow that cannot parse
      # does not run its cron either. A broken optional step took the whole file with it.
      - name: Wake the phone
        continue-on-error: true
        env:
          PUSH_KEY: ${{ secrets.SALT_PUSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${PUSH_KEY:-}" ]; then echo "No SALT_PUSH_KEY secret; nothing is woken. This step is optional."; exit 0; fi
          TEST="${{ inputs.test_push }}"
          if [ "$TEST" = "true" ]; then
            n="test"
          else
            if [ ! -f master/_folded.json ]; then echo "No fold in this build; not waking anyone."; exit 0; fi
            n=$(node -p "(require('./master/_folded.json').ids||[]).length")
            [ "$n" = "0" ] && { echo "Nothing folded."; exit 0; }
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H "X-Push-Key: $PUSH_KEY" -H "content-type: application/json" -d '{"tag":"folded"}' https://salt-command.qyts8mh72kyg.workers.dev/push/send)
          echo "push/send -> $code for $n folded row(s)"

      # A PUSH THAT FOLDED NOTHING MUST NOT UNSTAGE A WAITING BATCH, fixed 24 Aug 2026.
      # This cleared master/_to_fold.json on EVERY push. A v344 push that touched only the cost
      # basis therefore deleted a batch approved on 23 Aug and still unfolded, which is the very
      # file the stage job reads to decide whether to stand down. Nothing was lost, because D1
      # stays authoritative until `drafts.mjs --committed` runs and neither row was marked, so
      # the next hourly stage re-staged them. It is still wrong: the guard was gone for a cycle
      # and the batch was delayed by one.
      # _folded.json is the proof that a fold happened in THIS push. Without it, only _folded is
      # cleared (there is none) and the waiting batch is left exactly where the fold expects it.
      - name: Clear the handoff files
        run: |
          set -euo pipefail
          changed=0
          files="master/_folded.json"
          if [ -f master/_folded.json ]; then files="master/_to_fold.json master/_folded.json"; else
            echo "No _folded.json: this push folded nothing, so any staged batch is left alone."
          fi
          for f in $files; do
            if [ -f "$f" ]; then git rm -q "$f"; changed=1; fi
          done
          [ "$changed" = "0" ] && exit 0
          git config user.name  "salt-command CI"
          git config user.email "noreply@github.com"
          git commit -m "Clear the fold handoff: the rows are on the phone and marked committed"
          # Master can move while this job runs (on 03 Sep 2026 a merge landed in the same
          # minute and this push was refused), so rebase onto its tip first. Nothing else
          # touches these two files, so the rebase cannot conflict.
          git pull -q --rebase origin master
          git push

      # KEEP THE MIRROR LEVEL WITH THE BOOK, added 22 Aug 2026.
      #
      # The drafter confirms every amendment against the open-order snapshot in D1 and costs
      # every draft off the PRICING snapshot there, and both come from the last seed. Nothing in
      # the cloud chain re-seeded after the master moved here: the mirror sat at v320 (seeded
      # 20 Aug, 12:07 KL) while v321 to v331 folded, so every fulfilment queued after it was
      # refused as matching no open order, the refusal told him the order had been settled, he
      # typed each one again, and three drafts in a row carried a shelf rate that had moved.
      # Nine queue entries for three events and one sale, all found on 22 Aug.
      #
      # LAST OF THE LEDGER'S STEPS, so a failure here leaves the deploy and the committed marks
      # standing. It still fails the run, because a stale mirror is exactly the silent fault
      # this job exists to end.
      - name: Re-seed the mirror from the master just shipped
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node tools/ledger.mjs
          node tools/d1.mjs --seed

      # ---- THE STATEMENTS SITE, after everything the ledger needs ------------------------
      # A second Worker on its own cryptic address (stmt/worker.js, wrangler.stmt.jsonc), with
      # its own KV store. Both steps come AFTER the ledger's, so a fault in the statements can
      # never leave a folded row unmarked or the mirror stale, and both stand down while the
      # store has not been created yet (the placeholder id is still in the config), so an
      # unfinished setup cannot turn a ledger deploy red.
      - name: Deploy the statements site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if grep -q PLACEHOLDER_STMT_KV_ID wrangler.stmt.jsonc; then
            echo "::warning::wrangler.stmt.jsonc still carries the placeholder KV id; the statements site is not deployed. Create the store and commit its id (docs/STATEMENTS.md)."
            exit 0
          fi
          npx wrangler deploy -c wrangler.stmt.jsonc

      # THE STATEMENTS GO INTO THE SITE'S OWN KV, NOT INTO public/. Under public/ they would be
      # served by an asset store, which knows nothing about a password: the ciphertext would be
      # fetchable by anyone who guessed a filename and the whole gate would be decoration. This
      # step is the only thing that publishes a statement, and it holds one secret beyond the
      # Cloudflare token the job already has: STMT_KEY, from which every customer's content key
      # is derived. With it, every record goes up with a LIVE statement sealed inside, every
      # entry from the start to this minute, so an approved row reaches the customer's page in
      # the same run that reaches the phone. Without it the records go up exactly as issued.
      #
      # tools/stmt-publish.mjs does the rest: the newest issue only, one bulk call, every record
      # the issue does not carry retired (so last month's password stops opening anything the
      # moment a new one is issued), and the attempt counters cleared on a new issue only.
      - name: Publish the statements, live
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          STMT_KEY: ${{ secrets.STMT_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${STMT_KEY:-}" ]; then
            echo "::warning::STMT_KEY is not set, so no live statement is written. Add it as a repository secret (docs/STATEMENTS.md)."
          fi
          node tools/stmt-publish.mjs

      # THE OLD ROUTE'S KEYS ON THE DESK'S STORE (stmt:, stmtfail:, stmtseen:) are gone with the
      # route. Deleted here rather than by hand, once; later runs find nothing. Best effort:
      # the desk never reads them again either way.
      - name: Retire the old statement keys from the desk's store
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler kv key list --remote --binding SALT_QUEUE --prefix "stmt" > .old-keys.json || true
          for k in $(node -e "
            const t=require('fs').readFileSync('.old-keys.json','utf8'); const i=t.indexOf('[');
            if(i>=0) for(const k of JSON.parse(t.slice(i))) console.log(k.name);
          "); do
