# SHIP CHECK, added 20 Aug 2026.
#
# THE ONE QUESTION IT ASKS: is the thing on his phone the thing in this repo?
#
# This is the check the repo has been missing, and the absence has cost twice. On 10 Aug a
# session built, a sync pass rebuilt identical bytes, saw no difference and reported the phone
# current while a new bundle sat undeployed. On 19 Aug a run shipped the master but not the
# cloud. Both failures were SILENT: every exit code was zero and every log read healthy.
#
# So it compares two recorded facts that cannot drift innocently: the build id committed in
# public/rev.json, and the id the live Worker serves at /rev. If they differ, something was
# committed and never deployed, or deployed and never committed, and either way somebody
# should be told rather than finding out from a stale figure on a phone.
#
# It needs NO SECRETS: /rev is deliberately open, being a build id that carries no trade.
name: Ship check

on:
  schedule:
    # 03:00 UTC is 11:00 in Kuala Lumpur.
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  level:
    runs-on: ubuntu-latest
    # BOUNDED (26 Sep 2026): it runs in seconds; GitHub's default is six hours.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5      # v5 runs on Node 24; v4 targeted the retired Node 20 (09 Sep 2026)

      - name: The live Worker serves what this repo committed
        run: |
          set -euo pipefail
          repo_id=$(node -p "require('./public/rev.json').id")
          repo_v=$(node -p "require('./public/rev.json').v")
          live=$(curl -fsS --max-time 20 https://salt-command.qyts8mh72kyg.workers.dev/rev)
          live_id=$(node -p "JSON.parse(process.argv[1]).id" "$live")
          live_v=$(node -p "JSON.parse(process.argv[1]).v" "$live")
          echo "repo  $repo_v  $repo_id"
          echo "live  $live_v  $live_id"
          if [ "$repo_id" != "$live_id" ]; then
            echo "::error::The phone is not running what this repo committed. repo=$repo_id live=$live_id. Something was committed and not deployed, or deployed and not committed."
            exit 1
          fi
          echo "Level."

      # A BUILD ID THAT NEVER MOVES IS ITS OWN KIND OF FAULT. The book is traded most days, so
      # a week of an unchanged id means the fold stopped running and nobody noticed. Reported
      # as a warning rather than a failure, because a quiet week is possible and a red cross
      # nobody believes is worse than no cross at all.
      #
      # `built` IS WHEN THE ID LAST MOVED, NOT WHEN A BUILD LAST RAN (18 Sep 2026), which is the
      # question this step is actually asking. It used to be minted on every build, and that made
      # this warning WEAKER, not stronger: any no-op `node tools/update.mjs` reset the clock, so a
      # fold that had stopped could be hidden here indefinitely by rebuilds that produced identical
      # bytes. A rebuild of the same bytes never was evidence that the fold ran. tools/build.mjs
      # now keeps the stamp whenever the id and the version both stand, which also stopped those
      # rebuilds committing a timestamp and setting off the whole cloud-commit chain.
      - name: The build id is still moving
        run: |
          set -euo pipefail
          built=$(node -p "require('./public/rev.json').built")
          age=$(( ( $(date -u +%s) - $(date -u -d "$built" +%s) ) / 86400 ))
          echo "the build id last moved: $built ($age days ago)"
          if [ "$age" -gt 7 ]; then
            echo "::warning::The build id has not moved for $age days. If the book has traded in that time, the fold is not running."
          fi
